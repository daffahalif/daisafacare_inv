<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DaisafaCare — Management System</title>
  <meta name="description" content="Sistem manajemen jadwal dan invoice Daisafacare Mom & Baby Treatment">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    // Pemeriksa mandiri: tampilkan pesan bila file HTML ini rusak / tidak lengkap setelah di-paste
    (function () {
      function showErr(msg) {
        var el = document.getElementById('jsErrBanner');
        if (!el) {
          el = document.createElement('div');
          el.id = 'jsErrBanner';
          el.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#b00020;color:#fff;font:12px/1.5 monospace;padding:8px 10px;white-space:pre-wrap';
          (document.body || document.documentElement).appendChild(el);
        }
        el.textContent = 'Terjadi kesalahan JavaScript: ' + msg;
      }
      window.addEventListener('error', function (e) { showErr((e.message || e.type) + (e.lineno ? ' (baris ' + e.lineno + ')' : '')); });
      window.addEventListener('load', function () {
        if (typeof bootstrapApp !== 'function') showErr('File index.html tidak lengkap/rusak — fungsi bootstrapApp tidak ditemukan.');
      });
    })();
  </script>
  <style>
    /* ═══════════════════════════════════════════════════════════
   DESIGN SYSTEM — DAISAFACARE BRAND
   Palette: #85957A (sage green) | #B8C2AA (light sage)
            #A6B3A5 (slate) | #D4C2AA (beige) | #FCF7F1 (cream)
═══════════════════════════════════════════════════════════ */
    :root {
      --sage: #85957A;
      --sage-dark: #6e7d65;
      --sage-light: #B8C2AA;
      --slate: #A6B3A5;
      --beige: #D4C2AA;
      --beige-dark: #C4AE96;
      --cream: #FCF7F1;
      --cream-dark: #F5EDE2;
      --white: #FFFFFF;
      --text: #2D3A2E;
      --text-sec: #6B7A6C;
      --text-muted: #9AA69B;
      --border: #E2EBE2;
      --border-light: #EFF5EF;
      --success: #4CAF7D;
      --success-bg: #E8F5EE;
      --warning: #F59E0B;
      --warning-bg: #FEF3C7;
      --danger: #E05252;
      --danger-bg: #FEECEC;
      --info: #5B8FB9;
      --info-bg: #EAF2FB;
      --shadow-sm: 0 1px 3px rgba(45, 58, 46, 0.06);
      --shadow-md: 0 4px 16px rgba(45, 58, 46, 0.10);
      --shadow-lg: 0 12px 40px rgba(45, 58, 46, 0.14);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --sidebar-w: 260px;
      --font: 'Plus Jakarta Sans', sans-serif;
      --font-display: 'Playfair Display', serif;
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font);
      background: var(--cream);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    input,
    select,
    textarea,
    button {
      font-family: var(--font);
      font-size: 15px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
    }

    /* ─── Scrollbar ─── */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--sage-light);
      border-radius: 6px;
    }

    /* ─── LOGIN ─── */
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, var(--sage-dark) 0%, var(--sage) 50%, #7a8e70 100%);
      position: relative;
      overflow: hidden;
    }

    .login-page::before {
      content: '';
      position: absolute;
      top: -100px;
      right: -80px;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.07);
    }

    .login-page::after {
      content: '';
      position: absolute;
      bottom: -120px;
      left: -100px;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
    }

    .login-card {
      background: var(--white);
      border-radius: var(--radius-xl);
      padding: 48px 44px 40px;
      max-width: 420px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      position: relative;
      z-index: 1;
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(32px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-logo-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--sage), var(--sage-dark));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 36px;
      box-shadow: 0 8px 24px rgba(133, 149, 122, 0.35);
    }

    .login-logo h1 {
      font-family: var(--font-display);
      font-size: 26px;
      color: var(--sage-dark);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .login-logo p {
      color: var(--text-sec);
      font-size: 13px;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sec);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 15px;
      color: var(--text);
      background: var(--cream);
      transition: all 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--sage);
      box-shadow: 0 0 0 3px rgba(133, 149, 122, 0.15);
      background: var(--white);
    }

    .pwd-wrap {
      position: relative;
    }

    .pwd-wrap input {
      padding-right: 46px;
    }

    .pwd-eye {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      font-size: 15px;
      transition: color 0.2s;
    }

    .pwd-eye:hover {
      color: var(--sage);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--sage), var(--sage-dark));
      color: var(--white);
      border: none;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s;
      margin-top: 8px;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 14px rgba(133, 149, 122, 0.35);
    }

    .btn-login:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(133, 149, 122, 0.45);
    }

    .btn-login:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .login-error {
      background: var(--danger-bg);
      color: var(--danger);
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      margin-top: 16px;
      font-size: 13px;
      font-weight: 500;
      border-left: 3px solid var(--danger);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ─── APP LAYOUT ─── */
    .app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ─── SIDEBAR ─── */
    .sidebar {
      width: var(--sidebar-w);
      background: linear-gradient(180deg, var(--sage-dark) 0%, #5e6f56 100%);
      color: var(--white);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
      box-shadow: 2px 0 12px rgba(45, 58, 46, 0.15);
      scrollbar-width: none;
    }

    .sidebar::-webkit-scrollbar {
      display: none;
    }

    .sidebar-brand {
      padding: 26px 20px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .sidebar-brand-name {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .sidebar-brand-tag {
      font-size: 11px;
      opacity: 0.75;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    .sidebar-user {
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.15);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sidebar-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      flex-shrink: 0;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .sidebar-uname {
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.3;
    }

    .sidebar-urole {
      font-size: 11px;
      opacity: 0.7;
      text-transform: capitalize;
      margin-top: 1px;
    }

    .sidebar-nav {
      flex: 1;
      padding: 14px 12px;
    }

    .sidebar-section-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      padding: 12px 8px 6px;
    }

    .nav-item {
      width: 100%;
      text-align: left;
      padding: 11px 12px;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.85);
      cursor: pointer;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
      margin-bottom: 2px;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--white);
    }

    .nav-item.active {
      background: rgba(255, 255, 255, 0.2);
      color: var(--white);
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .nav-item i {
      width: 20px;
      text-align: center;
      font-size: 16px;
      opacity: 0.9;
    }

    .sidebar-bottom {
      padding: 14px 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn-logout {
      width: 100%;
      padding: 11px 12px;
      background: rgba(224, 82, 82, 0.18);
      border: 1px solid rgba(224, 82, 82, 0.35);
      color: rgba(255, 255, 255, 0.9);
      cursor: pointer;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background: rgba(224, 82, 82, 0.35);
      color: var(--white);
    }

    /* ─── MAIN ─── */
    .main {
      flex: 1;
      overflow-y: auto;
      background: var(--cream);
      display: flex;
      flex-direction: column;
    }

    .topbar {
      background: var(--white);
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .topbar-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .topbar-date {
      font-size: 13px;
      color: var(--text-muted);
      background: var(--cream);
      padding: 7px 14px;
      border-radius: 20px;
      font-weight: 500;
    }

    .page-content {
      padding: 24px 28px;
      flex: 1;
    }

    /* ─── BUTTONS ─── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px 20px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-primary {
      background: var(--sage);
      color: var(--white);
      box-shadow: 0 2px 8px rgba(133, 149, 122, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--sage-dark);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(133, 149, 122, 0.4);
    }

    .btn-beige {
      background: var(--beige);
      color: var(--text);
    }

    .btn-beige:hover:not(:disabled) {
      background: var(--beige-dark);
      transform: translateY(-1px);
    }

    .btn-danger {
      background: var(--danger);
      color: var(--white);
    }

    .btn-danger:hover:not(:disabled) {
      background: #c94444;
      transform: translateY(-1px);
    }

    .btn-outline {
      background: transparent;
      color: var(--sage);
      border: 1.5px solid var(--sage);
    }

    .btn-outline:hover:not(:disabled) {
      background: var(--sage);
      color: var(--white);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-sec);
      border: 1.5px solid var(--border);
    }

    .btn-ghost:hover:not(:disabled) {
      border-color: var(--sage);
      color: var(--sage);
    }

    .btn-sm {
      padding: 7px 14px;
      font-size: 13px;
    }

    .btn-icon {
      padding: 8px;
      width: 36px;
      height: 36px;
    }

    /* ─── CARDS ─── */
    .card {
      background: var(--white);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
    }

    .card-header {
      padding: 18px 22px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-body {
      padding: 18px 22px;
    }

    /* ─── KPI CARDS ─── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .kpi-card {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 20px 22px;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
    }

    .kpi-card.green::before {
      background: linear-gradient(90deg, var(--sage), var(--sage-light));
    }

    .kpi-card.beige::before {
      background: linear-gradient(90deg, var(--beige), var(--beige-dark));
    }

    .kpi-card.success::before {
      background: linear-gradient(90deg, var(--success), #3da867);
    }

    .kpi-card.danger::before {
      background: linear-gradient(90deg, var(--danger), #c94444);
    }

    .kpi-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .kpi-ico {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-bottom: 14px;
    }

    .kpi-ico.green {
      background: linear-gradient(135deg, var(--sage), var(--sage-dark));
      color: var(--white);
    }

    .kpi-ico.beige {
      background: linear-gradient(135deg, var(--beige), var(--beige-dark));
      color: var(--text);
    }

    .kpi-ico.success {
      background: linear-gradient(135deg, var(--success), #3da867);
      color: var(--white);
    }

    .kpi-ico.danger {
      background: linear-gradient(135deg, var(--danger), #c94444);
      color: var(--white);
    }

    .kpi-val {
      font-size: 26px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .kpi-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ─── DASHBOARD HERO ─── */
    .dash-hero {
      background: linear-gradient(135deg, var(--sage-dark) 0%, var(--sage) 60%, #96a88b 100%);
      border-radius: var(--radius-lg);
      padding: 28px 32px;
      color: var(--white);
      margin-bottom: 22px;
      position: relative;
      overflow: hidden;
    }

    .dash-hero::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -40px;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.07);
    }

    .dash-hero::after {
      content: '';
      position: absolute;
      bottom: -50px;
      right: 100px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
    }

    .dash-hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      position: relative;
      z-index: 1;
    }

    .dash-hero-greet {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .dash-hero-sub {
      font-size: 13px;
      opacity: 0.85;
    }

    .dash-hero-badge {
      background: rgba(255, 255, 255, 0.18);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dash-hero-stats {
      display: flex;
      gap: 36px;
      padding-top: 20px;
      margin-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
      z-index: 1;
    }

    .dash-stat-val {
      font-size: 22px;
      font-weight: 800;
      line-height: 1;
    }

    .dash-stat-lbl {
      font-size: 11px;
      opacity: 0.75;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-top: 4px;
    }

    /* ─── GRID LAYOUTS ─── */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 18px;
    }

    /* Kartu terakhir yang ganjil (tanpa pasangan) memakai lebar penuh */
    .grid-2>.card:last-child:nth-child(odd) {
      grid-column: 1 / -1;
    }

    /* Tombol Maps bulat kecil di daftar jadwal dashboard */
    .today-maps {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--sage-dark);
      text-decoration: none;
    }

    .today-maps:hover {
      background: var(--sage);
      color: var(--white);
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 18px;
    }

    .grid-1-2 {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 18px;
      margin-bottom: 18px;
    }

    .grid-2-1 {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 18px;
      margin-bottom: 18px;
    }

    @media(max-width:1100px) {

      .grid-2,
      .grid-3,
      .grid-1-2,
      .grid-2-1 {
        grid-template-columns: 1fr;
      }
    }

    /* ─── TABLE ─── */
    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    thead th {
      background: var(--cream-dark);
      color: var(--text-sec);
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 12px 14px;
      text-align: left;
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }

    tbody td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-light);
      color: var(--text);
      vertical-align: middle;
    }

    tbody tr:hover td {
      background: var(--cream);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .table-empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
    }

    .table-empty i {
      font-size: 36px;
      display: block;
      margin-bottom: 10px;
      opacity: 0.4;
    }

    /* ─── STATUS BADGES ─── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge-scheduled {
      background: var(--info-bg);
      color: var(--info);
    }

    .badge-done {
      background: var(--success-bg);
      color: var(--success);
    }

    .badge-cancelled {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .badge-lunas {
      background: var(--success-bg);
      color: var(--success);
    }

    .badge-belum {
      background: var(--warning-bg);
      color: var(--warning);
    }

    .badge-dp {
      background: var(--info-bg);
      color: var(--info);
    }

    .badge-admin {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .badge-therapist {
      background: linear-gradient(135deg, #e8f0e8, #d0ddd0);
      color: var(--sage-dark);
    }

    .badge-receptionist {
      background: var(--info-bg);
      color: var(--info);
    }

    /* ─── FORMS ─── */
    .form-section {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 24px;
      border: 1px solid var(--border-light);
      margin-bottom: 18px;
    }

    .form-section-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-sec);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-row {
      display: grid;
      gap: 16px;
      margin-bottom: 16px;
    }

    .form-row.cols-2 {
      grid-template-columns: 1fr 1fr;
    }

    .form-row.cols-3 {
      grid-template-columns: 1fr 1fr 1fr;
    }

    .fg {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .fg label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sec);
    }

    .fg input,
    .fg select,
    .fg textarea {
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      color: var(--text);
      background: var(--cream);
      transition: all 0.2s;
    }

    .fg input:focus,
    .fg select:focus,
    .fg textarea:focus {
      outline: none;
      border-color: var(--sage);
      box-shadow: 0 0 0 3px rgba(133, 149, 122, 0.12);
      background: var(--white);
    }

    .fg textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      justify-content: flex-end;
    }

    /* ─── MODAL ─── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      animation: fadeIn 0.18s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .modal {
      background: var(--white);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 640px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal.modal-lg {
      max-width: 860px;
    }

    .modal.modal-sm {
      max-width: 440px;
    }

    .modal-header {
      padding: 22px 26px;
      background: linear-gradient(135deg, var(--sage-dark), var(--sage));
      color: var(--white);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h3 {
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .modal-close {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: var(--white);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: rotate(90deg);
    }

    .modal-body {
      padding: 24px 26px;
    }

    .modal-footer {
      padding: 16px 26px;
      border-top: 1px solid var(--border-light);
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    /* ─── TOAST ─── */
    .toast-stack {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      background: var(--white);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
      animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      border-left: 4px solid var(--sage);
      min-width: 280px;
      max-width: 380px;
    }

    .toast.success {
      border-left-color: var(--success);
    }

    .toast.error {
      border-left-color: var(--danger);
    }

    .toast.warning {
      border-left-color: var(--warning);
    }

    .toast-icon {
      font-size: 18px;
      flex-shrink: 0;
    }

    .toast.success .toast-icon {
      color: var(--success);
    }

    .toast.error .toast-icon {
      color: var(--danger);
    }

    .toast.warning .toast-icon {
      color: var(--warning);
    }

    .toast-msg {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.4;
    }

    .toast-close {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateX(40px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .toast.leaving {
      animation: toastOut 0.2s ease forwards;
    }

    @keyframes toastOut {
      to {
        opacity: 0;
        transform: translateX(40px);
      }
    }

    /* ─── LOADING ─── */
    .loading-ov {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9000;
      gap: 16px;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid var(--border);
      border-top-color: var(--sage);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .loading-txt {
      font-size: 14px;
      color: var(--text-sec);
      font-weight: 500;
    }

    .skeleton {
      background: linear-gradient(90deg, var(--cream-dark) 25%, var(--cream) 50%, var(--cream-dark) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 6px;
    }

    @keyframes shimmer {
      0% {
        background-position: 200% 0
      }

      100% {
        background-position: -200% 0
      }
    }

    /* ─── SCHEDULE ITEMS BUILDER ─── */
    .item-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 10px;
      padding: 12px;
      background: var(--cream);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    .item-total {
      font-weight: 700;
      color: var(--sage-dark);
      font-size: 14px;
      padding-top: 4px;
    }

    .add-item-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--cream-dark);
      border: 1.5px dashed var(--sage-light);
      border-radius: var(--radius-sm);
      color: var(--sage-dark);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
      width: 100%;
      justify-content: center;
    }

    .add-item-btn:hover {
      border-color: var(--sage);
      background: var(--white);
    }

    /* ─── SUMMARY ROW ─── */
    .summary-box {
      background: linear-gradient(135deg, var(--cream-dark), var(--cream));
      border: 1px solid var(--beige);
      border-radius: var(--radius-md);
      padding: 16px 20px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 14px;
      color: var(--text-sec);
    }

    .summary-row.total {
      font-size: 17px;
      font-weight: 800;
      color: var(--sage-dark);
      border-top: 2px solid var(--beige);
      padding-top: 12px;
      margin-top: 4px;
    }

    /* ─── INVOICE PRINT ─── */
    .invoice-print-wrap {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 24px;
      border: 1px solid var(--border);
      margin-bottom: 18px;
    }

    #invoice-template {
      background: #FCF7F1;
      min-height: 1000px;
      padding: 40px;
      font-family: var(--font);
      max-width: 700px;
      margin: 0 auto;
      position: relative;
    }

    .inv-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 28px;
    }

    .inv-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .inv-brand-ico {
      width: 70px;
      height: 70px;
      background: linear-gradient(135deg, var(--sage), var(--sage-dark));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      font-size: 28px;
    }

    .inv-brand-name {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      color: var(--sage-dark);
      line-height: 1.1;
    }

    .inv-brand-sub {
      font-size: 12px;
      color: var(--text-sec);
      margin-top: 3px;
    }

    .inv-brand-tagline {
      font-size: 11px;
      color: var(--text-muted);
      font-style: italic;
      margin-top: 2px;
    }

    .inv-title-block {
      text-align: right;
    }

    .inv-title {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 700;
      color: var(--sage-dark);
    }

    .inv-no-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .inv-no-val {
      font-size: 14px;
      font-weight: 700;
      color: var(--sage);
    }

    .inv-divider {
      height: 2px;
      background: linear-gradient(90deg, var(--sage), var(--beige));
      border-radius: 2px;
      margin: 18px 0;
    }

    .inv-info-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 24px;
      margin-bottom: 24px;
    }

    .inv-info-box {
      background: var(--white);
      border-radius: var(--radius-sm);
      padding: 16px;
      border: 1px solid var(--beige);
    }

    .inv-info-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--sage);
      margin-bottom: 12px;
    }

    .inv-info-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .inv-info-label {
      color: var(--text-muted);
      min-width: 80px;
    }

    .inv-info-val {
      font-weight: 600;
      color: var(--text);
    }

    .inv-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    .inv-table thead th {
      background: var(--sage);
      color: var(--white);
      padding: 11px 14px;
      font-size: 13px;
      font-weight: 700;
      text-align: left;
    }

    .inv-table thead th:first-child {
      border-radius: 4px 0 0 0;
    }

    .inv-table thead th:last-child {
      border-radius: 0 4px 0 0;
      text-align: right;
    }

    .inv-table tbody td {
      padding: 10px 14px;
      border-bottom: 1px dashed var(--beige);
      font-size: 13px;
    }

    .inv-table tbody td:last-child {
      text-align: right;
      font-weight: 600;
    }

    .inv-bottom {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 10px;
    }

    .inv-notes-box {
      background: var(--white);
      border-radius: var(--radius-sm);
      padding: 14px;
      border: 1px solid var(--beige);
      font-size: 12px;
    }

    .inv-notes-title {
      font-weight: 700;
      color: var(--sage);
      margin-bottom: 8px;
      font-size: 12px;
    }

    /* QRIS di kotak pembayaran invoice */
    .inv-qris-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      max-width: 100%;
    }

    .inv-qris-row img {
      max-width: 100%;
      height: auto;
    }

    .inv-qris-cap {
      flex: 1 1 110px;
      min-width: 0;
      font-size: 11px;
      line-height: 1.35;
    }

    .inv-qris-cap-title {
      font-weight: 700;
      color: var(--sage-dark);
    }

    .inv-qris-cap-sub {
      color: var(--text-muted);
    }

    .inv-paid-line {
      margin-top: 8px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--sage);
    }

    .inv-totals {}

    .inv-total-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 13px;
      border-bottom: 1px dashed var(--beige);
    }

    .inv-total-row:last-child {
      border-bottom: none;
    }

    .inv-total-row.grand {
      font-size: 16px;
      font-weight: 800;
      color: var(--sage-dark);
      background: var(--sage-light);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      margin-top: 4px;
    }

    .inv-footer {
      text-align: center;
      margin-top: 28px;
    }

    .inv-footer-thanks {
      font-family: var(--font-display);
      font-size: 18px;
      color: var(--sage-dark);
      margin-bottom: 4px;
    }

    .inv-footer-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .inv-signature {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    .inv-sig-line {
      text-align: center;
      min-width: 160px;
    }

    .inv-sig-dot {
      height: 50px;
      border-bottom: 1.5px solid var(--text-sec);
      margin-bottom: 6px;
    }

    .inv-sig-label {
      font-size: 12px;
      color: var(--text-sec);
    }

    .inv-contacts {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--beige);
      font-size: 11px;
      color: var(--text-sec);
    }

    .inv-contact-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .inv-contact-item i {
      color: var(--sage);
    }

    /* ─── CALENDAR ─── */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }

    .cal-day-hdr {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      padding: 8px 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .cal-day {
      background: var(--white);
      border-radius: var(--radius-sm);
      padding: 8px;
      min-height: 80px;
      border: 1px solid var(--border-light);
      transition: all 0.15s;
      cursor: pointer;
    }

    .cal-day:hover {
      border-color: var(--sage-light);
      box-shadow: var(--shadow-sm);
    }

    .cal-day.today {
      border-color: var(--sage);
      background: rgba(133, 149, 122, 0.05);
    }

    .cal-day.other-month {
      background: var(--cream);
      opacity: 0.6;
    }

    .cal-day-num {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }

    .cal-day.today .cal-day-num {
      background: var(--sage);
      color: var(--white);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .cal-event {
      background: var(--sage-light);
      color: var(--sage-dark);
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 10px;
      font-weight: 600;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cal-event.done {
      background: var(--success-bg);
      color: var(--success);
    }

    .cal-event.cancelled {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .cal-month-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    /* ─── FILTER BAR ─── */
    .filter-bar {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      margin-bottom: 16px;
      border: 1px solid var(--border-light);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .filter-bar .fg {
      min-width: 160px;
    }

    /* ─── SECTION HEADER ─── */
    .section-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .section-hdr h2 {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ─── PRICELIST ─── */
    .price-category {
      margin-bottom: 24px;
    }

    .price-cat-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--sage-dark);
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 8px 14px;
      background: linear-gradient(90deg, var(--cream-dark), var(--cream));
      border-left: 4px solid var(--sage);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .price-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px;
      background: var(--white);
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
      border: 1px solid var(--border-light);
      transition: all 0.15s;
    }

    .price-item:hover {
      border-color: var(--sage-light);
      box-shadow: var(--shadow-sm);
    }

    .price-item-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .price-item-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .price-item-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .price-item-amt {
      font-size: 15px;
      font-weight: 800;
      color: var(--sage-dark);
    }

    .price-item-dur {
      font-size: 11px;
      color: var(--text-muted);
      background: var(--cream);
      padding: 3px 8px;
      border-radius: 10px;
    }

    /* ─── CUSTOMER CARD ─── */
    .cust-card {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all 0.2s;
      cursor: pointer;
    }

    .cust-card:hover {
      border-color: var(--sage-light);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .cust-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--sage-light), var(--sage));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      font-weight: 700;
      color: var(--white);
      flex-shrink: 0;
    }

    .cust-info {
      flex: 1;
      min-width: 0;
    }

    .cust-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .cust-phone {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .cust-baby {
      font-size: 12px;
      color: var(--sage-dark);
      margin-top: 3px;
      font-weight: 500;
    }

    .cust-due {
      text-align: right;
    }

    .cust-due-amt {
      font-size: 15px;
      font-weight: 800;
      color: var(--danger);
    }

    .cust-due-lbl {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* ─── REPORTS ─── */
    .report-card {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 22px;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
    }

    .report-card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-light);
    }

    .chart-wrap {
      position: relative;
      height: 280px;
    }

    /* ─── SETTINGS TABS ─── */
    .settings-tabs {
      display: flex;
      gap: 4px;
      background: var(--cream-dark);
      padding: 4px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
    }

    .settings-tab {
      flex: 1;
      padding: 10px 14px;
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }

    .settings-tab.active {
      background: var(--white);
      color: var(--sage-dark);
      box-shadow: var(--shadow-sm);
    }

    /* ─── MOBILE SIDEBAR ─── */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 199;
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text);
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
    }

    @media(max-width:900px) {
      .sidebar {
        position: fixed;
        left: -280px;
        top: 0;
        bottom: 0;
        z-index: 200;
        transition: left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .sidebar.open {
        left: 0;
      }

      .sidebar-overlay.show {
        display: block;
      }

      .menu-toggle {
        display: flex;
      }

      .page-content {
        padding: 16px;
      }

      .form-row.cols-2,
      .form-row.cols-3 {
        grid-template-columns: 1fr;
      }

      .item-row {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media(max-width:600px) {
      .kpi-grid {
        grid-template-columns: 1fr 1fr;
      }

      .inv-info-grid {
        grid-template-columns: 1fr;
      }

      .inv-bottom {
        grid-template-columns: 1fr;
      }

      .dash-hero-stats {
        flex-wrap: wrap;
        gap: 16px;
      }
    }

    /* ─── POPUP/CONFIRM ─── */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 20px;
      animation: fadeIn 0.18s ease;
    }

    .popup {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 32px 28px;
      max-width: 400px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      text-align: center;
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .popup-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin: 0 auto 16px;
    }

    .popup-icon.warning {
      background: var(--warning-bg);
      color: var(--warning);
    }

    .popup-icon.danger {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .popup-icon.success {
      background: var(--success-bg);
      color: var(--success);
    }

    .popup-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .popup-msg {
      font-size: 14px;
      color: var(--text-sec);
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .popup-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .popup-actions .btn {
      min-width: 110px;
    }

    /* ─── WA BUTTON ─── */
    .wa-btn {
      background: #25D366;
      color: var(--white) !important;
      border: none;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
    }

    .wa-btn:hover {
      background: #1da851;
      transform: scale(1.05);
    }

    /* ─── UPCOMING TODAY LIST ─── */
    .today-list {
      display: flex;

      gap: 10px;
    }

    .today-item {
      background: var(--cream);

    .today-info {

    .today-cust {
      font-size: 14px;

    }

    .today-therapist {
      font-size: 12px;

    }

    /* iOS: 100vh hides the bottom of the screen behind the Safari toolbar */
    .app {
      height: 100vh;
      height: 100dvh
    }

    .login-page {
      min-height: 100vh;
      min-height: 100dvh
    }

    /* ============ Print (invoice) ============ */
    @media print {
      @page {
        size: A4;
        margin: 12mm
      }

      html,
      body {
        background: #fff !important;
        height: auto !important
      }

      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important
      }

      .sidebar,
      .topbar,
      .toast-stack,
      .loading-ov,
      .sidebar-overlay {
        display: none !important
      }

      .modal-overlay {
        position: static !important;
        display: block !important;
        padding: 0 !important;
        background: none !important
      }

      .modal {
        max-width: none !important;
        max-height: none !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        overflow: visible !important
      }

      .modal-header,
      .modal-close {
        display: none !important
      }

      .inv-table thead {
        display: table-header-group
      }

      .inv-bottom,
      .inv-footer {
        page-break-inside: avoid
      }

      #invoice-template {
        max-width: none !important;
        min-height: 0 !important;
        padding: 0 !important;
        margin: 0 !important
      }
    }

    /* ─── PRICELIST IMAGE GENERATOR ─── */
    /* Tombol pembuka di halaman Pricelist */
    .pl-entry {
      margin-bottom: 18px
    }

    .pl-entry-btn {
      width: 100%
    }

    /* Modal generator */
    .pl-modal.modal-lg {
      max-width: 960px
    }

    .pl-hint {
      font-size: 13px;
      color: var(--text-muted);
      margin: -6px 0 16px
    }

    .pl-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 20px
    }

    .pl-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 0
    }

    .pl-label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-sec);
      margin-bottom: 6px;
      letter-spacing: .01em
    }

    .pl-input {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: var(--font);
      background: var(--white);
      color: var(--text)
    }

    .pl-input:focus {
      outline: none;
      border-color: var(--sage)
    }

    .pl-seg {
      display: flex;
      gap: 8px
    }

    .pl-seg-btn {
      flex: 1 1 0;
      padding: 9px 8px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--white);
      color: var(--text-sec);
      font-size: 13.5px;
      font-weight: 700;
      font-family: var(--font);
      cursor: pointer;
      transition: all .18s
    }

    .pl-seg-btn.on {
      background: var(--sage);
      border-color: var(--sage);
      color: var(--white)
    }

    .pl-cats,
    .pl-togs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px
    }

    .pl-chk {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      background: var(--white);
      color: var(--text-sec);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      user-select: none
    }

    .pl-chk input {
      width: 15px;
      height: 15px;
      margin: 0;
      accent-color: var(--sage);
      cursor: pointer
    }

    .pl-chk.on {
      border-color: var(--sage);
      color: var(--sage-dark);
      background: rgba(133, 149, 122, 0.10)
    }

    .pl-preview {
      min-width: 0;
      order: -1
    }

    .pl-frame {
      position: relative;
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      border-radius: 16px;
      background: #FCF7F1;
      box-shadow: 0 6px 24px rgba(45, 58, 46, 0.18)
    }

    .pl-frame .pls-slide {
      transform-origin: top left
    }

    .pl-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 10px
    }

    .pl-nav-btn {
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--border);
      border-radius: 50%;
      background: var(--white);
      color: var(--sage-dark);
      cursor: pointer;
      font-size: 13px
    }

    .pl-nav-btn:disabled {
      opacity: .4;
      cursor: not-allowed
    }

    .pl-nav-txt {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      min-width: 48px;
      text-align: center
    }

    .pl-empty {
      padding: 46px 16px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted)
    }

    .pl-empty i {
      display: block;
      font-size: 22px;
      margin-bottom: 8px;
      color: var(--beige)
    }

    .pl-modal .modal-footer {
      flex-wrap: wrap
    }

    @media (max-width:600px) {
      .pl-modal .modal-footer .btn {
        flex: 1 1 auto;
        justify-content: center;
        padding: 11px 10px;
        font-size: 13px
      }

      /* Baris aksi menempel di bawah modal supaya tombol Simpan selalu terjangkau */
      .pl-modal .modal-footer {
        position: sticky;
        bottom: 0;
        z-index: 3;
        background: var(--white);
        border-top: 1px solid var(--border)
      }

      /* Ruang ekstra di ujung area gulir agar isian terakhir tidak tertutup baris aksi */
      .pl-modal .modal-body {
        padding-bottom: 40px
      }

      .pl-preview {
        align-self: center;
        width: 100%;
        max-width: 360px
      }
    }

    @media (min-width:601px) {
      .pl-entry {
        display: flex;
        justify-content: flex-end
      }

      .pl-entry-btn {
        width: auto
      }
    }

    @media (min-width:880px) {
      .pl-grid {
        grid-template-columns: minmax(0, 1fr) 420px;
        gap: 24px
      }

      .pl-preview {
        order: 0
      }

      .pl-frame {
        max-width: 420px
      }
    }

    /* ─── Kartu slide 1080 × 1350 (dipakai pratinjau + ekspor) ─── */
    .pl-stage {
      position: fixed;
      left: -10000px;
      top: 0;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      visibility: hidden;
      pointer-events: none;
      z-index: -1
    }

    /* Wadah ekspor: di luar layar, tapi tetap dianggap terlihat oleh html2canvas */
    .pl-ex-host {
      position: fixed;
      top: 0;
      left: -20000px;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      pointer-events: none;
      z-index: 1
    }

    .pls-slide {
      position: relative;
      width: 1080px;
      height: 1350px;
      padding: 70px 72px 58px;
      box-sizing: border-box;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-family: 'Plus Jakarta Sans', Arial, sans-serif;
      -webkit-font-smoothing: antialiased
    }

    .pls-cream {
      background: #FCF7F1;
      color: #3F3A34;
      --pls-muted: #8A8279;
      --pls-accent: #85957A;
      --pls-hair: #D4C2AA;
      --pls-hair-soft: rgba(212, 194, 170, 0.55)
    }

    .pls-sage {
      background: #6F7D64;

  <script>
    // ═══════════════════════════════════════════════════════════════
    //  STATE
    // ═══════════════════════════════════════════════════════════════
    const S = {
      user: null,
      page: 'dashboard',
      settings: {},
      brand: { logo: '', qris: '' },
      data: { schedules: [], customers: [], treatments: [], payments: [], users: [], customerDetail: null },
      calYear: new Date().getFullYear(),
      calMonth: new Date().getMonth(),
      invoiceData: null,
      invoiceMode: 'full',
      editingScheduleId: null,
      openInvoiceId: null,
    };

    // ═══════════════════════════════════════════════════════════════
    //  HELPERS
    // ═══════════════════════════════════════════════════════════════
    const $ = id => document.getElementById(id);
    const fmtRp = v => 'Rp ' + (parseFloat(v) || 0).toLocaleString('id-ID');
    const fmtDate = s => { if (!s) return ''; const d = new Date(s); if (isNaN(d)) return s; return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }); };
    const fmtDateInput = s => { if (!s) return ''; const d = new Date(s); if (isNaN(d)) return ''; return d.toISOString().split('T')[0]; };
    const today = () => new Date().toISOString().split('T')[0];
    const sanitize = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    // ─── Tarif & biaya transport (sama dengan aturan backend) ───
    // Gratis sampai 5 km. Lebih dari itu jarak dibulatkan ke bawah lalu dikali tarif per km.
    // Contoh: 5 km = 0, 5.8 km = 0 (dibulatkan jadi 5 km), 6.3 km = Rp12.000, 27.6 km = Rp54.000.
    const tarifTransport = () => {
      const r = parseFloat(S.settings && S.settings.transport_rate_per_km);
      return isFinite(r) && r > 0 ? r : 2000;
    };
    const hitungTransport = km => {
      const d = parseFloat(km);
      if (!isFinite(d)) return 0;
      const bulat = Math.floor(d);
      if (bulat <= 5) return 0;
      return Math.max(0, bulat * tarifTransport());
    };

    // ─── Usia dari tanggal lahir (yyyy-MM-dd) ───
    // Kurang dari 1 bulan → hari, 1-23 bulan → bulan + hari, 24 bulan ke atas → tahun + bulan.
    const fmtUsia = dob => {
      const m = String(dob || '').trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (!m) return '';
      const b = new Date(parseInt(m[1], 10), parseInt(m[2], 10) - 1, parseInt(m[3], 10));
      if (isNaN(b.getTime())) return '';
      const now = new Date();
      if (b.getTime() > now.getTime()) return '';
      let years = now.getFullYear() - b.getFullYear();
      let months = now.getMonth() - b.getMonth();
      let days = now.getDate() - b.getDate();
      if (days < 0) {
        months--;
        days += new Date(now.getFullYear(), now.getMonth(), 0).getDate();
      }
      if (months < 0) { years--; months += 12; }
      const totalMonths = years * 12 + months;
      if (totalMonths >= 24) return years + ' tahun' + (months > 0 ? ' ' + months + ' bulan' : '');
      if (totalMonths < 1) {
        const hari = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime() - b.getTime()) / 86400000);
        return (hari > 0 ? hari : 0) + ' hari';
      }
      return totalMonths + ' bulan' + (days > 0 ? ' ' + days + ' hari' : '');
    };
    // Usia tampil: dari tanggal lahir bila ada, kalau tidak pakai isian manual baby_age
    const usiaBayi = c => {
      const auto = fmtUsia(c && c.dob);
      return auto || String((c && c.baby_age) || '').trim();
    };
    // URL yang aman dipakai di atribut href: hanya http/https, alamat tanpa awalan diberi https
    const attrUrl = u => {
      let s = String(u || '').trim();
      if (!s) return '';
      const low = s.toLowerCase();
      const berprotokol = /^[a-z][a-z0-9+.-]*:/.test(low);
      if (berprotokol && low.indexOf('https:') !== 0 && low.indexOf('http:') !== 0) return '';
      if (!berprotokol) s = URLBASE + s;
      return sanitize(s).replace(/"/g, '%22');
    };
    const isWriter = () => ['admin', 'receptionist'].includes(S.user && S.user.role);
    const isAdmin = () => !!(S.user && S.user.role === 'admin');
    const isActiveVal = v => { if (v === undefined || v === null || v === '') return true; const t = String(v).toLowerCase(); return !(t === '0' || t === 'false' || t === 'nonaktif'); };
    // Awalan URL: "https://" ditulis tanpa dua garis miring berurutan di kode,
    // karena dua garis miring di dalam string JS dipotong saat file disajikan.
    const URLBASE = 'https:' + String.fromCharCode(47, 47);

    // ─── Logo & QRIS ───
    // Alamat gambar bawaan juga disusun dari URLBASE (tanpa dua garis miring di kode).
    const DEFAULT_LOGO_URL = URLBASE + 'res.cloudinary.com/dlrxxfy7f/image/upload/w_320,q_auto:good,f_png/v1792500542/LOGO_DAISAFACARE_NO_TEXT-removebg-preview_yyopiu.png';
    const DEFAULT_QRIS_URL = URLBASE + 'res.cloudinary.com/dlrxxfy7f/image/upload/w_500,q_auto:best,f_png/v1792500651/QRIS_DAISAFA_CARE_srnnbg.png';
    // Alamat dari Pengaturan: kosong / bukan http(s) → gambar bawaan. data: juga diterima.
    const brandUrlOk = raw => {
      const v = String(raw || '').trim();
      if (!v) return '';
      if (/^data:image\//i.test(v)) return v;
      return attrUrl(v);
    };
    const logoUrl = () => brandUrlOk(S.settings && S.settings.logo_url) || DEFAULT_LOGO_URL;
    const qrisUrl = () => brandUrlOk(S.settings && S.settings.qris_url) || DEFAULT_QRIS_URL;
    // Tag <img> untuk logo / QRIS. Bila data URI hasil prefetch sudah ada, itu yang dipakai
    // supaya "Simpan Gambar" tidak pernah gagal karena kanvas tercemar (tainted).
    const brandImg = (kind, w, extra) => {
      const isQris = kind === 'qris';
      const url = isQris ? qrisUrl() : logoUrl();
      if (!url) return '';
      const cached = isQris ? (S.brand && S.brand.qris) : (S.brand && S.brand.logo);
      const src = cached || url;
      const lebar = parseInt(w, 10) || 44;
      const gaya = 'display:block;width:' + lebar + 'px;height:auto;object-fit:contain;' + (extra || '');
      return `<img src="${src}" alt="${isQris ? 'QRIS Daisafacare' : 'Logo Daisafacare'}" loading="eager" decoding="sync" crossorigin="anonymous" style="${gaya}" onerror="this.style.display='none'">`;
    };

    // Ambil logo & QRIS sekali saat aplikasi dibuka, simpan sebagai data URI.
    // Tidak menahan tampilan dan tidak menggambar ulang apa pun; gagal = diam saja.
    function prefetchBrandAssets() {
      const ambil = (url, key) => {
        try {
          if (!url || typeof fetch !== 'function' || typeof FileReader !== 'function') return;
          fetch(url)
            .then(r => (r && r.ok ? r.blob() : null))
            .then(b => {
              if (!b) return;
              const fr = new FileReader();
              fr.onload = () => {
                const d = String(fr.result || '');
                if (d.indexOf('data:') === 0) S.brand[key] = d;
              };
              fr.readAsDataURL(b);
            })
            .catch(() => { });
        } catch (e) { }
      };
      ambil(logoUrl(), 'logo');
      ambil(qrisUrl(), 'qris');
    }

    // Logo di sidebar (44px). Bila gambar gagal dimuat, kembali ke 🌸.
    function setSidebarLogo() {
      const el = $('sidebarBrandLogo');
      if (!el) return;
      const url = logoUrl();
      if (!url) { el.innerHTML = '🌸'; return; }
      const src = (S.brand && S.brand.logo) || url;
      el.innerHTML = `<img src="${src}" alt="Logo Daisafacare" loading="lazy" crossorigin="anonymous" style="display:block;width:44px;height:auto;max-height:64px;object-fit:contain" onerror="this.style.display='none';var f=document.getElementById('sidebarBrandLogo');if(f){f.innerHTML='🌸'}">`;
    }

    function ga(fn, args, cb) {
      // Google Apps Script call
      // Bila server membalas null (data kosong), halaman tidak boleh rusak.
      // Jadi balasan null ditangani di sini, bukan diserahkan ke cb halaman.
      function onOk(res) {
        if (res === null || res === undefined) {
          toast('Server tidak mengirim data. Muat ulang halaman lalu coba lagi.', 'error');
          loading(false);
          return;
        }
        cb(res);
      }
      // Kegagalan server juga tidak boleh membuat overlay loading menggantung.
      function onFail(e) {
        toast('Gagal: ' + (e && e.message ? e.message : e), 'error');
        loading(false);
      }
      if (typeof google !== 'undefined' && google.script) {
        google.script.run.withSuccessHandler(onOk).withFailureHandler(onFail)[fn](...(args || []));
      } else {
        // Demo/local mode mock
        console.log('GAS call:', fn, args);
        setTimeout(() => cb({ success: false, message: 'GAS not available in local mode' }), 300);
      }
    }

    function loading(show, txt) {
      $('loadingOv').style.display = show ? 'flex' : 'none';
      if (txt) $('loadingTxt').textContent = txt;
    }

    function toast(msg, type = 'info', dur = 3500) {
      const icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', warning: 'fa-triangle-exclamation', info: 'fa-circle-info' };
      const el = document.createElement('div');
      el.className = 'toast ' + type;
      el.innerHTML = `<i class="fa ${icons[type] || icons.info} toast-icon"></i><div class="toast-msg">${sanitize(msg)}</div><button class="toast-close" onclick="this.parentElement.remove()"><i class="fa fa-xmark"></i></button>`;
      $('toastStack').appendChild(el);
      setTimeout(() => { el.classList.add('leaving'); setTimeout(() => el.remove(), 220); }, dur);
    }

    function confirm(title, msg, type, onOk, okLabel = 'Ya, Lanjutkan') {
      const icons = { danger: 'fa-trash danger', warning: 'fa-triangle-exclamation warning' };
      $('popupContainer').innerHTML = `
  <div class="popup-overlay" id="popupOv">
    <div class="popup">
      <div class="popup-icon ${type || 'warning'}"><i class="fa ${icons[type] || 'fa-circle-question'}"></i></div>
      <div class="popup-title">${sanitize(title)}</div>
      <div class="popup-msg">${sanitize(msg)}</div>
      <div class="popup-actions">
        <button class="btn btn-ghost" onclick="closePopup()">Batal</button>

    </div>

      window._popupOk = onOk;

    //  BOOTSTRAP (tanpa halaman login)
    // ═══════════════════════════════════════════════════════════════
    // Aplikasi langsung terbuka sebagai pengguna admin aktif (getAppUser).
    // Kalau server tidak menjawab / fungsi belum ada, dipakai admin bawaan
    // supaya layar tidak pernah kosong.
    const DEFAULT_USER = { id: 1, full_name: 'Admin Daisafa', email: '', role: 'admin', phone: '' };
    const BOOT_WARN = 'Data pengguna tidak termuat. Aplikasi dibuka sebagai Admin Daisafa.';
    let bootDone = false;

    function normalizeUser(u) {
      const d = { id: DEFAULT_USER.id, full_name: DEFAULT_USER.full_name, email: '', role: DEFAULT_USER.role, phone: '' };
      if (u && typeof u === 'object') {
        if (u.id !== undefined && u.id !== null && u.id !== '') d.id = u.id;
        if (u.full_name) d.full_name = String(u.full_name);
        if (u.email) d.email = String(u.email);
        if (u.role) d.role = String(u.role).toLowerCase().trim();
        if (u.phone !== undefined && u.phone !== null) d.phone = u.phone;
      }
      if (!d.full_name) d.full_name = DEFAULT_USER.full_name;
      if (['admin', 'therapist', 'receptionist'].indexOf(d.role) === -1) d.role = 'admin';
      return d;
    }

    function syncSidebarUser() {
      $('sidebarName').textContent = S.user.full_name || '';
      $('sidebarAvatar').textContent = (S.user.full_name || '?').charAt(0).toUpperCase();
      $('sidebarRole').textContent = S.user.role;
      $('adminNav').style.display = isAdmin() ? '' : 'none';
      $('nav-logs').style.display = isAdmin() ? 'flex' : 'none';
    }

    function bootApp(user, warnMsg) {
      if (bootDone) return;
      bootDone = true;
      S.user = normalizeUser(user);
      startApp();
      if (warnMsg) toast(warnMsg, 'warning', 5000);
    }

    // Dipanggil sekali saat halaman dimuat (lihat init() di bawah).
    function bootstrapApp() {
      let answered = false;
      // Pengaman: server tidak menjawab (fungsi belum dipasang / lambat)
      // → aplikasi tetap terbuka dengan admin bawaan setelah 3 detik.
      const watchdog = setTimeout(() => { if (!answered) bootApp(DEFAULT_USER, BOOT_WARN); }, 3000);
      function reply(u, warnMsg) {
        answered = true;
        clearTimeout(watchdog);
        if (bootDone) {
          // Server menjawab terlambat (setelah pengaman jalan): cukup perbarui identitas.
          if (u) { S.user = normalizeUser(u); syncSidebarUser(); }
          return;
        }
        bootApp(u, warnMsg);
      }
      try {
        ga('getAppUser', [], res => {
          const u = res && res.success && res.data ? res.data : null;
          reply(u, u ? '' : BOOT_WARN);
        });
      } catch (e) {
        // Fungsi getAppUser belum ada di backend yang terpasang
        reply(DEFAULT_USER, BOOT_WARN);
      }
    }

    // ═══════════════════════════════════════════════════════════════
    //  APP INIT
    // ═══════════════════════════════════════════════════════════════
    function startApp() {
      const splash = $('bootSplash');
      if (splash) splash.parentNode.removeChild(splash);
      $('app').style.display = 'flex';
      loading(false);
      $('sidebarName').textContent = S.user.full_name;
      $('sidebarRole').textContent = S.user.role;
      $('sidebarAvatar').textContent = (S.user.full_name || '?').charAt(0).toUpperCase();
      // Section "Manajemen" hanya untuk admin
      $('adminNav').style.display = isAdmin() ? '' : 'none';
      if (isAdmin()) {
        $('nav-logs').style.display = 'flex';
      }
      updateTopbarDate();
      setInterval(updateTopbarDate, 60000);
      refreshSessionUser();
      loadSettings(() => { setSidebarLogo(); prefetchBrandAssets(); navigate('dashboard'); });
    }

    // Ambil data user terbaru dari server (nama bisa berubah oleh admin).
    // Tidak pernah mengarahkan ke halaman login: gagal = diam saja.
    function refreshSessionUser() {
      if (!S.user || !S.user.id) return;
      ga('getProfile', [S.user.id], res => {
        if (!res) return;
        // Dukung dua bentuk respons: {success,data:{...}} atau objek user langsung
        const u = res.success ? res.data : (res.full_name ? res : null);
        if (!u) return;
        if (u.full_name) S.user.full_name = u.full_name;
        if (u.phone !== undefined) S.user.phone = u.phone;
        if (u.email) S.user.email = u.email;
        if (u.role) S.user.role = u.role;
        syncSidebarUser();
      });
    }

    function updateTopbarDate() {
      const d = new Date();
      $('topbarDate').textContent = d.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    }

    function loadSettings(cb) {
      ga('getSettings', [], res => {
        if (res.success) S.settings = res.data;
        if (cb) cb();

      loadSchedules();
