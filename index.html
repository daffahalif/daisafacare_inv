        const total = data.reduce((s, p) => s + (p.amount || 0), 0);
        $('payTable').innerHTML = `
    <div style="padding:16px 20px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between">
      <div style="font-weight:700">Total: <span style="color:var(--success)">${fmtRp(total)}</span></div>
      <div style="font-size:13px;color:var(--text-muted)">${data.length} transaksi</div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Tanggal</th><th>Invoice</th><th>Pelanggan</th><th>Metode</th><th>Jumlah</th><th>Referensi</th></tr></thead>
      <tbody>${data.length ? data.map(p => `<tr>
        <td>${fmtDate(p.date)}</td>
        <td style="font-family:monospace;font-size:12px;font-weight:700">${sanitize(p.invoice_no) || '—'}</td>
        <td>${sanitize(p.customer_name)}</td>
        <td><span class="badge" style="background:var(--info-bg);color:var(--info)">${sanitize(p.method)}</span></td>
        <td style="font-weight:700;color:var(--success)">${fmtRp(p.amount)}</td>
        <td style="font-size:12px;color:var(--text-muted)">${sanitize(p.reference) || '—'}</td>
      </tr>`).join('') : '<tr><td colspan="6" class="table-empty"><i class="fa fa-money-bill"></i>Belum ada pembayaran</td></tr>'}</tbody>
    </table></div>`;
      });
    }

    // ═══════════════════════════════════════════════════════════════
    //  LAPORAN
    // ═══════════════════════════════════════════════════════════════
    function renderLaporan() {
      $('pageContent').innerHTML = `
  <div class="filter-bar">
    <div class="fg"><label>Dari</label><input type="date" id="rfFrom"></div>
    <div class="fg"><label>Sampai</label><input type="date" id="rfTo"></div>
    <div class="fg"><label>&nbsp;</label><button class="btn btn-primary btn-sm" onclick="loadReport()"><i class="fa fa-chart-bar"></i> Tampilkan</button></div>
  </div>
  <div class="settings-tabs">
    <button class="settings-tab active" id="rtab-monthly" onclick="switchReport('monthly')"><i class="fa fa-calendar"></i> Bulanan</button>
    <button class="settings-tab" id="rtab-treatments" onclick="switchReport('treatments')"><i class="fa fa-spa"></i> Treatment</button>
    <button class="settings-tab" id="rtab-customers" onclick="switchReport('customers')"><i class="fa fa-users"></i> Pelanggan</button>
  </div>
  <div id="reportContent"><div class="table-empty"><i class="fa fa-chart-line"></i>Pilih rentang tanggal dan klik Tampilkan</div></div>`;
    }

    let activeReport = 'monthly';
    function switchReport(t) {
      activeReport = t;
      document.querySelectorAll('.settings-tab').forEach(el => el.classList.remove('active'));
      $('rtab-' + t).classList.add('active');
      loadReport();
    }
    function loadReport() {
      const f = { dateFrom: $('rfFrom').value, dateTo: $('rfTo').value };
      loading(true, 'Memuat laporan...');
      ga('getReportsData', [activeReport, f, S.user.id, S.user.role], res => {
        loading(false);
        if (!res.success) { toast(res.message, 'error'); return; }
        renderReportContent(activeReport, res.data);
      });
    }

    function renderReportContent(type, data) {
      if (type === 'monthly') {
        const d = data;
        $('reportContent').innerHTML = `
    <div class="kpi-grid" style="margin-bottom:18px">
      <div class="kpi-card green"><div class="kpi-val">${fmtRp(d.totalRevenue)}</div><div class="kpi-label">Total Pendapatan</div></div>
      <div class="kpi-card success"><div class="kpi-val">${fmtRp(d.totalCollected)}</div><div class="kpi-label">Terkumpul</div></div>
      <div class="kpi-card beige"><div class="kpi-val">${d.totalCount}</div><div class="kpi-label">Total Jadwal</div></div>
    </div>
    <div class="report-card">
      <div class="report-card-title"><i class="fa fa-chart-bar" style="color:var(--sage)"></i> Pendapatan Bulanan</div>
      <div class="chart-wrap"><canvas id="rChart"></canvas></div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="table-wrap"><table>
        <thead><tr><th>Bulan</th><th>Pendapatan</th><th>Terkumpul</th><th>Jumlah Jadwal</th></tr></thead>
        <tbody>${d.monthlyData.map(m => `<tr><td>${m.label}</td><td style="font-weight:700">${fmtRp(m.revenue)}</td><td style="color:var(--success);font-weight:700">${fmtRp(m.collected)}</td><td>${m.count}</td></tr>`).join('')}</tbody>
      </table></div>
    </div>`;
        const ctx = $('rChart').getContext('2d');
        new Chart(ctx, { type: 'bar', data: { labels: d.monthlyData.map(m => m.label), datasets: [{ label: 'Pendapatan', data: d.monthlyData.map(m => m.revenue), backgroundColor: 'rgba(133,149,122,0.7)', borderColor: '#85957A', borderWidth: 1, borderRadius: 4 }, { label: 'Terkumpul', data: d.monthlyData.map(m => m.collected), backgroundColor: 'rgba(76,175,125,0.6)', borderColor: '#4CAF7D', borderWidth: 1, borderRadius: 4 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' } }, scales: { y: { ticks: { callback: v => 'Rp ' + v.toLocaleString('id-ID') } } } } });
      }
      else if (type === 'treatments') {
        $('reportContent').innerHTML = `
    <div class="grid-2">
      <div class="report-card">
        <div class="report-card-title"><i class="fa fa-chart-pie" style="color:var(--sage)"></i> Distribusi Treatment</div>
        <div class="chart-wrap"><canvas id="trChart"></canvas></div>
      </div>
      <div class="card">
        <div class="table-wrap"><table>
          <thead><tr><th>Treatment</th><th>Qty</th><th>Pendapatan</th></tr></thead>
          <tbody>${data.treatments.map(t => `<tr><td style="font-weight:600">${sanitize(t.name)}</td><td>${t.qty}</td><td style="font-weight:700;color:var(--sage-dark)">${fmtRp(t.revenue)}</td></tr>`).join('')}</tbody>
        </table></div>
      </div>
    </div>`;
        const ctx = $('trChart').getContext('2d');
        const colors = ['#85957A', '#B8C2AA', '#D4C2AA', '#A6B3A5', '#4CAF7D', '#5B8FB9', '#E05252', '#F59E0B'];
        new Chart(ctx, { type: 'doughnut', data: { labels: data.treatments.map(t => t.name), datasets: [{ data: data.treatments.map(t => t.revenue), backgroundColor: colors, borderWidth: 2, hoverOffset: 4 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 11 }, padding: 10 } } } } });
      }
      else if (type === 'customers') {
        $('reportContent').innerHTML = `
    <div class="card">
      <div class="table-wrap"><table>
        <thead><tr><th>Peringkat</th><th>Pelanggan</th><th>No. HP</th><th>Jumlah Jadwal</th><th>Total Transaksi</th><th>Rata-rata</th></tr></thead>
        <tbody>${data.customers.map((c, i) => `<tr>
          <td><span style="background:${i < 3 ? ['#FFD700', '#C0C0C0', '#CD7F32'][i] : 'var(--cream-dark)'};padding:4px 10px;border-radius:10px;font-weight:700;font-size:12px">${i + 1}</span></td>
          <td style="font-weight:700">${sanitize(c.name)}</td>
          <td style="font-size:12px">${sanitize(c.phone)}</td>
          <td>${c.count}</td>
          <td style="font-weight:700;color:var(--sage-dark)">${fmtRp(c.totalRevenue)}</td>
          <td style="color:var(--text-muted)">${fmtRp(c.avgTicket)}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>`;
      }
    }

    // ═══════════════════════════════════════════════════════════════
    //  SETTINGS
    // ═══════════════════════════════════════════════════════════════
    function renderSettings() {
      $('pageContent').innerHTML = `
  <div class="settings-tabs">
    <button class="settings-tab active" id="stab-bisnis" onclick="switchSettings('bisnis')"><i class="fa fa-building"></i> Info Bisnis</button>
    ${isAdmin() ? `<button class="settings-tab" id="stab-users" onclick="switchSettings('users')"><i class="fa fa-users-gear"></i> Pengguna</button>` : ''}
    <button class="settings-tab" id="stab-profile" onclick="switchSettings('profile')"><i class="fa fa-user-circle"></i> Profil Saya</button>
  </div>
  <div id="settingsContent"></div>`;
      loadSettingsTab('bisnis');
    }

    function switchSettings(tab) {
      if (tab === 'users' && !isAdmin()) { toast('Akses ditolak', 'error'); return; }
      document.querySelectorAll('.settings-tab').forEach(el => el.classList.remove('active'));
      const tabEl = $('stab-' + tab);
      if (tabEl) tabEl.classList.add('active');
      loadSettingsTab(tab);
    }

    function loadSettingsTab(tab) {
      if (tab === 'bisnis') {
        const s = S.settings;
        $('settingsContent').innerHTML = `
    <div class="form-section">
      <div class="form-section-title"><i class="fa fa-store"></i> Informasi Bisnis</div>
      <div class="form-row cols-2">
        <div class="fg"><label>Nama Bisnis</label><input id="sBizName" value="${sanitize(s.business_name || 'Daisafacare')}"></div>
        <div class="fg"><label>Tagline</label><input id="sBizTag" value="${sanitize(s.business_tagline || 'Mom & Baby Treatment')}"></div>
      </div>
      <div class="form-row cols-2">
        <div class="fg"><label>No. HP</label><input id="sBizPhone" value="${sanitize(s.business_phone || '')}"></div>
        <div class="fg"><label>Alamat</label><input id="sBizAddr" value="${sanitize(s.business_address || '')}"></div>
      </div>
      <div class="form-row cols-2">
        <div class="fg"><label>Instagram</label><input id="sBizIG" value="${sanitize(s.business_instagram || '')}"></div>
        <div class="fg"><label>TikTok</label><input id="sBizTT" value="${sanitize(s.business_tiktok || '')}"></div>
      </div>
      <div class="fg" style="margin-bottom:12px"><label>Info Pembayaran (untuk Invoice)</label><textarea id="sBizPay" rows="2">${sanitize(s.payment_info || '')}</textarea></div>
      <div class="form-row cols-2">
        <div class="fg"><label>Logo URL</label><input id="sBizLogo" value="${sanitize(s.logo_url || '')}" placeholder="${URLBASE}..." oninput="previewBrandImg()"></div>
        <div class="fg"><label>QRIS URL</label><input id="sBizQris" value="${sanitize(s.qris_url || '')}" placeholder="${URLBASE}..." oninput="previewBrandImg()"></div>
      </div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:-6px;margin-bottom:10px">Kosongkan untuk memakai gambar bawaan.</div>
      <div class="form-row cols-2">
        <div class="fg"><label style="font-size:11px">Pratinjau Logo</label><div id="sBizLogoPrev" style="display:none;align-items:center;min-height:40px"></div></div>
        <div class="fg"><label style="font-size:11px">Pratinjau QRIS</label><div id="sBizQrisPrev" style="display:none;align-items:center;min-height:40px"></div></div>
      </div>
      <div class="form-row cols-2">
        <div class="fg"><label>Transport per KM (Rp)</label><input type="number" id="sTransRate" value="${sanitize(s.transport_rate_per_km || '2000')}"></div>
        <div class="fg"><label>Footer Invoice</label><input id="sInvFooter" value="${sanitize(s.invoice_footer || '')}"></div>
      </div>
      <div class="form-row cols-2">
        <div class="fg"><label>Prefix Invoice</label><input id="sInvPrefix" value="${sanitize(s.invoice_prefix || 'DSF')}" placeholder="DSF"></div>
        <div class="fg"><label>Simbol Mata Uang</label><input id="sCurrency" value="${sanitize(s.currency_symbol || 'Rp')}" placeholder="Rp"></div>
      </div>
      <button class="btn btn-primary" onclick="saveBizSettings()"><i class="fa fa-floppy-disk"></i> Simpan Pengaturan</button>
    </div>`;
        previewBrandImg();
      } else if (tab === 'users') {
        if (!isAdmin()) { $('settingsContent').innerHTML = '<div class="table-empty"><i class="fa fa-lock"></i>Akses ditolak</div>'; return; }
        $('settingsContent').innerHTML = `<div class="section-hdr"><h2><i class="fa fa-users"></i> Manajemen Pengguna</h2><button class="btn btn-primary" onclick="openUserModal()"><i class="fa fa-plus"></i> Tambah</button></div><div id="userTable"><div class="table-empty"><i class="fa fa-spinner fa-spin"></i></div></div>`;
        ga('getUsers', [S.user.id, S.user.role], res => {
          if (!res.success) { $('userTable').innerHTML = `<div class="table-empty">${sanitize(res.message)}</div>`; return; }
          S.data.users = res.data;
          $('userTable').innerHTML = `<div class="card"><div class="table-wrap"><table><thead><tr><th>Nama</th><th>Email</th><th>Role</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${res.data.map(u => `<tr>
        <td style="font-weight:700">${sanitize(u.full_name)}</td>
        <td style="font-size:13px">${sanitize(u.email)}</td>
        <td><span class="badge badge-${sanitize(u.role)}">${sanitize(u.role)}</span></td>
        <td><span class="badge" style="background:${u.is_active ? 'var(--success-bg)' : 'var(--danger-bg)'};color:${u.is_active ? 'var(--success)' : 'var(--danger)'}">${u.is_active ? 'Aktif' : 'Nonaktif'}</span></td>
        <td style="white-space:nowrap">
          <button class="btn btn-sm btn-outline" onclick="openUserModalById(${u.id})"><i class="fa fa-edit"></i></button>
          ${u.id !== S.user.id ? `<button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id})"><i class="fa fa-trash"></i></button>` : ''}
        </td>
      </tr>`).join('')}</tbody></table></div></div>`;
        });
      } else if (tab === 'profile') {
        const u = S.user;
        $('settingsContent').innerHTML = `
    <div class="form-section">
      <div class="form-section-title"><i class="fa fa-user"></i> Profil Saya</div>
      <div class="form-row cols-2">
        <div class="fg"><label>Nama Lengkap</label><input id="pName" value="${sanitize(u.full_name)}"></div>
        <div class="fg"><label>No. HP</label><input id="pPhone" value="${sanitize(u.phone || '')}"></div>
      </div>
      <div class="fg" style="margin-bottom:10px"><label>Email</label><input value="${sanitize(u.email)}" disabled style="opacity:0.6;background:var(--cream-dark)"></div>
      <button class="btn btn-primary" onclick="saveProfile()"><i class="fa fa-floppy-disk"></i> Simpan</button>
    </div>`;
      }
    }

    // Pratinjau kecil logo & QRIS di tab Info Bisnis (mengikuti isi input)
    function previewBrandImg() {
      const pasang = (boxId, inputId, alt) => {
        const box = $(boxId), inp = $(inputId);
        if (!box) return;
        const v = String((inp && inp.value) || '').trim();
        const src = v ? brandUrlOk(v) : '';
        if (!src) { box.innerHTML = ''; box.style.display = 'none'; return; }
        box.style.display = 'flex';
        box.innerHTML = `<img src="${src}" alt="${alt}" loading="lazy" crossorigin="anonymous" style="display:block;width:40px;height:40px;object-fit:contain;background:#fff;border:1px solid var(--border);border-radius:6px;padding:2px" onerror="this.style.display='none'">`;
      };
      pasang('sBizLogoPrev', 'sBizLogo', 'Pratinjau logo');
      pasang('sBizQrisPrev', 'sBizQris', 'Pratinjau QRIS');
    }

    function saveBizSettings() {
      const settings = { business_name: $('sBizName').value, business_tagline: $('sBizTag').value, business_phone: $('sBizPhone').value, business_address: $('sBizAddr').value, business_instagram: $('sBizIG').value, business_tiktok: $('sBizTT').value, payment_info: $('sBizPay').value, transport_rate_per_km: $('sTransRate').value, invoice_footer: $('sInvFooter').value, invoice_prefix: ($('sInvPrefix').value || 'DSF').trim(), currency_symbol: ($('sCurrency').value || 'Rp').trim(), logo_url: ($('sBizLogo') ? $('sBizLogo').value.trim() : ''), qris_url: ($('sBizQris') ? $('sBizQris').value.trim() : '') };
      loading(true, 'Menyimpan...');
      ga('saveAllSettings', [settings, S.user.id, S.user.role], res => {
        loading(false);
        if (res.success) {
          Object.assign(S.settings, settings);
          toast('Pengaturan disimpan!', 'success');
          // Gambar bisa berubah: bersihkan cache data URI lalu ambil ulang di latar belakang
          S.brand.logo = ''; S.brand.qris = '';
          setSidebarLogo();
          prefetchBrandAssets();
        }
        else toast(res.message, 'error');
      });
    }

    function saveProfile() {
      const d = { full_name: $('pName').value.trim(), phone: $('pPhone').value };
      if (!d.full_name) { toast('Nama wajib diisi', 'warning'); return; }
      loading(true);
      ga('updateProfile', [d, S.user.id], res => {
        loading(false);
        if (res.success) { S.user.full_name = d.full_name; S.user.phone = d.phone; $('sidebarName').textContent = d.full_name; $('sidebarAvatar').textContent = d.full_name.charAt(0); toast('Profil diperbarui!', 'success'); }
        else toast(res.message, 'error');
      });
    }

    function savePwd() {
      const old = $('pwdOld').value, nw = $('pwdNew').value, cn = $('pwdCon').value;
      if (!old || !nw) { toast('Semua field wajib diisi', 'warning'); return; }
      if (nw !== cn) { toast('Konfirmasi password tidak cocok', 'warning'); return; }
      if (nw.length < 6) { toast('Password minimal 6 karakter', 'warning'); return; }
      loading(true);
      ga('changePassword', [S.user.id, old, nw], res => {
        loading(false);
        if (res.success) { toast('Password berhasil diubah!', 'success'); $('pwdOld').value = ''; $('pwdNew').value = ''; $('pwdCon').value = ''; }
        else toast(res.message, 'error');
      });
    }

    function openUserModal(u) {
      if (!isAdmin()) { toast('Akses ditolak', 'error'); return; }
      $('modalContainer').innerHTML = `
  <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal modal-sm">
      <div class="modal-header"><h3><i class="fa fa-user-gear"></i> ${u ? 'Ubah' : 'Tambah'} Pengguna</h3><button class="modal-close" onclick="closeModal()"><i class="fa fa-xmark"></i></button></div>
      <div class="modal-body">
        <div class="fg" style="margin-bottom:12px"><label>Nama Lengkap *</label><input id="uName" value="${sanitize(u?.full_name || '')}"></div>
        <div class="fg" style="margin-bottom:12px"><label>Email *</label><input type="email" id="uEmail" value="${sanitize(u?.email || '')}"></div>
        <div class="form-row cols-2">
          <div class="fg"><label>No. HP</label><input id="uPhone" value="${sanitize(u?.phone || '')}"></div>
          <div class="fg"><label>Role</label><select id="uRole"><option value="admin">Admin</option><option value="therapist">Terapis</option><option value="receptionist">Resepsionis</option></select></div>
        </div>
        <div class="fg" style="margin-bottom:12px"><label>Password ${u ? '(kosongkan jika tidak diubah)' : ' *'}</label><input type="password" id="uPwd" placeholder="${u ? 'Kosongkan jika tidak diubah' : 'Minimal 6 karakter'}"></div>
        ${u ? `<div class="fg"><label>Status</label><select id="uActive"><option value="1">Aktif</option><option value="0">Nonaktif</option></select></div>` : ''}
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
        <button class="btn btn-primary" onclick="saveUser(${u?.id || null})"><i class="fa fa-floppy-disk"></i> Simpan</button>
      </div>
    </div>
  </div>`;
      if (u) { $('uRole').value = u.role; if ($('uActive')) $('uActive').value = u.is_active; }
    }

    // Lookup by id — menghindari JSON inline pada atribut onclick
    function openUserModalById(id) {
      const u = (S.data.users || []).find(x => String(x.id) === String(id));
      if (!u) { toast('Data pengguna tidak ditemukan', 'error'); return; }
      openUserModal(u);
    }

    function saveUser(id) {
      const d = { full_name: $('uName').value.trim(), email: $('uEmail').value.trim(), phone: $('uPhone').value, userRole: $('uRole').value, password: $('uPwd').value };
      if (id) { d.id = id; d.is_active = $('uActive').value; }
      loading(true);
      ga(id ? 'updateUser' : 'addUser', [d, S.user.id, S.user.role], res => {
        loading(false);
        if (res.success) { toast(res.message, 'success'); closeModal(); loadSettingsTab('users'); }
        else toast(res.message, 'error');
      });
    }

    function deleteUser(id) {
      confirm('Hapus Pengguna?', 'Pengguna akan dihapus permanen.', 'danger', () => {
        loading(true);
        ga('deleteUser', [id, S.user.id, S.user.role], res => {
          loading(false);
          if (res.success) { toast('Pengguna dihapus', 'success'); loadSettingsTab('users'); }
          else toast(res.message, 'error');
        });
      });
    }

    // ═══════════════════════════════════════════════════════════════
    //  LOGS
    // ═══════════════════════════════════════════════════════════════
    function renderLogs() {
      $('pageContent').innerHTML = '<div class="card" id="logsWrap"><div class="table-empty"><i class="fa fa-spinner fa-spin"></i></div></div>';
      ga('getLogs', [S.user.id, S.user.role, 200], res => {
        if (!res.success) { toast(res.message, 'error'); return; }
        const logIcons = { LOGIN: 'fa-right-to-bracket', CREATE: 'fa-plus', UPDATE: 'fa-pen', DELETE: 'fa-trash', CANCEL: 'fa-ban' };
        $('logsWrap').innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>Waktu</th><th>Pengguna</th><th>Aksi</th><th>Tabel</th><th>Detail</th></tr></thead>
      <tbody>${res.data.length ? res.data.map(l => `<tr>
        <td style="font-size:12px;white-space:nowrap">${new Date(l.created_at).toLocaleString('id-ID')}</td>
        <td style="font-weight:600">${sanitize(l.username)}</td>
        <td><span class="badge" style="background:var(--cream-dark);color:var(--sage-dark)"><i class="fa ${logIcons[l.action] || 'fa-circle'}"></i> ${sanitize(l.action)}</span></td>
        <td style="font-size:12px">${sanitize(l.table_name)}</td>
        <td style="font-size:12px;color:var(--text-muted)">${sanitize(l.details)}</td>
      </tr>`).join('') : '<tr><td colspan="5" class="table-empty"><i class="fa fa-list"></i>Belum ada log</td></tr>'}</tbody>
    </table></div>`;
      });
    }

    // ═══════════════════════════════════════════════════════════════
    //  AUTO-BOOT (aplikasi langsung masuk sebagai admin)
    // ═══════════════════════════════════════════════════════════════
    (function init() {
      // Tidak ada lagi sesi tersimpan / halaman login.
      // Splash tetap tampil sampai startApp() dipanggil, jadi layar tidak pernah kosong.
      $('app').style.display = 'none';
      bootstrapApp();
    })();
  </script>
</body>

</html>
