    let currentView = 'list';
    function setView(v) {
      currentView = v;
      $('viewList').style.cssText = v === 'list' ? 'background:var(--sage);color:#fff' : '';
      $('viewCal').style.cssText = v === 'cal' ? 'background:var(--sage);color:#fff' : '';
      loadSchedules();
    }
    function resetFilters() {
      $('fStatus').value = ''; $('fFrom').value = ''; $('fTo').value = '';
      if ($('fSearch')) $('fSearch').value = '';
      if ($('fSort')) $('fSort').value = 'date_desc';
      loadSchedules();
    }
    function loadSchedules() {
      const filters = { status: $('fStatus').value, dateFrom: $('fFrom').value, dateTo: $('fTo').value };
      ga('getSchedules', [S.user.id, S.user.role, filters], res => {
        if (!res.success) { toast(res.message, 'error'); return; }
        S.data.schedules = res.data;
        if (currentView === 'cal') renderCalendar(res.data);
        else renderScheduleList(res.data);
      });
    }

    // Pencarian & urutan di sisi klien: tidak memanggil server, S.data.schedules tetap utuh.
    // Dipakai input #fSearch dan pilihan #fSort.
    function applyJadwalFilters() {
      if (currentView === 'cal') return; // tampilan kalender tidak diubah
      if (!Array.isArray(S.data.schedules) || !S.data.schedules.length) return; // data belum termuat
      renderScheduleList(S.data.schedules);
    }

    // Kolom yang ikut dicari (teks digabung, pencarian tidak peka huruf besar/kecil)
    function scheduleSearchText(s) {
      if (!s) return '';
      return [s.customer_name, s.customer_phone, s.invoice_no, schedTreatmentsText(s), s.location]
        .map(x => String(x || '')).join(' ');
    }

    function scheduleSortedFiltered(data) {
      const semua = Array.isArray(data) ? data : [];
      const q = String((($('fSearch') || {}).value) || '').trim().toLowerCase();
      const qDigit = q.replace(/\D/g, '');
      let rows = semua.slice();
      if (q) {
        rows = rows.filter(s => {
          if (scheduleSearchText(s).toLowerCase().indexOf(q) !== -1) return true;
          if (!qDigit) return false;
          const hp = String((s && s.customer_phone) || '').replace(/\D/g, '');
          return hp.indexOf(qDigit) !== -1;
        });
      }
      const mode = ($('fSort') && $('fSort').value) || 'date_desc';
      const tgl = s => String((s && s.schedule_date) || '');
      const jam = s => String((s && s.schedule_time) || '').trim();
      if (mode === 'date_asc') {
        rows.sort((a, b) => tgl(a).localeCompare(tgl(b)) || (jam(a) || '99:99').localeCompare(jam(b) || '99:99'));
      } else if (mode === 'time_asc') {
        // Pagi ke sore: tanggal dulu, lalu jam (jam kosong paling bawah)
        rows.sort((a, b) => tgl(a).localeCompare(tgl(b)) || (jam(a) || '99:99').localeCompare(jam(b) || '99:99'));
      } else if (mode === 'name_asc') {
        rows.sort((a, b) => String((a && a.customer_name) || '').localeCompare(String((b && b.customer_name) || ''), 'id'));
      } else if (mode === 'total_desc') {
        rows.sort((a, b) => (parseFloat(b && b.grand_total) || 0) - (parseFloat(a && a.grand_total) || 0));
      } else {
        // date_desc — urutan bawaan server (tanggal terbaru)
        rows.sort((a, b) => tgl(b).localeCompare(tgl(a)));
      }
      return rows;
    }

    function renderScheduleList(data) {
      const semua = Array.isArray(data) ? data : [];
      const rows = scheduleSortedFiltered(semua);
      if (!rows.length) {
        const cari = String((($('fSearch') || {}).value) || '').trim();
        const kosong = semua.length
          ? `<div class="table-empty" style="background:var(--white);border-radius:var(--radius-md);padding:48px"><i class="fa fa-magnifying-glass"></i>Tidak ada jadwal yang cocok${cari ? ' dengan "' + sanitize(cari) + '"' : ''}</div>`
          : `<div class="table-empty" style="background:var(--white);border-radius:var(--radius-md);padding:48px"><i class="fa fa-calendar-plus"></i>Belum ada jadwal.${isWriter() ? ' Klik + Tambah Jadwal untuk mulai.' : ''}</div>`;
        $('jadwalContent').innerHTML = kosong;
        return;
      }
      // Nomor invoice per baris, dipakai kunjungan paket untuk menampilkan nomor invoice induk
      const invById = {};
      semua.forEach(x => { if (x.invoice_no) invById[String(x.id)] = x.invoice_no; });
      $('jadwalContent').innerHTML = `
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Invoice</th><th>Tanggal & Waktu</th><th>Pelanggan</th><th>Treatment</th><th>Terapis</th><th>Total</th><th>Status</th><th>Keterangan</th><th>Aksi</th></tr></thead>
        <tbody>${rows.map(s => `<tr>
          <td>${invCellHtml(s, invById)}</td>
          <td><div style="font-weight:600">${fmtDate(s.schedule_date)}</div><div style="font-size:12px;color:var(--text-muted)">${sanitize(s.schedule_time)}</div></td>
          <td><div style="font-weight:600">${sanitize(s.customer_name)}</div><div style="font-size:12px;color:var(--text-muted)">${sanitize(s.customer_phone)}</div></td>
          <td style="max-width:200px"><div style="font-size:12.5px;font-weight:600;color:var(--text-sec);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${sanitize(schedTreatmentsText(s)) || '—'}</div><div style="font-size:11px;color:var(--text-muted);margin-top:3px;overflow-wrap:anywhere"><i class="fa fa-location-dot"></i> ${sanitize(s.location) || '—'}</div></td>
          <td>${sanitize(s.therapist_name) || '—'}</td>
          <td style="font-weight:700;color:var(--sage-dark)">${fmtRp(s.grand_total)}</td>
          <td><span class="badge badge-${s.status}">${statusLabel(s.status)}</span></td>
          <td><span class="badge badge-${keteranganClass(s.keterangan)}" style="font-size:10px">${sanitize(s.keterangan) || '—'}</span></td>
          <td style="white-space:nowrap">
            ${s.maps_link ? `<a class="btn btn-sm btn-outline" href="${attrUrl(s.maps_link)}" target="_blank" rel="noopener" title="Buka Maps"><i class="fa fa-map-location-dot"></i></a>` : ''}
            <button class="btn btn-sm btn-outline" onclick="viewSchedule(${s.id})" title="Lihat"><i class="fa fa-eye"></i></button>
            ${isWriter() ? `<button class="btn btn-sm btn-outline" onclick="openScheduleModal(${s.id})" title="Ubah"><i class="fa fa-pen"></i></button>` : ''}
            <button class="btn btn-sm btn-beige" onclick="printInvoiceById(${schedPrintId(s)})" title="Invoice"><i class="fa fa-file-invoice"></i></button>
            ${s.status === 'scheduled' && isWriter() ? `<button class="btn btn-sm btn-outline" onclick="changeStatus(${s.id},'done')" title="Tandai Selesai"><i class="fa fa-circle-check"></i></button>` : ''}
            ${s.due_amount > 0 && isWriter() && !isPackageVisit(s) ? `<button class="btn btn-sm btn-primary" onclick="openPayModal(${s.id},${s.due_amount},'${sanitize(s.customer_id)}','${sanitize(s.invoice_no)}')" title="Bayar"><i class="fa fa-money-bill"></i></button>` : ''}
            ${isAdmin() ? `<button class="btn btn-sm btn-danger" onclick="deleteSchedule(${s.id})" title="Hapus"><i class="fa fa-trash"></i></button>` : ''}
          </td>
        </tr>`).join('')}</tbody>
      </table>
    </div>
  </div>`;
    }

    // ─── Penanda paket NB di daftar jadwal ───
    // Kunjungan selain kunjungan pertama tidak memegang nomor invoice, jadi nomor
    // invoice induknya dicari dari baris lain yang sudah dimuat.
    function isPackageVisit(s) {
      if (!s || !s.package_id || !s.master_id) return false;
      return String(s.master_id) !== String(s.id);
    }
    function masterInvoiceNoOf(s, invById) {
      if (!s || !s.package_id) return String((s && s.invoice_no) || '');
      if (!isPackageVisit(s)) return String(s.invoice_no || '');
      const key = String(s.master_id);
      if (invById && invById[key]) return invById[key];
      return '';
    }
    // Tombol cetak untuk kunjungan paket membuka invoice induk
    function schedPrintId(s) {
      if (!s) return '';
      return (s.package_id && s.master_id) ? s.master_id : s.id;
    }
    function invCellHtml(s, invById) {
      if (!s.package_id) return `<span style="font-family:monospace;font-weight:700;font-size:12px">${sanitize(s.invoice_no)}</span>`;
      const vno = parseInt(s.visit_no, 10) || 1;
      const vtot = parseInt(s.total_visits, 10) || 1;
      const badge = `<span class="badge" style="background:var(--cream-dark);color:var(--sage-dark);font-size:10px">Paket ${vno}/${vtot}</span>`;
      const no = masterInvoiceNoOf(s, invById);
      if (!no) return badge;
      const gaya = isPackageVisit(s) ? 'font-size:11px;color:var(--text-muted)' : 'font-weight:700;font-size:12px';
      return badge + `<div style="font-family:monospace;${gaya};margin-top:4px">${sanitize(no)}</div>`;
    }

    function renderCalendar(data) {
      const y = S.calYear, m = S.calMonth;
      const firstDay = new Date(y, m, 1).getDay();
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      const todayStr = today();

      // Build event map
      const evtMap = {};
      data.forEach(s => {
        const d = s.schedule_date;
        if (!evtMap[d]) evtMap[d] = [];
        evtMap[d].push(s);
      });
      // Urutkan jam tiap hari (HH:mm naik); jam kosong ditaruh paling bawah
      Object.keys(evtMap).forEach(k => {
        evtMap[k].sort((a, b) => {
          const ta = String((a && a.schedule_time) || '').trim();
          const tb = String((b && b.schedule_time) || '').trim();
          if (!ta && !tb) return 0;
          if (!ta) return 1;
          if (!tb) return -1;
          return ta < tb ? -1 : (ta > tb ? 1 : 0);
        });
      });

      let cells = '';
      for (let i = 0; i < firstDay; i++) cells += `<div class="cal-day other-month"></div>`;
      for (let d = 1; d <= daysInMonth; d++) {
        const ds = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        const isToday = ds === todayStr;
        const evts = evtMap[ds] || [];
        cells += `<div class="cal-day ${isToday ? 'today' : ''}" onclick="calDayClick('${ds}')">
      <div class="cal-day-num">${isToday ? `<span>${d}</span>` : d}</div>
      ${evts.slice(0, 3).map(e => `<div class="cal-event ${e.status}" title="${sanitize(e.customer_name)}">${sanitize(e.schedule_time) ? sanitize(e.schedule_time) + ' ' : ''}${sanitize(e.customer_name)}</div>`).join('')}
      ${evts.length > 3 ? `<div style="font-size:10px;color:var(--text-muted)">+${evts.length - 3} lainnya</div>` : ''}
    </div>`;
      }

      $('jadwalContent').innerHTML = `
  <div class="card">
    <div class="card-body">
      <div class="cal-nav">
        <button class="btn btn-ghost btn-sm" onclick="changeMonth(-1)"><i class="fa fa-chevron-left"></i></button>
        <div class="cal-month-title">${months[m]} ${y}</div>
        <button class="btn btn-ghost btn-sm" onclick="changeMonth(1)"><i class="fa fa-chevron-right"></i></button>
      </div>
      <div class="cal-grid">
        ${['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'].map(d => `<div class="cal-day-hdr">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>
  </div>`;
    }

    function changeMonth(d) {
      S.calMonth += d;
      if (S.calMonth < 0) { S.calMonth = 11; S.calYear--; }
      if (S.calMonth > 11) { S.calMonth = 0; S.calYear++; }
      loadSchedules();
    }

    function calDayClick(ds) {
      const evts = S.data.schedules.filter(s => s.schedule_date === ds);
      if (!evts.length) { if (isWriter()) openScheduleModal(ds); return; }
      // Show day events list
      $('modalContainer').innerHTML = `
  <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal modal-sm">
      <div class="modal-header"><h3><i class="fa fa-calendar-day"></i> ${fmtDate(ds)}</h3><button class="modal-close" onclick="closeModal()"><i class="fa fa-xmark"></i></button></div>
      <div class="modal-body">
        ${evts.map(s => `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-light)">
          <div><div style="font-weight:700">${sanitize(s.customer_name)}</div><div style="font-size:12px;color:var(--text-muted)">${sanitize(s.schedule_time)} · ${sanitize(s.location)}</div></div>
          <div style="display:flex;gap:6px">
            <button class="btn btn-sm btn-outline" onclick="closeModal();viewSchedule(${s.id})"><i class="fa fa-eye"></i></button>
            <button class="btn btn-sm btn-beige" onclick="closeModal();printInvoiceById(${s.id})"><i class="fa fa-print"></i></button>
          </div>
        </div>`).join('')}
        ${isWriter() ? `<div style="margin-top:14px"><button class="btn btn-primary" onclick="closeModal();openScheduleModal('${ds}')"><i class="fa fa-plus"></i> Tambah Jadwal Hari Ini</button></div>` : ''}
      </div>
    </div>
  </div>`;
    }

    function statusLabel(s) { return { scheduled: 'Terjadwal', done: 'Selesai', cancelled: 'Dibatalkan' }[s] || s; }
    function keteranganClass(k) { if (!k) return ''; k = k.toLowerCase(); if (k.includes('lunas')) return 'lunas'; if (k.includes('belum')) return 'belum'; if (k.includes('dp')) return 'dp'; return ''; }

    // ─── SCHEDULE MODAL ───

        scheduleId = String(preDate); dateVal = '';
      }
      const isEdit = !!scheduleId;
      if (!isWriter()) { toast('Anda tidak memiliki akses untuk ' + (isEdit ? 'mengubah' : 'menambah') + ' jadwal', 'error'); return; }

      if (isEdit) loading(true, 'Memuat jadwal...');
      let treatmentOpts = '';
      ga('getTreatmentsForDropdown', [], res => {
        if (res.success) S.data.treatments = res.data;
        treatmentOpts = (res.data || []).map(t => `<option value="${t.id}" data-price="${t.price}" data-name="${sanitize(t.category)} - ${sanitize(t.name)} | Rp ${(t.price / 1000).toFixed(0)}K">${sanitize(t.category)} - ${sanitize(t.name)} | Rp ${(t.price / 1000).toFixed(0)}K</option>`).join('');
        ga('getCustomersForDropdown', [], cres => {
          ga('getTherapistsForDropdown', [], tres => {
            const custOpts = (cres.data || []).map(c => `<option value="${c.id}">${sanitize(c.name)} - ${sanitize(c.phone)}</option>`).join('');
            const therapOpts = (tres.data || []).map(t => `<option value="${t.id}">${sanitize(t.name)}</option>`).join('');
            $('modalContainer').innerHTML = `
        <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
          <div class="modal modal-lg">
            <div class="modal-header"><h3><i class="fa ${isEdit ? 'fa-pen' : 'fa-calendar-plus'}"></i> ${isEdit ? 'Ubah Jadwal' : 'Tambah Jadwal Baru'}</h3><button class="modal-close" onclick="closeModal()"><i class="fa fa-xmark"></i></button></div>
            <div class="modal-body">
              <div id="pkgEditNote" style="display:none;background:var(--cream-dark);border:1px solid var(--beige);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:14px;font-size:12.5px;line-height:1.5;color:var(--text-sec)"></div>
              <div class="form-section">

                      <select id="fCust" onchange="fillLocFromCust('nc')" style="flex:1 1 130px;min-width:0"><option value="">— Walk-in —</option>${custOpts}</select>

                  <div style="font-size:12.5px;font-weight:700;color:var(--text-sec);margin-bottom:10px"><i class="fa fa-user-plus"></i> Pelanggan Baru</div>
                  <div class="fg" style="margin-bottom:10px"><label>Nama *</label><input type="text" id="ncName" placeholder="Nama ibu/pelanggan" autocomplete="off"></div>
                  <div class="fg" style="margin-bottom:10px"><label>No. HP *</label><input type="text" id="ncPhone" placeholder="08xxxxxxxxxx" inputmode="tel" autocomplete="off"></div>
                  <div class="fg" style="margin-bottom:10px"><label>Alamat</label><input type="text" id="ncAddr" placeholder="Wilayah atau alamat lengkap (opsional)" autocomplete="off"></div>

                  <div style="font-size:11.5px;color:var(--text-muted);margin-top:8px;line-height:1.45">Pelanggan langsung tersimpan dan terpilih di form ini.</div>

              <div class="form-section">

                  <div class="fg"><label>Tanggal *</label><input type="date" id="fDate" value="${isEdit ? '' : (dateVal || today())}"></div>

              </div>
              <div class="form-section">
                <div class="form-section-title"><i class="fa fa-calculator"></i> Pembayaran</div>
                <div class="form-row cols-3" id="rowMoney">
                  <div class="fg">
                    <label>Transport (Rp)</label>
                    <input type="number" id="fTransport" value="0" min="0" step="1000" oninput="onTransportInput()">

                    <label style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text-sec);margin-top:6px;cursor:pointer"><input type="checkbox" id="fTransportAuto" checked onchange="toggleTransportAuto()" style="width:16px;height:16px;accent-color:var(--sage);cursor:pointer"> Hitung otomatis dari KM</label>
                  </div>
                  <div class="fg"><label>Diskon (Rp)</label><input type="number" id="fDiscount" value="0" min="0" step="1000" oninput="calcSummary()"></div>
                  <div class="fg">
                    <label>Dibayar (Rp)${isEdit ? ' <span style="color:var(--text-muted);font-weight:400">(tetap)</span>' : ''}</label>
                    <input type="number" id="fPaid" value="0" min="0" step="1000" oninput="calcSummary()">
                    ${isEdit ? '' : `<div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">
                      <button type="button" class="btn btn-outline" id="fPaidPct20" onclick="setPaidPct(20)" style="min-height:0;padding:5px 10px;font-size:11.5px">20%</button>

                    </div>
                    <div style="font-size:11.5px;font-weight:600;color:var(--text-muted);margin-top:4px">DP opsional</div>`}
                  </div>
                </div>
                <div id="summaryBox" class="summary-box" style="margin-top:4px">
                  <div class="summary-row"><span>Fee Treatment</span><span id="sumFee">Rp 0</span></div>
                  <div class="summary-row"><span>Transport</span><span id="sumTransport">Rp 0</span></div>
                  <div class="summary-row"><span>Subtotal</span><span id="sumSubtotal">Rp 0</span></div>
                  <div class="summary-row"><span>Diskon</span><span id="sumDiscount">Rp 0</span></div>
                  <div class="summary-row total"><span>TOTAL</span><span id="sumTotal">Rp 0</span></div>
                  <div class="summary-row" style="color:var(--danger);font-weight:700"><span>Sisa Bayar</span><span id="sumDue">Rp 0</span></div>
                </div>
                <div class="fg" style="margin-top:14px" id="fgStatusPreview"><label>Status Pembayaran (otomatis)</label><input type="text" id="fKetPreview" value="BELUM BAYAR" disabled style="opacity:0.85;background:var(--cream-dark);font-weight:700;color:var(--sage-dark)"></div>
                <div class="fg" style="margin-top:10px"><label>Catatan</label><textarea id="fNotes" rows="2" placeholder="Catatan tambahan..."></textarea></div>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
              <button class="btn btn-primary" onclick="saveSchedule()"><i class="fa fa-floppy-disk"></i> ${isEdit ? 'Simpan Perubahan' : 'Simpan Jadwal'}</button>
            </div>
          </div>
        </div>`;
            ensureCustCache();
            if (isEdit) {
              ga('getScheduleDetail', [scheduleId, S.user.id, S.user.role], dres => {
                loading(false);
                if (!dres.success) { toast(dres.message, 'error'); closeModal(); return; }
                const det = dres.data;
                // Kunjungan paket tidak punya baris treatment sendiri — item dibaca dari
                // invoice induk supaya isian yang dikirim tetap berisi id treatment asli.
                if (det.is_package && det.master_id && String(det.master_id) !== String(det.id)) {
                  ga('getScheduleDetail', [det.master_id, S.user.id, S.user.role], mres => {
                    if (mres && mres.success && mres.data && (mres.data.items || []).length) det.itemsMaster = mres.data.items;
                    prefillScheduleForm(det);
                  });
                  return;
                }
                prefillScheduleForm(det);
              });
            } else {
              addItemRow(); // add first row
              calcSummary();
              updateTransportHint();
            }
          });
        });
      });
    }

    // ─── PELANGGAN BARU LANGSUNG DARI FORM (tetap di modal yang sama) ───
    // prefix 'nc' = modal Tambah Jadwal, 'pc' = modal Tambah Paket NB.
    const NEWCUST_MAP = {
      nc: { sel: 'fCust', loc: 'fLoc', block: 'ncBlock', name: 'ncName', phone: 'ncPhone', addr: 'ncAddr', baby: 'ncBaby', save: 'ncSave' },
      pc: { sel: 'pCust', loc: 'pLoc', block: 'pcBlock', name: 'pcName', phone: 'pcPhone', addr: 'pcAddr', baby: 'pcBaby', save: 'pcSave' }
    };

    // Cache pelanggan lengkap (berisi alamat) dimuat sekali saja, supaya pengisian
    // lokasi otomatis tetap jalan walau halaman Pelanggan belum pernah dibuka.
    function ensureCustCache() {
      if ((S.data.customers || []).length) return;
      ga('getCustomers', [S.user.id, S.user.role], res => {
        if (!res || !res.success || !res.data) return;
        S.data.customers = res.data;
        fillLocFromCust('nc');
        fillLocFromCust('pc');
      });
    }

    function toggleNewCust(prefix) {
      const m = NEWCUST_MAP[prefix];
      const box = m ? $(m.block) : null;
      if (!box) return;
      const show = box.style.display === 'none';
      box.style.display = show ? '' : 'none';
      if (show) { const el = $(m.name); if (el) el.focus(); }
    }

    function clearNewCust(prefix) {
      const m = NEWCUST_MAP[prefix];
      if (!m) return;
      [m.name, m.phone, m.addr, m.baby].forEach(k => { const el = $(k); if (el) el.value = ''; });
    }

    function cancelNewCust(prefix) {
      const m = NEWCUST_MAP[prefix];
      if (!m) return;
      const box = $(m.block);
      if (box) box.style.display = 'none';
      clearNewCust(prefix);
    }

    // Tambahkan opsi pelanggan baru ke dropdown lalu pilih
    function addCustOption(selId, id, name, phone) {
      const sel = $(selId);
      if (!sel || !id) return;
      const o = document.createElement('option');
      o.value = String(id);
      o.textContent = String(name || '') + ' - ' + String(phone || '');
      sel.appendChild(o);
      sel.value = String(id);
    }

    // Isi Lokasi dari alamat pelanggan terpilih — hanya bila Lokasi masih kosong
    function fillLocFromCust(prefix) {
      const m = NEWCUST_MAP[prefix];
      if (!m) return;
      const sel = $(m.sel), loc = $(m.loc);
      if (!sel || !loc) return;
      if (String(loc.value || '').trim() !== '') return;
      const id = String(sel.value || '');
      if (!id) return;
      const c = (S.data.customers || []).find(x => String(x.id) === id);
      const addr = c ? String(c.address || '').trim() : '';
      if (!addr) return;
      loc.value = addr;
    }

    function saveNewCust(prefix) {
      const m = NEWCUST_MAP[prefix];
      if (!m) return;
      const btn = $(m.save);
      if (btn && btn.disabled) return; // cegah klik ganda
      const nameEl = $(m.name), phoneEl = $(m.phone), addrEl = $(m.addr), babyEl = $(m.baby);
      const name = String((nameEl && nameEl.value) || '').trim();
      const phone = String((phoneEl && phoneEl.value) || '').trim();
      if (!name) { toast('Nama pelanggan wajib diisi', 'warning'); if (nameEl) nameEl.focus(); return; }
      if (!phone) { toast('No. HP pelanggan wajib diisi', 'warning'); if (phoneEl) phoneEl.focus(); return; }
      const address = String((addrEl && addrEl.value) || '').trim();
      const babyName = String((babyEl && babyEl.value) || '').trim();
      const label = btn ? btn.innerHTML : '';
      if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Menyimpan...'; }
      let selesai = false;
      const done = () => {
        if (selesai) return;
        selesai = true;
        if (!btn || !btn.isConnected) return; // modal bisa saja sudah ditutup
        btn.disabled = false;
        btn.innerHTML = label;
      };
      // Jaring pengaman: bila koneksi putus tanpa balasan, tombol bisa dipakai lagi
      setTimeout(done, 20000);
      ga('addCustomer', [{
        name: name, phone: phone, address: address, baby_name: babyName,
        baby_age: '', dob: '', maps_link: '', notes: ''
      }, S.user.id, S.user.role], res => {
        done();
        if (!res || !res.success) {
          toast((res && res.message) || 'Gagal menambahkan pelanggan', 'error');
          return; // isian dibiarkan supaya bisa dicoba lagi
        }
        const data = (res && res.data) || {};
        const newName = data.name || name;
        // Sinkronkan cache supaya halaman Pelanggan & pencarian langsung melihatnya
        if (Array.isArray(S.data.customers)) {
          S.data.customers.push({ id: data.id, name: newName, phone: phone, address: address, baby_name: babyName, dob: '', maps_link: '', notes: '', total_purchase: 0, total_paid: 0, total_due: 0 });
        }
        addCustOption(m.sel, data.id, newName, phone);
        const box = $(m.block);
        if (box) box.style.display = 'none';
        clearNewCust(prefix);
        toast('Pelanggan ' + newName + ' ditambahkan', 'success');
        fillLocFromCust(prefix); // alamat baru langsung dipakai bila Lokasi masih kosong
      });
    }

    let itemCount = 0;
    // Tanpa argumen = baris kosong. Dengan trId = baris terisi (dipakai saat mengubah jadwal).
    function addItemRow(trId, qty, priceOverride, labelOverride) {
      itemCount++;
      const id = 'item_' + itemCount;
      const treatments = S.data.treatments || [];
      const opts = treatments.map(t => `<option value="${t.id}" data-price="${t.price}">${sanitize(t.category)} - ${sanitize(t.name)} | Rp ${(t.price / 1000).toFixed(0)}K</option>`).join('');
      const row = document.createElement('div');
      row.className = 'item-row'; row.id = id;
      row.innerHTML = `
    <div class="fg"><label>Treatment</label><select onchange="itemTrSelect(this,'${id}')"><option value="">— Pilih —</option>${opts}</select></div>
    <div class="fg"><label>Harga (Rp)</label><input type="number" id="${id}_price" value="0" min="0" step="1000" oninput="calcItemRow('${id}');calcSummary()"></div>
    <div class="fg"><label>Qty</label><input type="number" id="${id}_qty" value="1" min="1" oninput="calcItemRow('${id}');calcSummary()"></div>
    <div style="padding-top:26px"><button class="btn btn-danger btn-icon" onclick="document.getElementById('${id}').remove();calcSummary();updateNbWarn()" title="Hapus"><i class="fa fa-trash"></i></button></div>`;
      $('itemsContainer').appendChild(row);
      if (!trId) { updateNbWarn(); return id; }
      const sel = row.querySelector('select');
      const val = String(trId);
      // Treatment lama yang sudah tidak aktif/dihapus tetap ditampilkan supaya tidak hilang diam-diam
      if (!treatments.some(t => String(t.id) === val) && labelOverride) {
        const o = document.createElement('option');
        o.value = val; o.dataset.price = String(parseFloat(priceOverride) || 0); o.textContent = labelOverride;
        sel.appendChild(o);
      }
      sel.value = val;
      const opt = sel.options[sel.selectedIndex];
      const price = priceOverride !== undefined && priceOverride !== null ? (parseFloat(priceOverride) || 0) : (parseFloat(opt ? opt.dataset.price : 0) || 0);
      $(id + '_price').value = price;
      $(id + '_qty').value = parseInt(qty, 10) > 0 ? parseInt(qty, 10) : 1;
      sel.dataset.trId = sel.value;
      sel.dataset.trName = opt ? opt.text : '';
      calcItemRow(id);
      updateNbWarn();
      return id;
    }

    // Peringatan lunak: treatment kategori NB sebaiknya dibuat lewat "Tambah Paket NB".
    // Hanya peringatan — jadwal satu kunjungan tetap boleh disimpan.
    function updateNbWarn() {
      const box = $('nbWarn');
      const cont = $('itemsContainer');
      if (!box || !cont) return;
      let isNb = false;
      cont.querySelectorAll('select').forEach(sel => {
        if (isNb || !sel.value) return;
        const opt = sel.options[sel.selectedIndex];
        const tr = (S.data.treatments || []).find(t => String(t.id) === String(sel.value));
        // Kategori ada di awal label baris ("NB - Nama Paket | Rp ...")
        const label = tr ? String(tr.category || '') : String((opt && opt.text) || '');
        if (/^\s*nb/i.test(label)) isNb = true;
      });
      box.style.display = isNb ? '' : 'none';
    }

    // Isi form jadwal dari getScheduleDetail (mode ubah)
    function prefillScheduleForm(s) {
      // Modal bisa saja sudah ditutup saat data datang
      if (!$('itemsContainer')) return;
      const setVal = (id, v) => { const el = $(id); if (el) el.value = v; };
      // Pelanggan/terapis yang sudah nonaktif tidak ada di dropdown — tambahkan agar tidak hilang saat disimpan
      const setSelect = (id, val, label) => {
        const el = $(id);
        if (!el) return;
        el.value = val ? String(val) : '';
        if (val && el.value !== String(val)) {
          const o = document.createElement('option');
          o.value = String(val); o.textContent = label || String(val);
          el.appendChild(o); el.value = String(val);
        }
      };
      setSelect('fCust', s.customer_id, s.customer_name);
      setSelect('fTherapist', s.therapist_id, s.therapist_name);
      setVal('fDate', fmtDateInput(s.schedule_date));
      setVal('fTime', s.schedule_time || '');
      setVal('fLoc', s.location || '');
      setVal('fMaps', s.maps_link || '');
      setVal('fKm', parseFloat(s.km) || 0);
      setVal('fTransport', parseFloat(s.transport_fee) || 0);
      setVal('fDiscount', parseFloat(s.discount) || 0);
      setVal('fNotes', s.notes || '');
      // Metode bayar hanya "Cash" atau "TF/QRIS"
      const meth = $('fMethod');
      if (meth) meth.value = String(s.payment_method || '').toLowerCase().indexOf('cash') !== -1 ? 'Cash' : 'TF/QRIS';
      // Sudah dibayar tidak diubah dari form ini (backend mempertahankan nilai lama)
      const paidEl = $('fPaid');
      if (paidEl) {
        paidEl.value = parseFloat(s.paid_amount) || 0;
        paidEl.disabled = true;
        paidEl.title = 'Pembayaran dicatat lewat tombol Catat Pembayaran';
        paidEl.style.background = 'var(--cream-dark)';
      }
      $('itemsContainer').innerHTML = '';
      let itemList = (s.items || []).length ? s.items : (s.itemsMaster || []);
      // Pengaman: kalau rincian induk tidak terbaca, item dicari dari nama paketnya
      if (s.is_package && !itemList.length) {
        const pkgName = String(s.package_name || '');
        const cocok = (S.data.treatments || []).find(t => (String(t.category || '') + ' - ' + String(t.name || '')) === pkgName);
        if (cocok) itemList = [{ treatment_id: cocok.id, qty: 1, price: cocok.price, treatment_name: pkgName }];
      }
      itemList.forEach(it => addItemRow(it.treatment_id, it.qty, it.price, it.treatment_name));
      if (!itemList.length) addItemRow();
      // Transport dianggap otomatis bila nilainya sama dengan hitungan KM
      const autoEl = $('fTransportAuto');
      if (autoEl) autoEl.checked = hitungTransport(s.km) === (parseFloat(s.transport_fee) || 0);
      // ── Kunjungan paket: uang dikunci di invoice induk, form hanya untuk jadwal ──
      if (s.is_package) lockMoneyFieldsForPackage(s);
      calcSummary();
      updateTransportHint();
    }

    // Sembunyikan isian uang saat mengubah kunjungan paket. Backend memang mengabaikan
    // nilai uang untuk baris paket, jadi yang bisa diubah hanya jadwal dan catatan.
    function lockMoneyFieldsForPackage(s) {
      const sembunyi = id => { const el = $(id); if (el) el.style.display = 'none'; };
      sembunyi('secTreatment');
      sembunyi('fgKm');
      sembunyi('rowMoney');
      sembunyi('summaryBox');
      sembunyi('fgStatusPreview');
      const note = $('pkgEditNote');
      if (note) {
        const inv = String(s.master_invoice_no || s.invoice_no || '');
        note.style.display = '';
        note.innerHTML = `<i class="fa fa-lock"></i> Nilai paket dihitung sekali di invoice induk${inv ? ' (<strong>' + sanitize(inv) + '</strong>)' : ''}, di sini hanya tanggal, jam, lokasi, Maps dan catatan.`;
      }
      // Metode bayar & status juga bagian dari uang paket
      const meth = $('fMethod');
      if (meth) meth.disabled = true;
      const paidEl = $('fPaid');
      if (paidEl) paidEl.disabled = true;
      // Isian yang tersembunyi tetap terkirim apa adanya (items, KM, transport, diskon)
      ['fKm', 'fTransport', 'fDiscount'].forEach(id => { const el = $(id); if (el) el.disabled = true; });
    }

    function itemTrSelect(sel, id) {
      const opt = sel.options[sel.selectedIndex];
      const price = parseFloat(opt.dataset.price) || 0;
      $(id + '_price').value = price;
      sel.dataset.trId = sel.value;
      sel.dataset.trName = opt.text;
      calcItemRow(id); calcSummary(); updateNbWarn();
    }

    function calcItemRow(id) {
      const price = parseFloat($(id + '_price').value) || 0;
      const qty = parseInt($(id + '_qty').value) || 1;
      // find/create subtotal display
      let st = document.querySelector('#' + id + ' .item-total');
      if (!st) { st = document.createElement('div'); st.className = 'item-total'; document.getElementById(id).appendChild(st); }
      st.textContent = fmtRp(price * qty);
    }

    // ─── TRANSPORT: hitung otomatis, tetap bisa diubah manual ───
    function updateTransportHint() {
      const el = $('fTransportHint');
      if (!el) return;
      const auto = !$('fTransportAuto') || $('fTransportAuto').checked;
      el.innerHTML = `≤ 5 km gratis · 6 km = ${fmtRp(6 * tarifTransport())} · ` + (auto
        ? '<span style="color:var(--sage-dark);font-weight:700">Hitung otomatis</span>'
        : '<span style="color:var(--warning);font-weight:700">Ubah manual</span>');
    }

    function calcTransport() {
      const kmEl = $('fKm'), trEl = $('fTransport');
      const auto = !$('fTransportAuto') || $('fTransportAuto').checked;
      if (kmEl && trEl && auto) trEl.value = hitungTransport(kmEl.value);
      updateTransportHint();
      calcSummary();
    }

    // Pengguna mengetik nominal transport sendiri → mode otomatis dimatikan
    function onTransportInput() {
      const autoEl = $('fTransportAuto');
      if (autoEl && autoEl.checked) autoEl.checked = false;
      updateTransportHint();
      calcSummary();
    }

    function toggleTransportAuto() {
      const autoEl = $('fTransportAuto');
      if (autoEl && autoEl.checked) calcTransport();
      else { updateTransportHint(); calcSummary(); }
    }

    // Isi cepat nominal DP: chip 20%, 50%, Lunas pada isian Dibayar
    function setPaidPct(pct) {
      const el = $('fPaid');
      if (!el || el.disabled) return;
      let fee = 0;
      document.querySelectorAll('.item-row').forEach(row => {
        const priceEl = row.querySelector('input[type=number]');
        const qtyEl = row.querySelectorAll('input[type=number]')[1];
        if (priceEl && qtyEl) fee += (parseFloat(priceEl.value) || 0) * (parseInt(qtyEl.value) || 1);
      });
      const transport = parseFloat($('fTransport').value) || 0;
      const discount = parseFloat($('fDiscount').value) || 0;
      const total = Math.max(0, fee + transport - discount);
      // Lunas = total penuh, chip persen dibulatkan ke rupiah terdekat
      el.value = pct >= 100 ? total : Math.round(total * pct / 100);
      calcSummary();
    }

    function calcSummary() {
      let fee = 0;
      document.querySelectorAll('.item-row').forEach(row => {
        const priceEl = row.querySelector('input[type=number]');
        const qtyEl = row.querySelectorAll('input[type=number]')[1];
        if (priceEl && qtyEl) fee += (parseFloat(priceEl.value) || 0) * (parseInt(qtyEl.value) || 1);
      });
      const transport = parseFloat($('fTransport').value) || 0;
      const discount = parseFloat($('fDiscount').value) || 0;
      const paid = parseFloat($('fPaid').value) || 0;
      const subtotal = fee + transport;
      const total = Math.max(0, subtotal - discount);
      const due = Math.max(0, total - paid);
      $('sumFee').textContent = fmtRp(fee);
      $('sumTransport').textContent = fmtRp(transport);
      $('sumSubtotal').textContent = fmtRp(subtotal);
      $('sumDiscount').textContent = fmtRp(discount);
      $('sumTotal').textContent = fmtRp(total);
      $('sumDue').textContent = fmtRp(due);
      // Pratinjau status pembayaran (sama dengan aturan backend)
      const preview = $('fKetPreview');
      if (preview) {
        const method = $('fMethod')?.value || 'TF/QRIS';
        let ket;
        if (due <= 0) ket = 'LUNAS ' + (method === 'Cash' ? 'CASH' : 'TF/QRIS');
        else if (paid > 0) ket = 'DP';
        else ket = 'BELUM BAYAR';
        preview.value = ket;
      }
    }

    function saveSchedule() {
      const editId = S.editingScheduleId || null;
      const items = [];
      document.querySelectorAll('.item-row').forEach(row => {
        const sel = row.querySelector('select');
        const inputs = row.querySelectorAll('input[type=number]');
        const price = parseFloat(inputs[0]?.value) || 0;
        const qty = parseInt(inputs[1]?.value) || 1;
        if (sel && sel.value) items.push({ treatment_id: sel.value, treatment_name: sel.options[sel.selectedIndex].text, price, qty, subtotal: price * qty });
      });
      if (!$('fDate').value) { toast('Tanggal wajib diisi', 'warning'); return; }
      if (!items.length) { toast('Tambahkan minimal satu treatment', 'warning'); return; }
      // Tidak boleh ada Date/undefined yang dikirim ke server: string kosong untuk isian kosong
      const formData = {
        customer_id: $('fCust').value || '', therapist_id: $('fTherapist').value || '',
        schedule_date: $('fDate').value, schedule_time: $('fTime').value || '',
        location: $('fLoc').value || '', maps_link: $('fMaps') ? ($('fMaps').value || '').trim() : '',
        km: parseFloat($('fKm').value) || 0,
        transport_fee: parseFloat($('fTransport').value) || 0,
        discount: parseFloat($('fDiscount').value) || 0,
        payment_method: $('fMethod').value,
        notes: $('fNotes').value || ''
      };
      if (editId) {
        loading(true, 'Menyimpan perubahan...');
        // Harga dihitung ulang di server, cukup kirim id treatment + qty
        const payload = {};
        Object.keys(formData).forEach(k => { payload[k] = formData[k]; });
        payload.items = items.map(i => ({ treatment_id: i.treatment_id, qty: i.qty }));
        const invoiceOpen = !!$('invoice-template') && String(S.openInvoiceId || '') === String(editId);
        ga('updateSchedule', [S.user.id, S.user.role, editId, payload], res => {
          loading(false);
          if (!res.success) { toast(res.message, 'error'); return; }
          toast(res.message || 'Jadwal berhasil diperbarui', 'success');
          closeModal();
          refreshListAfterScheduleChange();
          if (invoiceOpen) setTimeout(() => printInvoiceById(editId), 300);
        });
        return;
      }
      formData.items = items;
      formData.paid_amount = parseFloat($('fPaid').value) || 0;
      // addSchedule hanya membalas id, jadi keputusan invoice diambil dari isian form
      const feeForm = items.reduce((a, it) => a + (parseFloat(it.subtotal) || 0), 0);
      const totalForm = Math.max(0, feeForm + (parseFloat(formData.transport_fee) || 0) - (parseFloat(formData.discount) || 0));
      const openDpInv = formData.paid_amount > 0 && formData.paid_amount < totalForm;
      const scData = formData;
      loading(true, 'Menyimpan jadwal...');
      ga('addSchedule', [scData, S.user.id, S.user.role], res => {
        loading(false);
        if (res.success) {
          toast('Jadwal berhasil disimpan!', 'success'); closeModal(); loadSchedules();
          if (res.data) setTimeout(() => openDpInv ? printDpInvoiceById(res.data.id) : printInvoiceById(res.data.id), 400);
        }
        else toast(res.message, 'error');
      });
    }

    // Segarkan daftar yang sedang dibuka setelah jadwal berubah
    function refreshListAfterScheduleChange() {
      if (S.page === 'jadwal') loadSchedules();
      else if (S.page === 'pelanggan') renderPelanggan();
      else if (S.page === 'invoice') renderInvoice();
      else if (S.page === 'pembayaran') loadPayments();
      else if (S.page === 'dashboard') renderDashboard();
      else if (S.page === 'laporan') loadReport();
    }

    // ═══════════════════════════════════════════════════════════════
    //  PAKET NB (satu invoice untuk banyak kunjungan)
    // ═══════════════════════════════════════════════════════════════
    // Aturan sama dengan backend (parsePackageTreatment): jumlah hari diambil dari
    // angka pertama pada nama treatment, kunjungan per hari dari "2x" pada kategori.
    function parsePackageTreatment(name, cat) {
      const c = String(cat || '').toLowerCase().replace(/\s+/g, '');
      const visitsPerDay = c.indexOf('2x') !== -1 ? 2 : 1;
      const m = String(name || '').match(/\d+/);
      let days = m ? parseInt(m[0], 10) : 1;
      if (!isFinite(days) || days < 1) days = 1;
      if (days > 60) days = 60;
      return { days: days, visitsPerDay: visitsPerDay };
    }

    let pkgManualDp = false;

    function openPackageModal() {

    // Paket yang sedang dipilih di modal (harga selalu dari sheet Treatments)
    function pkgCurrent() {
      const sel = $('pTrt');
      if (!sel) return null;
      const opt = sel.options[sel.selectedIndex];
      if (!opt || !sel.value) return null;
      const name = opt.getAttribute('data-name') || '';
      const cat = opt.getAttribute('data-cat') || '';
      const pk = parsePackageTreatment(name, cat);
      return {
        id: sel.value, name: name, cat: cat,
        price: parseFloat(opt.getAttribute('data-price')) || 0,
        days: pk.days, visitsPerDay: pk.visitsPerDay, visits: pk.days * pk.visitsPerDay
      };
    }

    // Paket 1x hanya butuh satu jam, paket 2x butuh jam kedua
    function pkgOnPackageChange() {
      const pk = pkgCurrent();
      const wrap = $('pTime2Wrap');
      if (wrap) wrap.style.display = (pk && pk.visitsPerDay === 2) ? '' : 'none';
      pkgCalcSummary();
    }

    function pkgUpdateHint() {
      const el = $('pTransportHint');
      if (!el) return;
      const auto = !$('pTransportAuto') || $('pTransportAuto').checked;
      el.innerHTML = `≤ 5 km gratis · 6 km = ${fmtRp(6 * tarifTransport())} · ` + (auto
        ? '<span style="color:var(--sage-dark);font-weight:700">Hitung otomatis</span>'
        : '<span style="color:var(--warning);font-weight:700">Ubah manual</span>');
    }

    function pkgCalcTransport() {
      const kmEl = $('pKm'), trEl = $('pTransport');
      const auto = !$('pTransportAuto') || $('pTransportAuto').checked;
      if (kmEl && trEl && auto) trEl.value = hitungTransport(kmEl.value);
      pkgUpdateHint();
      pkgCalcSummary();
    }

    function pkgOnTransportInput() {
      const autoEl = $('pTransportAuto');
      if (autoEl && autoEl.checked) autoEl.checked = false;
      pkgUpdateHint();
      pkgCalcSummary();
    }

    function pkgToggleTransportAuto() {
      const autoEl = $('pTransportAuto');
      if (autoEl && autoEl.checked) pkgCalcTransport();
      else { pkgUpdateHint(); pkgCalcSummary(); }
    }

    // Persen DP diubah → nominal kembali otomatis
    function pkgOnPctInput() {
      pkgManualDp = false;
      pkgCalcSummary();
    }

    // Nominal DP diketik → pakai nominal itu (manual)
    function pkgOnDpAmtInput() {
      pkgManualDp = true;
      pkgCalcSummary();
    }

    function pkgCalcSummary() {
      const pk = pkgCurrent();
      if (!pk) return;
      const perVisit = parseFloat($('pTransport').value) || 0;
      const transport = perVisit * pk.visits;
      const disc = parseFloat($('pDiscount').value) || 0;
      const subtotal = pk.price + transport;
      const total = Math.max(0, subtotal - disc);
      const pct = Math.min(100, Math.max(0, parseFloat($('pDpPct').value) || 0));
      const auto = Math.round(total * pct / 100);
      const amtRaw = parseFloat($('pDpAmt').value) || 0;
      // Sama seperti backend: nominal tegas menang, kalau kosong/nol pakai persen
      const dp = (pkgManualDp && amtRaw > 0) ? Math.min(total, Math.max(0, amtRaw)) : auto;
      const due = Math.max(0, total - dp);
      if (!pkgManualDp) $('pDpAmt').value = auto;
      if ($('pkgVisits')) $('pkgVisits').textContent = `${pk.visits} (${pk.days} hari × ${pk.visitsPerDay} kunjungan)`;
      if ($('pkgFee')) $('pkgFee').textContent = fmtRp(pk.price);
      if ($('pkgTransportLbl')) $('pkgTransportLbl').textContent = `Transport (${pk.visits} × ${fmtRp(perVisit)})`;
      if ($('pkgTransport')) $('pkgTransport').textContent = fmtRp(transport);
      if ($('pkgDiscount')) $('pkgDiscount').textContent = fmtRp(disc);
      if ($('pkgTotal')) $('pkgTotal').textContent = fmtRp(total);
      if ($('pkgDpLbl')) $('pkgDpLbl').textContent = (pkgManualDp && amtRaw > 0) ? 'DP' : `DP (${pct}%)`;
      if ($('pkgDp')) $('pkgDp').textContent = fmtRp(dp);
      if ($('pkgDue')) $('pkgDue').textContent = fmtRp(due);
    }

    function saveSchedulePackage() {
      const pk = pkgCurrent();
      if (!$('pCust') || !$('pCust').value) { toast('Pelanggan wajib dipilih untuk paket NB', 'warning'); return; }
      if (!pk) { toast('Paket NB wajib dipilih', 'warning'); return; }
      const start = $('pStart').value || '';
      const t1 = $('pTime1').value || '';
      const t2 = pk.visitsPerDay === 2 ? ($('pTime2').value || '') : '';
      if (!start) { toast('Tanggal mulai wajib diisi', 'warning'); return; }
      if (!t1) { toast('Jam kunjungan wajib diisi', 'warning'); return; }
      if (pk.visitsPerDay === 2 && !t2) { toast('Jam kunjungan kedua wajib diisi untuk paket 2x', 'warning'); return; }
      // Tidak boleh ada undefined / Date yang dikirim: angka 0 dan teks kosong
      const payload = {
        customer_id: $('pCust').value,
        therapist_id: $('pTherapist').value || '',
        treatment_id: pk.id,
        start_date: start,
        time1: t1,
        time2: t2,
        location: $('pLoc').value || '',
        maps_link: ($('pMaps').value || '').trim(),
        km: parseFloat($('pKm').value) || 0,
        transport_fee: parseFloat($('pTransport').value) || 0,
        dp_percent: parseFloat($('pDpPct').value) || 0,
        dp_amount: parseFloat($('pDpAmt').value) || 0,
        discount: parseFloat($('pDiscount').value) || 0,
        notes: $('pNotes').value || '',
        payment_method: $('pMethod').value
      };
      loading(true, 'Menyimpan paket...');
      ga('createSchedulePackage', [payload, S.user.id, S.user.role], res => {
        loading(false);
        if (!res.success) { toast(res.message, 'error'); return; }
        toast(res.message || 'Paket berhasil dibuat', 'success');
        closeModal();
        loadSchedules();
        // Ada DP → buka invoice DP induk, tanpa DP → invoice paket seperti biasa
        if (res.data && res.data.master_id) {
          const dpNominal = parseFloat(res.data.dp) || 0;
          if (dpNominal > 0) setTimeout(() => printDpInvoiceById(res.data.master_id), 400);
          else setTimeout(() => printInvoiceById(res.data.master_id), 400);
        }
      });
    }

      <div class="modal-header"><h3><i class="fa fa-money-bill"></i> Catat Pembayaran</h3><button class="modal-close" onclick="closeModal()"><i class="fa fa-xmark"></i></button></div>
      <div class="modal-body">
        <div style="background:var(--cream);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:16px;font-size:13px">
          Invoice: <strong>${sanitize(invNo)}</strong> · Sisa: <strong style="color:var(--danger)">${fmtRp(due)}</strong>
        </div>

          <div class="fg"><label>Jumlah Bayar (Rp) *</label><input type="number" id="payAmt" value="${due}" min="1" step="1000"></div>
          <div class="fg"><label>Metode</label><select id="payMethod"><option>TF/QRIS</option><option>Cash</option><option>Transfer</option></select></div>
        </div>
        <div class="form-row cols-2">
          <div class="fg"><label>Tanggal</label><input type="date" id="payDate" value="${today()}"></div>

    function savePayment(schedId, custId) {
      const amt = parseFloat($('payAmt').value) || 0;
      if (amt <= 0) { toast('Jumlah pembayaran harus > 0', 'warning'); return; }
      const payData = { schedule_id: schedId, customer_id: custId || null, amount: amt, method: $('payMethod').value, reference_no: $('payRef').value, payment_date: $('payDate').value, notes: $('payNotes').value };
      loading(true, 'Menyimpan pembayaran...');
      ga('addSchedulePayment', [payData, S.user.id, S.user.role], res => {
        loading(false);
        if (res.success) { toast('Pembayaran berhasil dicatat!', 'success'); closeModal(); loadSchedules(); }
        else toast(res.message, 'error');
      });
    }

    function deleteSchedule(id) {
      confirm('Hapus Jadwal?', 'Jadwal dan semua data terkait akan dihapus permanen.', 'danger', () => {
        loading(true, 'Menghapus...');
        ga('deleteSchedule', [id, S.user.id, S.user.role], res => {
          loading(false);
          if (res.success) { toast('Jadwal berhasil dihapus', 'success'); loadSchedules(); }
          else toast(res.message, 'error');
        });
      });
    }

        loading(true, 'Mengubah status...');

          loading(false);
          if (res.success) { toast('Status jadwal diperbarui', 'success'); closeModal(); loadSchedules(); }
          else toast(res.message, 'error');

      if (isWriter()) {
        $('topbarAction').style.display = 'flex';

      } else {
        $('topbarAction').style.display = 'none';
      }
      $('pageContent').innerHTML = `
  <div class="filter-bar">
    <div class="fg"><label>Cari</label><input type="text" id="custSearch" placeholder="Nama atau nomor HP..." oninput="filterCustomers()"></div>
  </div>
  <div id="custGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px"></div>`;
      loading(true, 'Memuat pelanggan...');
      ga('getCustomers', [S.user.id, S.user.role], res => {
        loading(false);
        if (!res.success) { toast(res.message, 'error'); return; }
        S.data.customers = res.data;
        filterCustomers();
      });
    }

    function filterCustomers() {
      const q = String(($('custSearch') && $('custSearch').value) || '').toLowerCase();
      const qDigits = q.replace(/\D/g, '');
      const filtered = (S.data.customers || []).filter(c => {
        if (!q) return true;
        const name = String(c.name || '').toLowerCase();
        const phone = String(c.phone || '');
        const baby = String(c.baby_name || '').toLowerCase();
        if (name.indexOf(q) !== -1 || phone.indexOf(q) !== -1 || baby.indexOf(q) !== -1) return true;
        // Nomor HP dicari tanpa tanda hubung juga (mis. 081234567890)
        return !!qDigits && phone.replace(/\D/g, '').indexOf(qDigits) !== -1;
      });
      $('custGrid').innerHTML = filtered.length ? filtered.map(c => `
  <div class="cust-card" onclick="viewCustomer(${c.id})">
    <div class="cust-avatar">${sanitize(String(c.name || '?').charAt(0).toUpperCase())}</div>

      <div class="cust-name">${sanitize(c.name)}</div>

    // ═══════════════════════════════════════════════════════════════
    //  PRICELIST
    // ═══════════════════════════════════════════════════════════════
    // Urutan kategori baku + kategori lain yang ada di data (alfabetis)
    const KATEGORI_BAKU = ['Baby', 'Kids', 'Mom', 'Jaga', 'NB 1x', 'NB 2x', 'Selapan'];
    function urutanKategori() {
      const list = KATEGORI_BAKU.slice();
      const lain = [];
      (S.data.treatments || []).forEach(t => {
        const c = String(t.category || '').trim();
        if (c && list.indexOf(c) === -1 && lain.indexOf(c) === -1) lain.push(c);
      });
      lain.sort((a, b) => a.localeCompare(b));
      return list.concat(lain);
    }

    function renderPricelist() {
      if (isAdmin()) { $('topbarAction').style.display = 'flex'; $('topbarActionLabel').textContent = 'Tambah Treatment'; }
      else { $('topbarAction').style.display = 'none'; }
      $('pageContent').innerHTML = '<div id="pricelistContent"><div class="table-empty"><i class="fa fa-spinner fa-spin"></i> Memuat...</div></div>';
      ga('getTreatments', [S.user.id, S.user.role], res => {
        if (!res.success) { toast(res.message, 'error'); return; }
        S.data.treatments = res.data;
        const cats = {};
        res.data.forEach(t => { if (!cats[t.category]) cats[t.category] = []; cats[t.category].push(t); });
        const catOrder = urutanKategori();
        const sortedCats = [...catOrder, ...Object.keys(cats).filter(c => catOrder.indexOf(c) === -1)].filter(c => cats[c]);
        $('pricelistContent').innerHTML = `
    <div class="pl-entry"><button class="btn btn-primary pl-entry-btn" onclick="openPricelistModal()"><i class="fa fa-image"></i> Buat Gambar Pricelist</button></div>` + sortedCats.map(cat => `
    <div class="price-category">
      <div class="price-cat-title"><span><i class="fa fa-spa"></i> ${sanitize(cat)}</span><span style="font-size:13px;color:var(--text-muted);font-weight:400">${cats[cat].length} treatment</span></div>
      ${cats[cat].map(t => `
      <div class="price-item">
        <div>
          <div class="price-item-name">${sanitize(t.name)}</div>
          ${t.description ? `<div class="price-item-desc">${sanitize(t.description)}</div>` : ''}
        </div>
        <div class="price-item-right">
          <span class="price-item-dur"><i class="fa fa-clock"></i> ${t.duration_min} mnt</span>
          <span class="price-item-amt">${fmtRp(t.price)}</span>
          ${isAdmin() ? `<button class="btn btn-sm btn-outline" onclick="openTreatmentModalById(${t.id})"><i class="fa fa-edit"></i></button><button class="btn btn-sm btn-danger" onclick="deleteTreatment(${t.id})"><i class="fa fa-trash"></i></button>` : ''}
        </div>
      </div>`).join('')}
    </div>`).join('');
      });
    }

    // ═══════════════════════════════════════════════════════════════
    //  PEMBUAT GAMBAR PRICELIST (1080 × 1350, 4:5)
    // ═══════════════════════════════════════════════════════════════
    const PL_W = 1080;
    const PL_H = 1350;
    const PL_BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const plBulanTahun = d => { const x = d || new Date(); return PL_BULAN[x.getMonth()] + ' ' + x.getFullYear(); };
    const plSubJudul = () => 'Daftar harga · ' + plBulanTahun();
    const PL_CATATAN = 'Transport gratis untuk jarak ≤ 5 km · Surabaya & sekitarnya';

    // Kontak diambil dari Pengaturan, dengan nilai cadangan yang wajar
    const plKontak = () => ({
      phone: (S.settings && S.settings.business_phone) || '0822-3212-1081',
      instagram: (S.settings && S.settings.business_instagram) || '@daisafacare',
      address: (S.settings && S.settings.business_address) || 'Surabaya'
    });

    // Status isian modal (tema & halaman aktif). Slide dihitung ulang tiap isian berubah.
    let PL = { theme: 'cream', page: 1, slides: [], opts: null };

    // Data pricelist: hanya treatment aktif, dikelompokkan per kategori sesuai urutanBaku
    function pricelistData() {
      const aktif = (S.data.treatments || []).filter(t => isActiveVal(t.is_active));
      const urut = urutanKategori();
      const peta = {};
      aktif.forEach(t => {
        const c = String(t.category || '').trim() || 'Lainnya';
        if (!peta[c]) peta[c] = [];
        peta[c].push(t);
      });
      const hasil = urut.filter(c => peta[c]);
      Object.keys(peta).forEach(c => { if (hasil.indexOf(c) === -1) hasil.push(c); });
      return hasil.map(c => ({ category: c, items: peta[c] }));
    }

    // Semua pilihan modal dibaca sekali di sini. Tanpa modal (mis. saat ekspor) dipakai nilai bawaan.
    function pricelistOpts() {
      const k = plKontak();
      const nilai = (id, cadangan) => { const el = $(id); const v = el ? String(el.value).trim() : ''; return v || cadangan; };
      const cek = (id, cadangan) => { const el = $(id); return el ? !!el.checked : cadangan; };
      const cats = [];
      const box = $('plCats');
      if (box) {
        const inputs = box.querySelectorAll('input[type="checkbox"]');
        for (let i = 0; i < inputs.length; i++) { if (inputs[i].checked) cats.push(inputs[i].value); }
      }
      return {
        title: nilai('plTitle', 'Pricelist'),
        subtitle: nilai('plSubtitle', plSubJudul()),
        theme: PL.theme === 'sage' ? 'sage' : 'cream',
        cats: cats,
        showDur: cek('plTogDur', true),
        showContact: cek('plTogKontak', true),
        showNote: cek('plTogNote', true),
        showDesc: cek('plTogDesc', false),
        note: nilai('plNote', PL_CATATAN),
        phone: k.phone,
        instagram: k.instagram,
        address: k.address
      };
    }

    // ─── Potongan markup slide (dipakai ulang oleh pengukur & pratinjau) ───
    function plCatHeadHtml(cat) {
      return `<div class="pls-cat-head"><span class="pls-dot"></span><span class="pls-cat-name">${sanitize(cat)}</span><span class="pls-cat-line"></span></div>`;
    }

    // Durasi di slide: ≥ 2 jam yang bulat ditulis "6 jam", sisanya tetap "{n} mnt".
    // 0 menit tidak pernah ditampilkan. Data asli (duration_min) tidak diubah.
    function plDurasiTeks(menit) {
      const n = parseInt(menit, 10) || 0;
      if (n <= 0) return '';
      if (n >= 120 && n % 60 === 0) return (n / 60) + ' jam';
      return n + ' mnt';
    }

    // Nama item yang sudah menyebut durasinya (mis. "6 Jam" + "6 jam") tidak perlu chip durasi lagi.
    function plDurasiDuplikat(nama, dteks) {
      if (!dteks) return false;
      const rapi = s => String(s || '').toLowerCase().replace(/\s+/g, '');
      const namaRapi = rapi(nama);
      const teks = rapi(dteks);
      if (!namaRapi || !teks) return false;
      const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      if (new RegExp('(^|[^0-9])' + esc(teks)).test(namaRapi)) return true;
      const angka = teks.match(/^(\d+)/);
      if (!angka) return false;
      return new RegExp('(^|[^0-9])' + angka[1] + '(jam|hari|menit)').test(namaRapi);
    }

    function plItemHtml(t, opts) {
      let dteks = opts.showDur ? plDurasiTeks(t.duration_min) : '';
      if (dteks && plDurasiDuplikat(t.name, dteks)) dteks = '';
      const dur = dteks ? `<span class="pls-dur">${sanitize(dteks)}</span>` : '';
      const desc = (opts.showDesc && t.description) ? `<div class="pls-desc">${sanitize(t.description)}</div>` : '';
      return `<div class="pls-it"><div class="pls-item"><span class="pls-nm">${sanitize(t.name)}</span>${dur}<span class="pls-lead"></span><span class="pls-amt">${fmtRp(t.price)}</span></div>${desc}</div>`;
    }

    // Satu slide 1080 × 1350. Murni: hanya menerima data dan mengembalikan markup.
    function priceSlideHtml(desc, opts, pageInfo) {
      const info = pageInfo || { page: 1, total: 1 };
      const total = Math.max(1, parseInt(info.total, 10) || 1);
      const page = Math.min(total, Math.max(1, parseInt(info.page, 10) || 1));
      const last = page >= total;
      const o = opts || {};
      const tema = o.theme === 'sage' ? 'sage' : 'cream';
      const src = (S.brand && S.brand.logo) || logoUrl();
      const logo = src ? `<img class="pls-logo" src="${src}" alt="Logo Daisafacare" crossorigin="anonymous" loading="eager" decoding="sync">` : '';
      const logoBox = tema === 'sage' ? `<span class="pls-logo-tile">${logo}</span>` : logo;
      const groups = (desc && desc.groups) || [];

      const isi = groups.map(g => `<div class="pls-cat">${plCatHeadHtml(g.category)}${(g.items || []).map(t => plItemHtml(t, o)).join('')}</div>`).join('');

      let kaki = '';
      if (last) {
        const kartu = o.showContact ? `<div class="pls-card">
          <div class="pls-card-l"><div class="pls-card-label">Booking &amp; info</div><div class="pls-card-phone"><i class="fab fa-whatsapp"></i>${sanitize(o.phone)}</div></div>
          <div class="pls-card-r"><div class="pls-card-ig">${sanitize(o.instagram)}</div>${o.address ? `<div class="pls-card-addr">${sanitize(o.address)}</div>` : ''}</div>
        </div>` : '';
        const catatan = (o.showNote && o.note) ? `<div class="pls-note">${sanitize(o.note)}</div>` : '';
        kaki = kartu + catatan;
      } else {
        const baris = o.showContact ? `${sanitize(o.phone)} · ${sanitize(o.instagram)} · lanjutan` : 'lanjutan';
        kaki = `<div class="pls-endline">${baris}</div>`;
      }
      const nomor = total > 1 ? `<div class="pls-page">${page}/${total}</div>` : '';

      return `<div class="pls-slide pls-${tema}">
        <div class="pls-motif"><span class="pls-dot-a"></span><span class="pls-dot-b"></span><span class="pls-dot-c"></span></div>
        <div class="pls-head">
          <div class="pls-brand">${logoBox}<div class="pls-brand-txt"><div class="pls-mark">DAISAFACARE</div><div class="pls-brand-sub">Mom &amp; Baby Treatment</div></div><div class="pls-city">SURABAYA</div></div>
          <div class="pls-hero">${sanitize(o.title || 'Pricelist')}</div>
          <div class="pls-rule"></div>
          <div class="pls-tagline">${sanitize(o.subtitle || '')}</div>
        </div>
        <div class="pls-body">${isi}</div>
        <div class="pls-foot">${kaki}${nomor}</div>
      </div>`;
    }

    // Halaman terakhir saja: kalau sisa ruang di bawah baris akhir masih > 120 px,
    // bagikan ruang itu ke sela antar kategori (maks +48 px per sela) supaya tidak
    // ada lubang kosong besar di atas kartu kontak. Satu kategori → ditengahkan.
    function plSeimbangkan(el) {
      if (!el) return;
      const body = el.querySelector('.pls-body');
      if (!body) return;
      const cats = body.querySelectorAll('.pls-cat');
      if (!cats.length) return;
      // Jarak dari tepi atas .pls-body ke sebuah simpul (offsetTop relatif ke offsetParent-nya)
      const posY = node => { let y = 0, n = node; while (n && n !== body) { y += n.offsetTop; n = n.offsetParent; } return y; };
      const akhir = cats[cats.length - 1];
      const bawah = parseFloat(getComputedStyle(body).paddingBottom) || 0;
      const bebas = body.clientHeight - (posY(akhir) + akhir.offsetHeight) - bawah;
      if (bebas <= 120) return;
      if (cats.length === 1) {
        cats[0].style.marginTop = Math.floor(bebas / 2) + 'px';
        return;
      }
      const sela = cats.length - 1;
      const tambah = Math.min(48, Math.floor(bebas / sela));
      if (tambah < 1) return;
      for (let i = 1; i < cats.length; i++) cats[i].style.paddingTop = (30 + tambah) + 'px';
    }

    // Wadah tak terlihat berisi slide ukur 1080 px (di luar layar)
    function plStaging() {
      let el = $('plStage');
      if (!el) {
        el = document.createElement('div');
        el.id = 'plStage';
        el.className = 'pl-stage';
        document.body.appendChild(el);
      }
      return el;
    }

    // Bagi item ke beberapa slide dengan mengukur tinggi isi sungguhan, bukan menebak.
    // footerAkhir = true → slide ukur memakai kartu kontak (footer halaman terakhir).
    function plMeasure(groups, opts, footerAkhir) {
      const out = [];
      const stage = plStaging();
      stage.innerHTML = priceSlideHtml({ groups: [] }, opts, footerAkhir ? { page: 2, total: 2 } : { page: 1, total: 2 });
      const body = stage.querySelector('.pls-body');
      if (!body) { stage.innerHTML = ''; return [{ groups: (groups || []).slice() }]; }
      const luber = () => body.scrollHeight > body.clientHeight + 1;

      let cur = { groups: [] };
      const tutupSlide = () => { out.push(cur); cur = { groups: [] }; };

      (groups || []).forEach(g => {
        let i = 0;
        while (i < g.items.length) {
          const catEl = document.createElement('div');
          catEl.className = 'pls-cat';
          catEl.innerHTML = plCatHeadHtml(g.category);
          body.appendChild(catEl);
          if (luber() && cur.groups.length) {
            // judul kategori tidak muat lagi → pindah slide, ulangi kategori ini
            body.removeChild(catEl);
            tutupSlide();
            body.innerHTML = '';
            continue;
          }
          const sec = { category: g.category, items: [] };
          cur.groups.push(sec);

          let taruh = 0;
          let ulangi = false;
          while (i < g.items.length) {
            const bungkus = document.createElement('div');
            bungkus.innerHTML = plItemHtml(g.items[i], opts);
            const node = bungkus.firstElementChild;
            catEl.appendChild(node);
            if (luber()) {
              catEl.removeChild(node);
              if (taruh > 0) break;                        // lanjut di slide berikutnya
              if (cur.groups.length > 1) {                 // slide sudah berisi kategori lain
                cur.groups.pop();
                body.removeChild(catEl);
                tutupSlide();
                body.innerHTML = '';
                ulangi = true;
                break;
              }
              // slide kosong: item tinggi tetap ditampilkan sendiri (tidak boleh berulang tanpa henti)
              catEl.appendChild(node);
            }
            sec.items.push(g.items[i]);
            i++;
            taruh++;
          }
          if (ulangi) continue;
          // kategori habis? lanjut ke kategori berikutnya di slide yang sama.
          if (i < g.items.length) { tutupSlide(); body.innerHTML = ''; }
        }
      });
      if (cur.groups.length) out.push(cur);
      stage.innerHTML = '';
      return out.length ? out : [{ groups: [] }];
    }

    // Halaman terakhir memakai kartu kontak yang lebih tinggi, jadi isinya dicek ulang.
    function plRapikan(groups, opts, dalam) {
      const slides = plMeasure(groups, opts, false);
      if (slides.length <= 1) return plMeasure(groups, opts, true);
      const ekor = slides.pop();
      if ((dalam || 0) > 8) return slides.concat([ekor]);
      return slides.concat(plRapikan(ekor.groups, opts, (dalam || 0) + 1));
    }

    function paginatePricelist(groups, opts) {
      if (!groups || !groups.length) return [{ groups: [] }];
      return plRapikan(groups, opts);
    }

    // ─── Pratinjau di dalam modal ───
    function plFitPreview() {
      const frame = $('plFrame');
      if (!frame) return;
      const slide = frame.querySelector('.pls-slide');
      if (!slide) return;
      const lebar = frame.clientWidth || 0;
      if (!lebar) return;
      slide.style.transform = 'scale(' + (lebar / PL_W) + ')';

    function plUpdateNav() {
      const nav = $('plNav');
      if (!nav) return;
      const jumlah = (PL.slides || []).length;
      const banyak = jumlah > 1;
      nav.style.display = banyak ? 'flex' : 'none';
      $('plPrev').disabled = PL.page <= 1;
      $('plNext').disabled = PL.page >= jumlah;
      $('plCounter').textContent = PL.page + '/' + jumlah;
    }

    function plShowPage() {
      const frame = $('plFrame');
      if (!frame || !PL.slides.length) return;
      frame.innerHTML = priceSlideHtml(PL.slides[PL.page - 1], PL.opts, { page: PL.page, total: PL.slides.length });
      if (PL.page === PL.slides.length) plSeimbangkan(frame.querySelector('.pls-slide'));
      plFitPreview();
      plUpdateNav();
    }

    function plEmptyPreview() {
      const frame = $('plFrame');
      if (!frame) return;
      frame.innerHTML = '<div class="pl-empty" style="height:100%;display:flex;align-items:center;justify-content:center;box-sizing:border-box"><div><i class="fa fa-circle-info"></i>Pilih minimal satu kategori</div></div>';
      PL.slides = [];
      PL.page = 1;
      const nav = $('plNav');
      if (nav) nav.style.display = 'none';

    function renderPricelistPreview() {
      if (!$('plFrame')) return;

      const pakai = pricelistData().filter(g => opts.cats.indexOf(g.category) !== -1);
      if (!pakai.length) { plEmptyPreview(); return; }
      PL.slides = paginatePricelist(pakai, opts);
      if (PL.page > PL.slides.length) PL.page = PL.slides.length;
      if (PL.page < 1) PL.page = 1;
      plShowPage();
    }

    function plSetTheme(t) {
      PL.theme = t === 'sage' ? 'sage' : 'cream';
      if ($('plThemeCream')) $('plThemeCream').classList.toggle('on', PL.theme === 'cream');
      if ($('plThemeSage')) $('plThemeSage').classList.toggle('on', PL.theme === 'sage');
      renderPricelistPreview();
    }

    function plChip(input) {
      const label = input && input.closest ? input.closest('.pl-chk') : null;
      if (label) label.classList.toggle('on', !!input.checked);
      renderPricelistPreview();
    }

    function plGantiHalaman(d) {
      if (!PL.slides.length) return;
      const n = PL.page + (parseInt(d, 10) || 0);
      PL.page = Math.min(PL.slides.length, Math.max(1, n));
      plShowPage();
    }

    // ─── Caption WhatsApp ───
    function plCaptionText() {
      const opts = PL.opts || pricelistOpts();
      const pakai = pricelistData().filter(g => opts.cats.indexOf(g.category) !== -1);
      const baris = ['DAISAFACARE · Mom & Baby Treatment', opts.subtitle, ''];
      pakai.forEach(g => {
        baris.push('*' + String(g.category).toUpperCase() + '*');
        g.items.forEach(t => {
          baris.push('• ' + t.name + ' — ' + fmtRp(t.price) + ((opts.showDur && t.duration_min) ? ' (' + t.duration_min + ' mnt)' : ''));
        });
        baris.push('');
      });
      if (opts.showContact) {
        baris.push('Booking & info: ' + opts.phone);
        baris.push('Instagram: ' + opts.instagram);
      }
      if (opts.showNote && opts.note) baris.push(opts.note);
      return baris.join('\n').replace(/\n{3,}/g, '\n\n').trim();
    }

    function plCopyCaption() {
      const teks = plCaptionText();
      const beres = () => toast('Caption disalin', 'success');
      const gagal = () => toast('Gagal menyalin caption', 'error');
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(teks).then(beres).catch(gagal);
          return;
        }
      } catch (e) { }
      try {
        const ta = document.createElement('textarea');
        ta.value = teks;
        ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand('copy');
        ta.remove();
        if (ok) beres(); else gagal();
      } catch (e) { gagal(); }
    }

    // ─── Ekspor gambar (html2canvas, satu panggilan per slide) ───
    const plBgWarna = tema => (tema === 'sage' ? '#6F7D64' : '#FCF7F1');
    const plFileName = i => 'pricelist-daisafacare-' + (i + 1) + '.png';

    function plExportHost() {
      let el = $('plExHost');
      if (!el) {
        el = document.createElement('div');
        el.id = 'plExHost';
        el.className = 'pl-ex-host';
        document.body.appendChild(el);

      return el;

    function plSaveImages() {
      const slides = (PL.slides || []).slice();
      const opts = PL.opts || pricelistOpts();
      if (!slides.length) { toast('Pilih minimal satu kategori', 'warning'); return; }
      if (typeof html2canvas !== 'function') { toast('Gambar tidak bisa dibuat di perangkat ini', 'error'); return; }
      const btn = $('plBtnSave');
      if (btn) btn.disabled = true;
      const host = plExportHost();
      const hasil = [];
      const bersih = () => { host.innerHTML = ''; if (btn) btn.disabled = false; };
      const satu = i => {
        if (i >= slides.length) return Promise.resolve(hasil);
        toast('Membuat gambar ' + (i + 1) + '/' + slides.length + '...', 'info', 1600);
        host.innerHTML = priceSlideHtml(slides[i], opts, { page: i + 1, total: slides.length });
        const el = host.firstElementChild;
        if (i === slides.length - 1) plSeimbangkan(el);
        return waitInvImages(el).catch(() => false)
          .then(() => html2canvas(el, { scale: 2, backgroundColor: plBgWarna(opts.theme), useCORS: true, width: PL_W, height: PL_H, windowWidth: PL_W }))
          .then(canvas => { hasil.push({ canvas: canvas, fname: plFileName(i) }); return satu(i + 1); });
      };
      satu(0).then(() => { bersih(); plBagikanGambar(hasil); })
        .catch(() => { bersih(); toast('Gagal membuat gambar', 'error'); });
    }

    // iPhone: bagikan semua slide sekaligus. Perangkat lain: pratinjau + tautan unduh.
    function plBagikanGambar(list) {
      if (!list.length) { toast('Gagal membuat gambar', 'error'); return; }
      const blobs = [];
      let sisa = list.length;
      const lanjut = () => {
        const files = [];
        for (let i = 0; i < blobs.length; i++) {
          if (!blobs[i]) continue;
          try { files.push(new File([blobs[i]], list[i].fname, { type: 'image/png' })); } catch (e) { }
        }
        let bisa = false;
        try {
          bisa = files.length === list.length && !!navigator.canShare && navigator.canShare({ files: files });
        } catch (e) { bisa = false; }
        if (!bisa) { showPlImgPreview(list); return; }
        navigator.share({ files: files, title: 'Pricelist DaisafaCare' })
          .then(() => toast('Gambar pricelist siap', 'success'))
          .catch(() => showPlImgPreview(list));
      };
      const tanpaBlob = list.some(x => !x.canvas || typeof x.canvas.toBlob !== 'function');
      if (tanpaBlob) { showPlImgPreview(list); return; }
      list.forEach((x, i) => {
        x.canvas.toBlob(b => {
          blobs[i] = b;
          sisa--;
          if (sisa <= 0) lanjut();
        }, 'image/png');
      });
    }

          <a class="btn btn-beige" href="${url}" download="${x.fname}"><i class="fa fa-download"></i> ${label}</a>

      }).join('');
      ov.innerHTML = `<div style="color:#FCF7F1;font-weight:700;font-size:15px;text-align:center">Gambar Pricelist</div>
        <div style="color:#D4C2AA;font-size:12.5px;text-align:center;max-width:420px">Tekan lama gambar lalu pilih Simpan ke Foto, atau ketuk Unduh.</div>

      document.body.appendChild(ov);
    }

    // Tunggu semua <img> di dalam invoice selesai dimuat (atau gagal) sebelum digambar,
    // supaya logo / QRIS tidak kosong di hasil "Simpan Gambar".
    // Dibatasi ~2500 ms agar alamat gambar yang lambat atau rusak tidak menggantung tombol.
    function waitInvImages(tmpl) {
      const tunggu = new Promise(resolve => {
        try {
          const imgs = tmpl && tmpl.querySelectorAll ? Array.prototype.slice.call(tmpl.querySelectorAll('img')) : [];
          if (!imgs.length) { resolve(true); return; }
          let sisa = 0;
          const satuSelesai = () => { sisa--; if (sisa <= 0) resolve(true); };
          imgs.forEach(img => {
            if (!img || img.complete) return;
            sisa++;
            img.addEventListener('load', satuSelesai, { once: true });
            img.addEventListener('error', satuSelesai, { once: true });
          });
          if (sisa <= 0) resolve(true);
        } catch (e) { resolve(false); }
      });
      const batas = new Promise(resolve => setTimeout(() => resolve(false), 2500));
      return Promise.race([tunggu, batas]);
    }

    // Simpan gambar invoice. Di iPhone memakai menu bagikan bawaan (Simpan ke Foto / WhatsApp),
    // di perangkat lain menampilkan pratinjau gambar dengan tautan Unduh.
    function saveInvImg() {
      const tmpl = $('invoice-template');
      if (!tmpl) { toast('Invoice tidak ditemukan', 'warning'); return; }
      if (typeof html2canvas !== 'function') { toast('Gambar tidak bisa dibuat di perangkat ini', 'error'); return; }
      toast('Membuat gambar invoice...', 'info', 2000);
      waitInvImages(tmpl).catch(() => false).then(() => html2canvas(tmpl, { scale: 2, backgroundColor: '#FCF7F1', useCORS: true, width: 700, windowWidth: 700 })).then(canvas => {
        const fname = invImgName();
        const fallback = () => showInvImgPreview(canvas, fname);
        const shareIt = blob => {
          if (!blob || typeof navigator === 'undefined' || !navigator.canShare || typeof File !== 'function') { fallback(); return; }
          const file = new File([blob], fname, { type: 'image/png' });
          if (!navigator.canShare({ files: [file] })) { fallback(); return; }
          navigator.share({ files: [file], title: 'Invoice DaisafaCare' })
            .then(() => toast('Gambar invoice siap disimpan', 'success'))
            .catch(() => fallback());
        };
        if (canvas.toBlob) canvas.toBlob(shareIt, 'image/png');
        else fallback();
      }).catch(() => toast('Gagal membuat gambar invoice', 'error'));
    }
