<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DaisafaCare — Management System</title>
  <meta name="description" content="Sistem manajemen jadwal dan invoice Daisafacare Mom &amp; Baby Treatment">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus&#43;Jakarta&#43;Sans:wght@300;400;500;600;700;800&amp;family=Playfair&#43;Display:wght@400;600;700&amp;display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>

    (function () {
      function showErr(msg) {
        var el = document.getElementById('jsErrBanner');
        if (!el) {
          el = document.createElement('div');
          el.id = 'jsErrBanner';
          el.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#b00020;color:#fff;font:12px/1.5 monospace;padding:8px 10px;white-space:pre-wrap';
          (document.body || document.documentElement).appendChild(el);
        }
        el.textContent = 'Terjadi kesalahan JavaScript: ' + msg;
      }
      window.addEventListener('error', function (e) { showErr((e.message || e.type) + (e.lineno ? ' (baris ' + e.lineno + ')' : '')); });
      window.addEventListener('load', function () {
        if (typeof doLogin !== 'function') showErr('File index.html tidak lengkap/rusak — fungsi doLogin tidak ditemukan.');
      });
    })();
  </script>
  <style>
    :root {
      --sage: #85957A;
      --sage-dark: #6e7d65;
      --sage-light: #B8C2AA;
      --slate: #A6B3A5;
      --beige: #D4C2AA;
      --beige-dark: #C4AE96;
      --cream: #FCF7F1;
      --cream-dark: #F5EDE2;
      --white: #FFFFFF;
      --text: #2D3A2E;
      --text-sec: #6B7A6C;
      --text-muted: #9AA69B;
      --border: #E2EBE2;
      --border-light: #EFF5EF;
      --success: #4CAF7D;
      --success-bg: #E8F5EE;
      --warning: #F59E0B;
      --warning-bg: #FEF3C7;
      --danger: #E05252;
      --danger-bg: #FEECEC;
      --info: #5B8FB9;
      --info-bg: #EAF2FB;
      --shadow-sm: 0 1px 3px rgba(45, 58, 46, 0.06);
      --shadow-md: 0 4px 16px rgba(45, 58, 46, 0.10);
      --shadow-lg: 0 12px 40px rgba(45, 58, 46, 0.14);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --sidebar-w: 260px;
      --font: 'Plus Jakarta Sans', sans-serif;
      --font-display: 'Playfair Display', serif;
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font);
      background: var(--cream);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    input,
    select,
    textarea,
    button {
      font-family: var(--font);
      font-size: 15px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
    }


    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--sage-light);
      border-radius: 6px;
    }


    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, var(--sage-dark) 0%, var(--sage) 50%, #7a8e70 100%);
      position: relative;
      overflow: hidden;
    }

    .login-page::before {
      content: '';
      position: absolute;
      top: -100px;
      right: -80px;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.07);
    }

    .login-page::after {
      content: '';
      position: absolute;
      bottom: -120px;
      left: -100px;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
    }

    .login-card {
      background: var(--white);
      border-radius: var(--radius-xl);
      padding: 48px 44px 40px;
      max-width: 420px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      position: relative;
      z-index: 1;
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(32px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-logo-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--sage), var(--sage-dark));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 36px;
      box-shadow: 0 8px 24px rgba(133, 149, 122, 0.35);
    }

    .login-logo h1 {
      font-family: var(--font-display);
      font-size: 26px;
      color: var(--sage-dark);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .login-logo p {
      color: var(--text-sec);
      font-size: 13px;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sec);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 15px;
      color: var(--text);
      background: var(--cream);
      transition: all 0.2s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--sage);
      box-shadow: 0 0 0 3px rgba(133, 149, 122, 0.15);
      background: var(--white);
    }

    .pwd-wrap {
      position: relative;
    }

    .pwd-wrap input {
      padding-right: 46px;
    }

    .pwd-eye {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      font-size: 15px;
      transition: color 0.2s;
    }

    .pwd-eye:hover {
      color: var(--sage);
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--sage), var(--sage-dark));
      color: var(--white);
      border: none;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s;
      margin-top: 8px;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 14px rgba(133, 149, 122, 0.35);
    }

    .btn-login:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(133, 149, 122, 0.45);
    }

    .btn-login:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .login-error {
      background: var(--danger-bg);
      color: var(--danger);
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      margin-top: 16px;
      font-size: 13px;
      font-weight: 500;
      border-left: 3px solid var(--danger);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 11px;
      color: var(--text-muted);
    }


    .app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }


    .sidebar {
      width: var(--sidebar-w);
      background: linear-gradient(180deg, var(--sage-dark) 0%, #5e6f56 100%);
      color: var(--white);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
      box-shadow: 2px 0 12px rgba(45, 58, 46, 0.15);
      scrollbar-width: none;
    }

    .sidebar::-webkit-scrollbar {
      display: none;
    }

    .sidebar-brand {
      padding: 26px 20px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .sidebar-brand-name {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .sidebar-brand-tag {
      font-size: 11px;
      opacity: 0.75;
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    .sidebar-user {
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.15);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sidebar-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      flex-shrink: 0;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .sidebar-uname {
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.3;
    }

    .sidebar-urole {
      font-size: 11px;
      opacity: 0.7;
      text-transform: capitalize;
      margin-top: 1px;
    }

    .sidebar-nav {
      flex: 1;
      padding: 14px 12px;
    }

    .sidebar-section-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
      padding: 12px 8px 6px;
    }

    .nav-item {
      width: 100%;
      text-align: left;
      padding: 11px 12px;
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.85);
      cursor: pointer;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
      margin-bottom: 2px;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--white);
    }

    .nav-item.active {
      background: rgba(255, 255, 255, 0.2);
      color: var(--white);
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .nav-item i {
      width: 20px;
      text-align: center;
      font-size: 16px;
      opacity: 0.9;
    }

    .sidebar-bottom {
      padding: 14px 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .btn-logout {
      width: 100%;
      padding: 11px 12px;
      background: rgba(224, 82, 82, 0.18);
      border: 1px solid rgba(224, 82, 82, 0.35);
      color: rgba(255, 255, 255, 0.9);
      cursor: pointer;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background: rgba(224, 82, 82, 0.35);
      color: var(--white);
    }


    .main {
      flex: 1;
      overflow-y: auto;
      background: var(--cream);
      display: flex;
      flex-direction: column;
    }

    .topbar {
      background: var(--white);
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .topbar-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .topbar-date {
      font-size: 13px;
      color: var(--text-muted);
      background: var(--cream);
      padding: 7px 14px;
      border-radius: 20px;
      font-weight: 500;
    }

    .page-content {
      padding: 24px 28px;
      flex: 1;
    }


    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px 20px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-primary {
      background: var(--sage);
      color: var(--white);
      box-shadow: 0 2px 8px rgba(133, 149, 122, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--sage-dark);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(133, 149, 122, 0.4);
    }

    .btn-beige {
      background: var(--beige);
      color: var(--text);
    }

    .btn-beige:hover:not(:disabled) {
      background: var(--beige-dark);
      transform: translateY(-1px);
    }

    .btn-danger {
      background: var(--danger);
      color: var(--white);
    }

    .btn-danger:hover:not(:disabled) {
      background: #c94444;
      transform: translateY(-1px);
    }

    .btn-outline {
      background: transparent;
      color: var(--sage);
      border: 1.5px solid var(--sage);
    }

    .btn-outline:hover:not(:disabled) {
      background: var(--sage);
      color: var(--white);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-sec);
      border: 1.5px solid var(--border);
    }

    .btn-ghost:hover:not(:disabled) {
      border-color: var(--sage);
      color: var(--sage);
    }

    .btn-sm {
      padding: 7px 14px;
      font-size: 13px;
    }

    .btn-icon {
      padding: 8px;
      width: 36px;
      height: 36px;
    }


    .card {
      background: var(--white);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-light);
    }

    .card-header {
      padding: 18px 22px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-body {
      padding: 18px 22px;
    }


    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .kpi-card {
      background: var(--white);
      border-radius: var(--radius-md);
      padding: 20px 22px;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
      transition: all 0.2s;
      position: relative;
      overflow: hidden;
    }

    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
    }

    .kpi-card.green::before {
      background: linear-gradient(90deg, var(--sage), var(--sage-light));
    }

    .kpi-card.beige::before {
      background: linear-gradient(90deg, var(--beige), var(--beige-dark));
    }

    .kpi-card.success::before {
      background: linear-gradient(90deg, var(--success), #3da867);
    }

    .kpi-card.danger::before {
      background: linear-gradient(90deg, var(--danger), #c94444);
    }

    .kpi-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .kpi-ico {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      margin-bottom: 14px;
    }

    .kpi-ico.green {
      background: linear-gradient(135deg, var(--sage), var(--sage-dark));
      color: var(--white);
    }

    .kpi-ico.beige {
      background: linear-gradient(135deg, var(--beige), var(--beige-dark));
      color: var(--text);
    }

    .kpi-ico.success {
      background: linear-gradient(135deg, var(--success), #3da867);
      color: var(--white);
    }

    .kpi-ico.danger {
      background: linear-gradient(135deg, var(--danger), #c94444);
      color: var(--white);
    }

    .kpi-val {
      font-size: 26px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .kpi-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }


    .dash-hero {
      background: linear-gradient(135deg, var(--sage-dark) 0%, var(--sage) 60%, #96a88b 100%);
      border-radius: var(--radius-lg);
      padding: 28px 32px;
      color: var(--white);
      margin-bottom: 22px;
      position: relative;
      overflow: hidden;
    }

    .dash-hero::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -40px;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.07);
    }

    .dash-hero::after {
      content: '';
      position: absolute;
      bottom: -50px;
      right: 100px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
    }

    .dash-hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      position: relative;
      z-index: 1;
    }

    .dash-hero-greet {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .dash-hero-sub {
      font-size: 13px;
      opacity: 0.85;
    }

    .dash-hero-badge {
      background: rgba(255, 255, 255, 0.18);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dash-hero-stats {
      display: flex;
      gap: 36px;
      padding-top: 20px;
      margin-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
      z-index: 1;
    }

    .dash-stat-val {
      font-size: 22px;
      font-weight: 800;
      line-height: 1;
    }

    .dash-stat-lbl {
      font-size: 11px;
      opacity: 0.75;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-top: 4px;
    }


    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 18px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 18px;
    }

    .grid-1-2 {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 18px;
      margin-bottom: 18px;
    }

    .grid-2-1 {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 18px;
      margin-bottom: 18px;
    }

    @media(max-width:1100px) {

      .grid-2,
      .grid-3,
      .grid-1-2,
      .grid-2-1 {
        grid-template-columns: 1fr;
      }
    }


    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    thead th {
      background: var(--cream-dark);
      color: var(--text-sec);
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 12px 14px;
      text-align: left;
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }

    tbody td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-light);
      color: var(--text);
      vertical-align: middle;
    }

    tbody tr:hover td {
      background: var(--cream);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .table-empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
    }

    .table-empty i {
      font-size: 36px;
      display: block;
      margin-bottom: 10px;
      opacity: 0.4;
    }


    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge-scheduled {
      background: var(--info-bg);
      color: var(--info);
    }

    .badge-done {
      background: var(--success-bg);
      color: var(--success);
    }

    .badge-cancelled {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .badge-lunas {
      background: var(--success-bg);
      color: var(--success);
    }

    .badge-belum {

    .toast-stack {

      right: 20px;

      flex-direction: column;
      gap: 10px;

    .toast {
      background: var(--white);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
      animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      border-left: 4px solid var(--sage);
      min-width: 280px;
      max-width: 380px;
    }

    .toast.success {
      border-left-color: var(--success);
    }

    .toast.error {
      border-left-color: var(--danger);
    }

    .toast.warning {
      border-left-color: var(--warning);
    }

    .toast-icon {
      font-size: 18px;
      flex-shrink: 0;
    }

    .toast.success .toast-icon {
      color: var(--success);
    }

    .toast.error .toast-icon {
      color: var(--danger);
    }

    .toast.warning .toast-icon {
      color: var(--warning);
    }

    .toast-msg {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.4;
    }

      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateX(40px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .toast.leaving {
      animation: toastOut 0.2s ease forwards;
    }

    @keyframes toastOut {
      to {

        transform: translateX(40px);
      }
    }

<body>


  <div class="toast-stack" id="toastStack"></div>


  <div id="loginPage" class="login-page">

      <nav class="sidebar-nav">

        </button>

        </button>
        <button class="nav-item" onclick="navigate('pelanggan')" id="nav-pelanggan">
          <i class="fa fa-users"></i> Pelanggan
        </button>
        <button class="nav-item" onclick="navigate('pricelist')" id="nav-pricelist">
          <i class="fa fa-tags"></i> Pricelist
        </button>
        <button class="nav-item" onclick="navigate('invoice')" id="nav-invoice">
          <i class="fa fa-file-invoice"></i> Invoice
        </button>
        <div class="sidebar-section-title" style="margin-top:8px">Keuangan</div>

        </button>

        <button class="btn-logout" onclick="doLogout()"><i class="fa fa-right-from-bracket"></i> Keluar</button>
      </div>

    <main class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="menu-toggle" onclick="openSidebar()"><i class="fa fa-bars"></i></button>
          <div class="topbar-title" id="topbarTitle"><i class="fa fa-gauge-high"></i> Dashboard</div>
        </div>
        <div class="topbar-right">
          <div class="topbar-date" id="topbarDate"></div>
          <button class="btn btn-sm btn-primary" id="topbarAction" style="display:none" onclick="topbarActionClick()">
            <i class="fa fa-plus"></i> <span id="topbarActionLabel">Tambah</span>
          </button>
        </div>

      <div class="page-content" id="pageContent">

      </div>

  <div id="modalContainer"></div>
  <div id="popupContainer"></div>
  <div id="loadingOv" class="loading-ov" style="display:none">
    <div class="spinner"></div>
    <div class="loading-txt" id="loadingTxt">Memuat data...</div>
  </div>

  <script>



    const S = {
      user: null,
      page: 'dashboard',
      settings: {},
      data: { schedules: [], customers: [], treatments: [], payments: [], users: [], customerDetail: null },
      calYear: new Date().getFullYear(),
      calMonth: new Date().getMonth(),
      invoiceData: null,
      editingScheduleId: null,
    };




    const $ = id => document.getElementById(id);
    const fmtRp = v => 'Rp ' + (parseFloat(v) || 0).toLocaleString('id-ID');
    const fmtDate = s => { if (!s) return ''; const d = new Date(s); if (isNaN(d)) return s; return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }); };
    const fmtDateInput = s => { if (!s) return ''; const d = new Date(s); if (isNaN(d)) return ''; return d.toISOString().split('T')[0]; };
    const today = () => new Date().toISOString().split('T')[0];
    const sanitize = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const isWriter = () => ['admin', 'receptionist'].includes(S.user && S.user.role);
    const isAdmin = () => !!(S.user && S.user.role === 'admin');
    const isActiveVal = v => { if (v === undefined || v === null || v === '') return true; const t = String(v).toLowerCase(); return !(t === '0' || t === 'false' || t === 'nonaktif'); };

    function ga(fn, args, cb) {

      if (typeof google !== 'undefined' && google.script) {
        google.script.run.withSuccessHandler(cb).withFailureHandler(e => { toast('Error: ' + e.message, 'error'); loading(false); })[fn](...(args || []));
      } else {

        console.log('GAS call:', fn, args);
        setTimeout(() => cb({ success: false, message: 'GAS not available in local mode' }), 300);
      }
    }

    function loading(show, txt) {
      $('loadingOv').style.display = show ? 'flex' : 'none';
      if (txt) $('loadingTxt').textContent = txt;
    }

    function toast(msg, type = 'info', dur = 3500) {
      const icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', warning: 'fa-triangle-exclamation', info: 'fa-circle-info' };
      const el = document.createElement('div');
      el.className = 'toast ' + type;
      el.innerHTML = `<i class="fa ${icons[type] || icons.info} toast-icon"></i><div class="toast-msg">${sanitize(msg)}</div><button class="toast-close" onclick="this.parentElement.remove()"><i class="fa fa-xmark"></i></button>`;
      $('toastStack').appendChild(el);
      setTimeout(() => { el.classList.add('leaving'); setTimeout(() => el.remove(), 220); }, dur);
    }

    function confirm(title, msg, type, onOk, okLabel = 'Ya, Lanjutkan') {
      const icons = { danger: 'fa-trash danger', warning: 'fa-triangle-exclamation warning' };
      $('popupContainer').innerHTML = `
  <div class="popup-overlay" id="popupOv">
    <div class="popup">
      <div class="popup-icon ${type || 'warning'}"><i class="fa ${icons[type] || 'fa-circle-question'}"></i></div>
      <div class="popup-title">${sanitize(title)}</div>
      <div class="popup-msg">${sanitize(msg)}</div>
      <div class="popup-actions">
        <button class="btn btn-ghost" onclick="closePopup()">Batal</button>
        <button class="btn btn-${type === 'danger' ? 'danger' : 'primary'}" onclick="popupOk()">${sanitize(okLabel)}</button>
      </div>
    </div>
  </div>`;
      window._popupOk = onOk;
    }
    function popupOk() { closePopup(); if (window._popupOk) window._popupOk(); }
    function closePopup() { $('popupContainer').innerHTML = ''; }

    function closeModal() { $('modalContainer').innerHTML = ''; }

    function togglePwd(id, btn) {
      const inp = $(id);
      if (inp.type === 'password') { inp.type = 'text'; btn.innerHTML = '<i class="fa fa-eye-slash"></i>'; }
      else { inp.type = 'password'; btn.innerHTML = '<i class="fa fa-eye"></i>'; }
    }

    // ═══════════════════════════════════════════════════════════════


    function doLogin() {
      const email = $('loginEmail').value.trim();
      const pwd = $('loginPwd').value;
      const err = $('loginErr');
      if (!email || !pwd) { showLoginErr('Email dan password wajib diisi'); return; }
      const btn = $('loginBtn');
      btn.disabled = true; btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Masuk...';
      ga('login', [email, pwd], res => {
        btn.disabled = false; btn.innerHTML = '<i class="fa fa-leaf"></i> Masuk';
        if (res.success) {
          S.user = res.data;
          try { localStorage.setItem('dsf_user', JSON.stringify(res.data)); } catch (e) { }
          startApp();
        } else { showLoginErr(res.message || 'Login gagal'); }
      });
    }

    function showLoginErr(msg) {
      const el = $('loginErr');
      el.style.display = 'flex';
      el.querySelector('span').textContent = msg;
    }

    $('loginPwd').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    $('loginEmail').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginPwd').focus(); });

    function doLogout() {
      confirm('Keluar?', 'Anda yakin ingin keluar?', 'warning', () => {
        S.user = null;
        try { localStorage.removeItem('dsf_user'); } catch (e) { }
        $('app').style.display = 'none';
        $('loginPage').style.display = 'flex';
        $('loginPwd').value = '';
        $('loginErr').style.display = 'none';
      }, 'Ya, Keluar');
    }




    function startApp() {
      $('loginPage').style.display = 'none';
      $('app').style.display = 'flex';
      $('sidebarName').textContent = S.user.full_name;
      $('sidebarRole').textContent = S.user.role;
      $('sidebarAvatar').textContent = S.user.full_name.charAt(0).toUpperCase();

      $('adminNav').style.display = isAdmin() ? '' : 'none';
      if (isAdmin()) {
        $('nav-logs').style.display = 'flex';
      }
      updateTopbarDate();
      setInterval(updateTopbarDate, 60000);
      refreshSessionUser();
      loadSettings(() => navigate('dashboard'));
    }


    function refreshSessionUser() {
      if (!S.user || !S.user.id) return;
      ga('getProfile', [S.user.id], res => {
        if (!res) return;

        const u = res.success ? res.data : (res.full_name ? res : null);
        if (!u) return;
        if (u.full_name) S.user.full_name = u.full_name;
        if (u.phone !== undefined) S.user.phone = u.phone;
        if (u.email) S.user.email = u.email;
        if (u.role) S.user.role = u.role;
        $('sidebarName').textContent = S.user.full_name || '';
        $('sidebarAvatar').textContent = (S.user.full_name || '?').charAt(0).toUpperCase();
        $('sidebarRole').textContent = S.user.role;
        $('adminNav').style.display = isAdmin() ? '' : 'none';
        $('nav-logs').style.display = isAdmin() ? 'flex' : 'none';
        try { localStorage.setItem('dsf_user', JSON.stringify(S.user)); } catch (e) { }
      });
    }

    function updateTopbarDate() {
      const d = new Date();
      $('topbarDate').textContent = d.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    }

    function loadSettings(cb) {
      ga('getSettings', [], res => {
        if (res.success) S.settings = res.data;
        if (cb) cb();
      });
    }




    const pages = {
      dashboard: { title: '<i class="fa fa-gauge-high"></i> Dashboard', load: renderDashboard },
      jadwal: { title: '<i class="fa fa-calendar-days"></i> Jadwal', load: renderJadwal },
      pelanggan: { title: '<i class="fa fa-users"></i> Pelanggan', load: renderPelanggan },
      pricelist: { title: '<i class="fa fa-tags"></i> Pricelist Treatment', load: renderPricelist },
      invoice: { title: '<i class="fa fa-file-invoice"></i> Invoice', load: renderInvoice },
      pembayaran: { title: '<i class="fa fa-money-bill-wave"></i> Pembayaran', load: renderPembayaran },
      laporan: { title: '<i class="fa fa-chart-line"></i> Laporan', load: renderLaporan },
      settings: { title: '<i class="fa fa-gear"></i> Pengaturan', load: renderSettings },
      logs: { title: '<i class="fa fa-list-check"></i> Log Aktivitas', load: renderLogs },
    };

    function navigate(page) {
      S.page = page;
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      const navEl = $('nav-' + page);
      if (navEl) navEl.classList.add('active');
      $('topbarTitle').innerHTML = pages[page]?.title || page;
      $('topbarAction').style.display = 'none';
      $('pageContent').innerHTML = '';
      closeModal(); closePopup();
      closeSidebar();
      if (pages[page]) pages[page].load();
    }

    function openSidebar() { $('sidebar').classList.add('open'); $('sidebarOverlay').classList.add('show'); }
    function closeSidebar() { $('sidebar').classList.remove('open'); $('sidebarOverlay').classList.remove('show'); }


    function topbarActionClick() {
      if (!isWriter()) { toast('Anda tidak memiliki akses untuk menambah data', 'error'); return; }
      if (S.page === 'jadwal') openScheduleModal();
      else if (S.page === 'pelanggan') openCustomerModal();
      else if (S.page === 'pricelist') openTreatmentModal();
    }




    function renderDashboard() {
      $('pageContent').innerHTML = `
  <div class="dash-hero">
    <div class="dash-hero-top">
      <div>
        <div class="dash-hero-greet">Selamat datang, ${sanitize(S.user.full_name)} 🌿</div>
        <div class="dash-hero-sub">${S.settings.business_name || 'Daisafacare'} — ${S.settings.business_tagline || 'Mom & Baby Treatment'}</div>
      </div>
      <div class="dash-hero-badge"><i class="fa fa-leaf"></i> gentle care, happy baby</div>
    </div>
    <div class="dash-hero-stats" id="heroStats">
      <div><div class="dash-stat-val skeleton" style="width:80px;height:28px;border-radius:6px"></div><div class="dash-stat-lbl">Jadwal Hari Ini</div></div>
      <div><div class="dash-stat-val skeleton" style="width:120px;height:28px;border-radius:6px"></div><div class="dash-stat-lbl">Pendapatan Bulan Ini</div></div>
      <div><div class="dash-stat-val skeleton" style="width:100px;height:28px;border-radius:6px"></div><div class="dash-stat-lbl">Piutang</div></div>
    </div>
  </div>
  <div class="kpi-grid" id="kpiGrid">
    ${[1, 2, 3, 4].map(() => `<div class="kpi-card"><div class="skeleton" style="width:42px;height:42px;border-radius:10px;margin-bottom:14px"></div><div class="skeleton" style="width:100px;height:28px;margin-bottom:6px"></div><div class="skeleton" style="width:80px;height:14px"></div></div>`).join('')}
  </div>
  <div class="grid-2-1">
    <div class="report-card">
      <div class="report-card-title"><i class="fa fa-chart-line" style="color:var(--sage)"></i> Pendapatan 30 Hari Terakhir</div>
      <div class="chart-wrap"><canvas id="dashChart"></canvas></div>
    </div>
    <div class="report-card">
      <div class="report-card-title"><i class="fa fa-pie-chart" style="color:var(--sage)"></i> Status Jadwal</div>
      <div class="chart-wrap"><canvas id="statusChart"></canvas></div>
    </div>
  </div>
  <div class="grid-2">
    <div class="card">
      <div class="card-header"><div class="card-title"><i class="fa fa-calendar-day" style="color:var(--sage)"></i> Jadwal Hari Ini</div></div>
      <div class="card-body" id="todayList"><div class="table-empty"><i class="fa fa-calendar"></i>Memuat...</div></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title"><i class="fa fa-clock-rotate-left" style="color:var(--sage)"></i> Jadwal Terbaru</div></div>
      <div class="card-body" id="recentList"><div class="table-empty"><i class="fa fa-list"></i>Memuat...</div></div>
    </div>
  </div>
  <div class="grid-2">
    <div class="card">
      <div class="card-header"><div class="card-title"><i class="fa fa-warning" style="color:var(--warning)"></i> Piutang Belum Lunas</div></div>
      <div class="card-body" id="overdueList"><div class="table-empty"><i class="fa fa-check-circle"></i>Tidak ada piutang</div></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title"><i class="fa fa-star" style="color:var(--beige-dark)"></i> Top 5 Pelanggan</div></div>
      <div class="card-body" id="topCustList"><div class="table-empty"><i class="fa fa-users"></i>Memuat...</div></div>
    </div>
  </div>`;

      ga('getDashboardStats', [S.user.id, S.user.role], res => {
        if (!res.success) { toast(res.message, 'error'); return; }
        const d = res.data;
        // Hero stats
        $('heroStats').innerHTML = `
      <div><div class="dash-stat-val">${d.todayCount}</div><div class="dash-stat-lbl">Jadwal Hari Ini</div></div>
      <div><div class="dash-stat-val">${fmtRp(d.monthRevenue)}</div><div class="dash-stat-lbl">Pendapatan Bulan Ini</div></div>
      <div><div class="dash-stat-val">${fmtRp(d.totalCustDue)}</div><div class="dash-stat-lbl">Total Piutang</div></div>`;
        // KPIs
        $('kpiGrid').innerHTML = `
      <div class="kpi-card green"><div class="kpi-ico green"><i class="fa fa-calendar-check"></i></div><div class="kpi-val">${d.todayCount}</div><div class="kpi-label">Jadwal Hari Ini</div></div>
      <div class="kpi-card beige"><div class="kpi-ico beige"><i class="fa fa-money-bill-trend-up"></i></div><div class="kpi-val">${fmtRp(d.monthRevenue)}</div><div class="kpi-label">Pendapatan Bulan Ini</div></div>
      <div class="kpi-card success"><div class="kpi-ico success"><i class="fa fa-hand-holding-dollar"></i></div><div class="kpi-val">${fmtRp(d.monthCollected)}</div><div class="kpi-label">Terkumpul Bulan Ini</div></div>
      <div class="kpi-card danger"><div class="kpi-ico danger"><i class="fa fa-triangle-exclamation"></i></div><div class="kpi-val">${fmtRp(d.totalCustDue)}</div><div class="kpi-label">Total Piutang</div></div>`;

        const ctx = document.getElementById('dashChart').getContext('2d');
        new Chart(ctx, { type: 'line', data: { labels: d.dailyData.map(x => x.date), datasets: [{ label: 'Pendapatan (Rp)', data: d.dailyData.map(x => x.amount), borderColor: '#85957A', backgroundColor: 'rgba(133,149,122,0.12)', tension: 0.4, fill: true, pointRadius: 2, pointHoverRadius: 5 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => fmtRp(ctx.raw) } } }, scales: { y: { ticks: { callback: v => 'Rp ' + v.toLocaleString('id-ID') } } } } });

        $('topbarAction').style.display = 'none';

  <div class="filter-bar">
    <div class="fg"><label>Status</label><select class="fg" id="fStatus" onchange="loadSchedules()"><option value="">Semua</option><option value="scheduled">Terjadwal</option><option value="done">Selesai</option><option value="cancelled">Dibatalkan</option></select></div>

      </div>

      loadSchedules();

    let currentView = 'list';

      $('viewCal').style.cssText = v === 'cal' ? 'background:var(--sage);color:#fff' : '';

    }
    function resetFilters() {
      $('fStatus').value = ''; $('fFrom').value = ''; $('fTo').value = '';
      loadSchedules();
    }
    function loadSchedules() {
      const filters = { status: $('fStatus').value, dateFrom: $('fFrom').value, dateTo: $('fTo').value };
      ga('getSchedules', [S.user.id, S.user.role, filters], res => {
        if (!res.success) { toast(res.message, 'error'); return; }
        S.data.schedules = res.data;
        if (currentView === 'cal') renderCalendar(res.data);
        else renderScheduleList(res.data);
      });

    function renderScheduleList(data) {
      if (!data.length) { $('jadwalContent').innerHTML = `<div class="table-empty" style="background:var(--white);border-radius:var(--radius-md);padding:48px"><i class="fa fa-calendar-plus"></i>Belum ada jadwal.${isWriter() ? ' Klik + Tambah Jadwal untuk mulai.' : ''}</div>`; return; }

  <div class="card">
    <div class="table-wrap">
      <table>

          <td><span style="font-family:monospace;font-weight:700;font-size:12px">${sanitize(s.invoice_no)}</span></td>

    function renderCalendar(data) {
      const y = S.calYear, m = S.calMonth;
      const firstDay = new Date(y, m, 1).getDay();
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      const todayStr = today();

      // Build event map
      const evtMap = {};
      data.forEach(s => {
        const d = s.schedule_date;
        if (!evtMap[d]) evtMap[d] = [];
        evtMap[d].push(s);
      });

      let cells = '';
      for (let i = 0; i < firstDay; i++) cells += `<div class="cal-day other-month"></div>`;
      for (let d = 1; d <= daysInMonth; d++) {
        const ds = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        const isToday = ds === todayStr;
        const evts = evtMap[ds] || [];
        cells += `<div class="cal-day ${isToday ? 'today' : ''}" onclick="calDayClick('${ds}')">
      <div class="cal-day-num">${isToday ? `<span>${d}</span>` : d}</div>
      ${evts.slice(0, 3).map(e => `<div class="cal-event ${e.status}" title="${sanitize(e.customer_name)}">${sanitize(e.schedule_time) ? sanitize(e.schedule_time) + ' ' : ''}${sanitize(e.customer_name)}</div>`).join('')}
      ${evts.length > 3 ? `<div style="font-size:10px;color:var(--text-muted)">+${evts.length - 3} lainnya</div>` : ''}
    </div>`;
      }

      $('jadwalContent').innerHTML = `
  <div class="card">
    <div class="card-body">
      <div class="cal-nav">
        <button class="btn btn-ghost btn-sm" onclick="changeMonth(-1)"><i class="fa fa-chevron-left"></i></button>
        <div class="cal-month-title">${months[m]} ${y}</div>
        <button class="btn btn-ghost btn-sm" onclick="changeMonth(1)"><i class="fa fa-chevron-right"></i></button>
      </div>
      <div class="cal-grid">
        ${['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'].map(d => `<div class="cal-day-hdr">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>
  </div>`;
    }

    function changeMonth(d) {
      S.calMonth += d;
      if (S.calMonth < 0) { S.calMonth = 11; S.calYear--; }
      if (S.calMonth > 11) { S.calMonth = 0; S.calYear++; }
      loadSchedules();
    }

      const evts = S.data.schedules.filter(s => s.schedule_date === ds);
      if (!evts.length) { if (isWriter()) openScheduleModal(ds); return; }

      $('modalContainer').innerHTML = `
  <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal modal-sm">
      <div class="modal-header"><h3><i class="fa fa-calendar-day"></i> ${fmtDate(ds)}</h3><button class="modal-close" onclick="closeModal()"><i class="fa fa-xmark"></i></button></div>
      <div class="modal-body">
        ${evts.map(s => `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-light)">
          <div><div style="font-weight:700">${sanitize(s.customer_name)}</div><div style="font-size:12px;color:var(--text-muted)">${sanitize(s.schedule_time)} · ${sanitize(s.location)}</div></div>
          <div style="display:flex;gap:6px">
            <button class="btn btn-sm btn-outline" onclick="closeModal();viewSchedule(${s.id})"><i class="fa fa-eye"></i></button>
            <button class="btn btn-sm btn-beige" onclick="closeModal();printInvoiceById(${s.id})"><i class="fa fa-print"></i></button>
          </div>
        </div>`).join('')}
        ${isWriter() ? `<div style="margin-top:14px"><button class="btn btn-primary" onclick="closeModal();openScheduleModal('${ds}')"><i class="fa fa-plus"></i> Tambah Jadwal Hari Ini</button></div>` : ''}
      </div>
    </div>
  </div>`;
    }

    function statusLabel(s) { return { scheduled: 'Terjadwal', done: 'Selesai', cancelled: 'Dibatalkan' }[s] || s; }
    function keteranganClass(k) { if (!k) return ''; k = k.toLowerCase(); if (k.includes('lunas')) return 'lunas'; if (k.includes('belum')) return 'belum'; if (k.includes('dp')) return 'dp'; return ''; }

      ga('getTreatmentsForDropdown', [], res => {
        if (res.success) S.data.treatments = res.data;
        treatmentOpts = (res.data || []).map(t => `<option value="${t.id}" data-price="${t.price}" data-name="${sanitize(t.category)} - ${sanitize(t.name)} | Rp ${(t.price / 1000).toFixed(0)}K">${sanitize(t.category)} - ${sanitize(t.name)} | Rp ${(t.price / 1000).toFixed(0)}K</option>`).join('');
        ga('getCustomersForDropdown', [], cres => {
          ga('getTherapistsForDropdown', [], tres => {
            const custOpts = (cres.data || []).map(c => `<option value="${c.id}">${sanitize(c.name)} - ${sanitize(c.phone)}</option>`).join('');
            const therapOpts = (tres.data || []).map(t => `<option value="${t.id}">${sanitize(t.name)}</option>`).join('');

        <div class="modal-overlay" onclick="if(event.target===this)closeModal()">

            <div class="modal-header"><h3><i class="fa fa-calendar-plus"></i> Tambah Jadwal Baru</h3><button class="modal-close" onclick="closeModal()"><i class="fa fa-xmark"></i></button></div>
            <div class="modal-body">

                <div class="form-row cols-2">
                  <div class="fg"><label>Pelanggan <span style="color:var(--text-muted);font-weight:400">(kosongkan untuk walk-in)</span></label><select id="fCust"><option value="">— Walk-in —</option>${custOpts}</select></div>

                  <div class="fg"><label>Metode Bayar</label><select id="fMethod" onchange="calcSummary()"><option>TF/QRIS</option><option>Cash</option><option>Transfer</option></select></div>
                </div>
                <div class="form-row cols-2">
                  <div class="fg"><label>Lokasi / Alamat</label><input type="text" id="fLoc" placeholder="Nama wilayah atau alamat lengkap"></div>

              </div>

                <div class="form-section-title"><i class="fa fa-calculator"></i> Pembayaran</div>

                  <div class="fg"><label>Diskon (Rp)</label><input type="number" id="fDiscount" value="0" min="0" step="1000" oninput="calcSummary()"></div>
                  <div class="fg"><label>Dibayar (Rp)</label><input type="number" id="fPaid" value="0" min="0" step="1000" oninput="calcSummary()"></div>
                </div>
                <div id="summaryBox" class="summary-box" style="margin-top:4px">
                  <div class="summary-row"><span>Fee Treatment</span><span id="sumFee">Rp 0</span></div>
                  <div class="summary-row"><span>Transport</span><span id="sumTransport">Rp 0</span></div>
                  <div class="summary-row"><span>Subtotal</span><span id="sumSubtotal">Rp 0</span></div>
                  <div class="summary-row"><span>Diskon</span><span id="sumDiscount">Rp 0</span></div>
                  <div class="summary-row total"><span>TOTAL</span><span id="sumTotal">Rp 0</span></div>

                </div>
                <div class="fg" style="margin-top:14px"><label>Status Pembayaran (otomatis)</label><input type="text" id="fKetPreview" value="BELUM BAYAR" disabled style="opacity:0.85;background:var(--cream-dark);font-weight:700;color:var(--sage-dark)"></div>

    let itemCount = 0;
    function addItemRow() {
      itemCount++;
      const id = 'item_' + itemCount;
      const treatments = S.data.treatments || [];
      const opts = treatments.map(t => `<option value="${t.id}" data-price="${t.price}">${sanitize(t.category)} - ${sanitize(t.name)} | Rp ${(t.price / 1000).toFixed(0)}K</option>`).join('');
      const row = document.createElement('div');
      row.className = 'item-row'; row.id = id;
      row.innerHTML = `
    <div class="fg"><label>Treatment</label><select onchange="itemTrSelect(this,'${id}')"><option value="">— Pilih —</option>${opts}</select></div>
    <div class="fg"><label>Harga (Rp)</label><input type="number" id="${id}_price" value="0" min="0" step="1000" oninput="calcItemRow('${id}');calcSummary()"></div>
    <div class="fg"><label>Qty</label><input type="number" id="${id}_qty" value="1" min="1" oninput="calcItemRow('${id}');calcSummary()"></div>
    <div style="padding-top:26px"><button class="btn btn-danger btn-icon" onclick="document.getElementById('${id}').remove();calcSummary()" title="Hapus"><i class="fa fa-trash"></i></button></div>`;
      $('itemsContainer').appendChild(row);
    }

    function itemTrSelect(sel, id) {
      const opt = sel.options[sel.selectedIndex];
      const price = parseFloat(opt.dataset.price) || 0;
      $(id + '_price').value = price;
      sel.dataset.trId = sel.value;
      sel.dataset.trName = opt.text;
      calcItemRow(id); calcSummary();
    }

    function calcItemRow(id) {
      const price = parseFloat($(id + '_price').value) || 0;
      const qty = parseInt($(id + '_qty').value) || 1;

      let st = document.querySelector('#' + id + ' .item-total');
      if (!st) { st = document.createElement('div'); st.className = 'item-total'; document.getElementById(id).appendChild(st); }
      st.textContent = fmtRp(price * qty);
    }

    function calcTransport() {
      const km = parseFloat($('fKm').value) || 0;
      const rate = parseFloat(S.settings.transport_rate_per_km) || 2000;
      $('fTransport').value = Math.round(km * rate);
      calcSummary();
    }

    function calcSummary() {
      let fee = 0;
      document.querySelectorAll('.item-row').forEach(row => {
        const priceEl = row.querySelector('input[type=number]');
        const qtyEl = row.querySelectorAll('input[type=number]')[1];
        if (priceEl && qtyEl) fee += (parseFloat(priceEl.value) || 0) * (parseInt(qtyEl.value) || 1);
      });
      const transport = parseFloat($('fTransport').value) || 0;
      const discount = parseFloat($('fDiscount').value) || 0;
      const paid = parseFloat($('fPaid').value) || 0;
      const subtotal = fee + transport;
      const total = Math.max(0, subtotal - discount);
      const due = Math.max(0, total - paid);
      $('sumFee').textContent = fmtRp(fee);
      $('sumTransport').textContent = fmtRp(transport);
      $('sumSubtotal').textContent = fmtRp(subtotal);
      $('sumDiscount').textContent = fmtRp(discount);
      $('sumTotal').textContent = fmtRp(total);
      $('sumDue').textContent = fmtRp(due);

      const preview = $('fKetPreview');
      if (preview) {
        const method = $('fMethod')?.value || 'TF/QRIS';
        let ket;
        if (due <= 0) ket = 'LUNAS ' + (method === 'Cash' ? 'CASH' : 'TF/QRIS');
        else if (paid > 0) ket = 'DP';
        else ket = 'BELUM BAYAR';
        preview.value = ket;
      }
    }

    function saveSchedule() {
      const items = [];
      document.querySelectorAll('.item-row').forEach(row => {
        const sel = row.querySelector('select');
        const inputs = row.querySelectorAll('input[type=number]');
        const price = parseFloat(inputs[0]?.value) || 0;
        const qty = parseInt(inputs[1]?.value) || 1;
        if (sel && sel.value) items.push({ treatment_id: sel.value, treatment_name: sel.options[sel.selectedIndex].text, price, qty, subtotal: price * qty });
      });
      if (!$('fDate').value) { toast('Tanggal wajib diisi', 'warning'); return; }
      if (!items.length) { toast('Tambahkan minimal satu treatment', 'warning'); return; }
      const scData = {
        customer_id: $('fCust').value || null, therapist_id: $('fTherapist').value || null,
        schedule_date: $('fDate').value, schedule_time: $('fTime').value,
        location: $('fLoc').value, km: parseFloat($('fKm').value) || 0,
        items, transport_fee: parseFloat($('fTransport').value) || 0,
        discount: parseFloat($('fDiscount').value) || 0,
        paid_amount: parseFloat($('fPaid').value) || 0,
        payment_method: $('fMethod').value,
        notes: $('fNotes').value
      };
      loading(true, 'Menyimpan jadwal...');
      ga('addSchedule', [scData, S.user.id, S.user.role], res => {

    function savePayment(schedId, custId) {
      const amt = parseFloat($('payAmt').value) || 0;
      if (amt <= 0) { toast('Jumlah pembayaran harus > 0', 'warning'); return; }
      const payData = { schedule_id: schedId, customer_id: custId || null, amount: amt, method: $('payMethod').value, reference_no: $('payRef').value, payment_date: $('payDate').value, notes: $('payNotes').value };
      loading(true, 'Menyimpan pembayaran...');
      ga('addSchedulePayment', [payData, S.user.id, S.user.role], res => {
        loading(false);
        if (res.success) { toast('Pembayaran berhasil dicatat!', 'success'); closeModal(); loadSchedules(); }
        else toast(res.message, 'error');
      });
    }

    function deleteSchedule(id) {
      confirm('Hapus Jadwal?', 'Jadwal dan semua data terkait akan dihapus permanen.', 'danger', () => {
        loading(true, 'Menghapus...');
        ga('deleteSchedule', [id, S.user.id, S.user.role], res => {
          loading(false);
          if (res.success) { toast('Jadwal berhasil dihapus', 'success'); loadSchedules(); }
          else toast(res.message, 'error');
        });
      });

      const label = status === 'done' ? 'menandai jadwal sebagai SELESAI' : 'membatalkan jadwal ini';

        loading(true, 'Mengubah status...');

          loading(false);

          else toast(res.message, 'error');
        });
      });

      loading(true, 'Menyimpan...');
      ga(id ? 'updateCustomer' : 'addCustomer', [cuData, S.user.id, S.user.role], res => {
        loading(false);
        if (res.success) { toast(res.message, 'success'); closeModal(); renderPelanggan(); }
        else toast(res.message, 'error');

    function openTreatmentModalById(id) {
      const t = (S.data.treatments || []).find(x => String(x.id) === String(id));
      if (!t) { toast('Data treatment tidak ditemukan', 'error'); return; }

    function saveTreatment(id) {
      const tr = id ? (S.data.treatments || []).find(x => String(x.id) === String(id)) : null;
      const trData = { category: $('tCat').value, name: $('tName').value.trim(), description: $('tDesc').value, price: parseFloat($('tPrice').value) || 0, duration_min: parseInt($('tDur').value) || 60, is_active: $('tActive') ? ($('tActive').checked ? 1 : 0) : (tr ? tr.is_active : 1) };
      if (!trData.name || !trData.price) { toast('Nama dan harga wajib diisi', 'warning'); return; }
      if (id) trData.id = id;
      loading(true, 'Menyimpan...');
      ga(id ? 'updateTreatment' : 'addTreatment', [trData, S.user.id, S.user.role], res => {
        loading(false);
        if (res.success) { toast(res.message, 'success'); closeModal(); renderPricelist(); }
        else toast(res.message, 'error');
      });
    }

    function deleteTreatment(id) {
      confirm('Hapus Treatment?', 'Treatment akan dihapus permanen.', 'danger', () => {
        loading(true);
        ga('deleteTreatment', [id, S.user.id, S.user.role], res => {
          loading(false);
          if (res.success) { toast('Treatment dihapus', 'success'); renderPricelist(); }
          else toast(res.message, 'error');
        });
      });
    }

        $('settingsContent').innerHTML = `
    <div class="form-section">
      <div class="form-section-title"><i class="fa fa-store"></i> Informasi Bisnis</div>
      <div class="form-row cols-2">
        <div class="fg"><label>Nama Bisnis</label><input id="sBizName" value="${sanitize(s.business_name || 'Daisafacare')}"></div>
        <div class="fg"><label>Tagline</label><input id="sBizTag" value="${sanitize(s.business_tagline || 'Mom & Baby Treatment')}"></div>
      </div>
      <div class="form-row cols-2">
        <div class="fg"><label>No. HP</label><input id="sBizPhone" value="${sanitize(s.business_phone || '')}"></div>
        <div class="fg"><label>Alamat</label><input id="sBizAddr" value="${sanitize(s.business_address || '')}"></div>
      </div>
      <div class="form-row cols-2">
        <div class="fg"><label>Instagram</label><input id="sBizIG" value="${sanitize(s.business_instagram || '')}"></div>
        <div class="fg"><label>TikTok</label><input id="sBizTT" value="${sanitize(s.business_tiktok || '')}"></div>
      </div>
      <div class="fg" style="margin-bottom:12px"><label>Info Pembayaran (untuk Invoice)</label><textarea id="sBizPay" rows="2">${sanitize(s.payment_info || '')}</textarea></div>
      <div class="form-row cols-2">
        <div class="fg"><label>Transport per KM (Rp)</label><input type="number" id="sTransRate" value="${sanitize(s.transport_rate_per_km || '2000')}"></div>
        <div class="fg"><label>Footer Invoice</label><input id="sInvFooter" value="${sanitize(s.invoice_footer || '')}"></div>
      </div>
      <div class="form-row cols-2">
        <div class="fg"><label>Prefix Invoice</label><input id="sInvPrefix" value="${sanitize(s.invoice_prefix || 'DSF')}" placeholder="DSF"></div>
        <div class="fg"><label>Simbol Mata Uang</label><input id="sCurrency" value="${sanitize(s.currency_symbol || 'Rp')}" placeholder="Rp"></div>
      </div>
      <button class="btn btn-primary" onclick="saveBizSettings()"><i class="fa fa-floppy-disk"></i> Simpan Pengaturan</button>
    </div>`;
      } else if (tab === 'users') {
        if (!isAdmin()) { $('settingsContent').innerHTML = '<div class="table-empty"><i class="fa fa-lock"></i>Akses ditolak</div>'; return; }
        $('settingsContent').innerHTML = `<div class="section-hdr"><h2><i class="fa fa-users"></i> Manajemen Pengguna</h2><button class="btn btn-primary" onclick="openUserModal()"><i class="fa fa-plus"></i> Tambah</button></div><div id="userTable"><div class="table-empty"><i class="fa fa-spinner fa-spin"></i></div></div>`;
        ga('getUsers', [S.user.id, S.user.role], res => {
          if (!res.success) { $('userTable').innerHTML = `<div class="table-empty">${sanitize(res.message)}</div>`; return; }
          S.data.users = res.data;
          $('userTable').innerHTML = `<div class="card"><div class="table-wrap"><table><thead><tr><th>Nama</th><th>Email</th><th>Role</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${res.data.map(u => `<tr>
        <td style="font-weight:700">${sanitize(u.full_name)}</td>
        <td style="font-size:13px">${sanitize(u.email)}</td>
        <td><span class="badge badge-${sanitize(u.role)}">${sanitize(u.role)}</span></td>
        <td><span class="badge" style="background:${u.is_active ? 'var(--success-bg)' : 'var(--danger-bg)'};color:${u.is_active ? 'var(--success)' : 'var(--danger)'}">${u.is_active ? 'Aktif' : 'Nonaktif'}</span></td>
        <td style="white-space:nowrap">
          <button class="btn btn-sm btn-outline" onclick="openUserModalById(${u.id})"><i class="fa fa-edit"></i></button>
          ${u.id !== S.user.id ? `<button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id})"><i class="fa fa-trash"></i></button>` : ''}
        </td>
      </tr>`).join('')}</tbody></table></div></div>`;
        });
      } else if (tab === 'profile') {
        const u = S.user;
        $('settingsContent').innerHTML = `
    <div class="form-section">
      <div class="form-section-title"><i class="fa fa-user"></i> Profil Saya</div>
      <div class="form-row cols-2">
        <div class="fg"><label>Nama Lengkap</label><input id="pName" value="${sanitize(u.full_name)}"></div>
        <div class="fg"><label>No. HP</label><input id="pPhone" value="${sanitize(u.phone || '')}"></div>
      </div>
      <div class="fg" style="margin-bottom:10px"><label>Email</label><input value="${sanitize(u.email)}" disabled style="opacity:0.6;background:var(--cream-dark)"></div>
      <button class="btn btn-primary" onclick="saveProfile()"><i class="fa fa-floppy-disk"></i> Simpan</button>
    </div>
    <div class="form-section">
      <div class="form-section-title"><i class="fa fa-lock"></i> Ganti Password</div>
      <div class="form-row cols-3">
        <div class="fg"><label>Password Lama</label><input type="password" id="pwdOld"></div>
        <div class="fg"><label>Password Baru</label><input type="password" id="pwdNew"></div>
        <div class="fg"><label>Konfirmasi</label><input type="password" id="pwdCon"></div>
      </div>
      <button class="btn btn-outline" onclick="savePwd()"><i class="fa fa-key"></i> Ganti Password</button>
    </div>`;
      }
    }

    function saveBizSettings() {
      const settings = { business_name: $('sBizName').value, business_tagline: $('sBizTag').value, business_phone: $('sBizPhone').value, business_address: $('sBizAddr').value, business_instagram: $('sBizIG').value, business_tiktok: $('sBizTT').value, payment_info: $('sBizPay').value, transport_rate_per_km: $('sTransRate').value, invoice_footer: $('sInvFooter').value, invoice_prefix: ($('sInvPrefix').value || 'DSF').trim(), currency_symbol: ($('sCurrency').value || 'Rp').trim() };
      loading(true, 'Menyimpan...');
      ga('saveAllSettings', [settings, S.user.id, S.user.role], res => {
        loading(false);
        if (res.success) { Object.assign(S.settings, settings); toast('Pengaturan disimpan!', 'success'); }
        else toast(res.message, 'error');
      });
    }

    function saveProfile() {
      const d = { full_name: $('pName').value.trim(), phone: $('pPhone').value };
      if (!d.full_name) { toast('Nama wajib diisi', 'warning'); return; }
      loading(true);
      ga('updateProfile', [d, S.user.id], res => {
        loading(false);
        if (res.success) { S.user.full_name = d.full_name; S.user.phone = d.phone; $('sidebarName').textContent = d.full_name; $('sidebarAvatar').textContent = d.full_name.charAt(0); toast('Profil diperbarui!', 'success'); }
        else toast(res.message, 'error');
      });
    }

    function savePwd() {
      const old = $('pwdOld').value, nw = $('pwdNew').value, cn = $('pwdCon').value;
      if (!old || !nw) { toast('Semua field wajib diisi', 'warning'); return; }
      if (nw !== cn) { toast('Konfirmasi password tidak cocok', 'warning'); return; }
      if (nw.length < 6) { toast('Password minimal 6 karakter', 'warning'); return; }
      loading(true);
      ga('changePassword', [S.user.id, old, nw], res => {
        loading(false);
        if (res.success) { toast('Password berhasil diubah!', 'success'); $('pwdOld').value = ''; $('pwdNew').value = ''; $('pwdCon').value = ''; }
        else toast(res.message, 'error');
      });
    }

    function openUserModal(u) {
      if (!isAdmin()) { toast('Akses ditolak', 'error'); return; }
      $('modalContainer').innerHTML = `
  <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal modal-sm">
      <div class="modal-header"><h3><i class="fa fa-user-gear"></i> ${u ? 'Edit' : 'Tambah'} Pengguna</h3><button class="modal-close" onclick="closeModal()"><i class="fa fa-xmark"></i></button></div>
      <div class="modal-body">
        <div class="fg" style="margin-bottom:12px"><label>Nama Lengkap *</label><input id="uName" value="${sanitize(u?.full_name || '')}"></div>
        <div class="fg" style="margin-bottom:12px"><label>Email *</label><input type="email" id="uEmail" value="${sanitize(u?.email || '')}"></div>
        <div class="form-row cols-2">
          <div class="fg"><label>No. HP</label><input id="uPhone" value="${sanitize(u?.phone || '')}"></div>
          <div class="fg"><label>Role</label><select id="uRole"><option value="admin">Admin</option><option value="therapist">Terapis</option><option value="receptionist">Resepsionis</option></select></div>
        </div>
        <div class="fg" style="margin-bottom:12px"><label>Password ${u ? '(kosongkan jika tidak diubah)' : ' *'}</label><input type="password" id="uPwd" placeholder="${u ? 'Kosongkan jika tidak diubah' : 'Minimal 6 karakter'}"></div>
        ${u ? `<div class="fg"><label>Status</label><select id="uActive"><option value="1">Aktif</option><option value="0">Nonaktif</option></select></div>` : ''}
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
        <button class="btn btn-primary" onclick="saveUser(${u?.id || null})"><i class="fa fa-floppy-disk"></i> Simpan</button>
      </div>
    </div>
  </div>`;
      if (u) { $('uRole').value = u.role; if ($('uActive')) $('uActive').value = u.is_active; }
    }

    // Lookup by id — menghindari JSON inline pada atribut onclick
    function openUserModalById(id) {
      const u = (S.data.users || []).find(x => String(x.id) === String(id));
      if (!u) { toast('Data pengguna tidak ditemukan', 'error'); return; }
      openUserModal(u);
    }

    function saveUser(id) {
      const d = { full_name: $('uName').value.trim(), email: $('uEmail').value.trim(), phone: $('uPhone').value, userRole: $('uRole').value, password: $('uPwd').value };
      if (id) { d.id = id; d.is_active = $('uActive').value; }
      loading(true);
      ga(id ? 'updateUser' : 'addUser', [d, S.user.id, S.user.role], res => {
        loading(false);
        if (res.success) { toast(res.message, 'success'); closeModal(); loadSettingsTab('users'); }
        else toast(res.message, 'error');
      });
    }

    function deleteUser(id) {
      confirm('Hapus Pengguna?', 'Pengguna akan dihapus permanen.', 'danger', () => {
        loading(true);
        ga('deleteUser', [id, S.user.id, S.user.role], res => {
          loading(false);
          if (res.success) { toast('Pengguna dihapus', 'success'); loadSettingsTab('users'); }
          else toast(res.message, 'error');
        });
      });
    }




    function renderLogs() {
      $('pageContent').innerHTML = '<div class="card" id="logsWrap"><div class="table-empty"><i class="fa fa-spinner fa-spin"></i></div></div>';
      ga('getLogs', [S.user.id, S.user.role, 200], res => {
        if (!res.success) { toast(res.message, 'error'); return; }
        const logIcons = { LOGIN: 'fa-right-to-bracket', CREATE: 'fa-plus', UPDATE: 'fa-pen', DELETE: 'fa-trash', CANCEL: 'fa-ban' };
        $('logsWrap').innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>Waktu</th><th>Pengguna</th><th>Aksi</th><th>Tabel</th><th>Detail</th></tr></thead>
      <tbody>${res.data.length ? res.data.map(l => `<tr>
        <td style="font-size:12px;white-space:nowrap">${new Date(l.created_at).toLocaleString('id-ID')}</td>
        <td style="font-weight:600">${sanitize(l.username)}</td>
        <td><span class="badge" style="background:var(--cream-dark);color:var(--sage-dark)"><i class="fa ${logIcons[l.action] || 'fa-circle'}"></i> ${sanitize(l.action)}</span></td>
        <td style="font-size:12px">${sanitize(l.table_name)}</td>
        <td style="font-size:12px;color:var(--text-muted)">${sanitize(l.details)}</td>
      </tr>`).join('') : '<tr><td colspan="5" class="table-empty"><i class="fa fa-list"></i>Belum ada log</td></tr>'}</tbody>
    </table></div>`;
      });
    }

    // ═══════════════════════════════════════════════════════════════
    //  AUTO-LOGIN (remember session)
    // ═══════════════════════════════════════════════════════════════
    (function init() {
      try {
        const saved = localStorage.getItem('dsf_user');
        if (saved) {
          const user = JSON.parse(saved);
          if (user && user.id && user.email) {
            S.user = user;
            startApp();
            return;
          }
        }
      } catch (e) { }
      // Default: show login
      $('loginPage').style.display = 'flex';
      $('app').style.display = 'none';
    })();
  </script>
</body>

</html>
